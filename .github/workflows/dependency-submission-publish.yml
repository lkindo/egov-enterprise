name: Publish PR Gradle Dependency Graph

# SECURITY: workflow_run은 write token을 받을 수 있으므로 untrusted PR 소스나 일반 artifact를
# 실행하면 안 된다. 이 잡은 Gradle 공식 action이 triggering run의 graph artifact를 읽어
# Dependency Submission API에 제출하는 일만 한다. checkout/run/cache 복원은 의도적으로 없다.

on:
  workflow_run:
    workflows: ["Gradle Dependency Graph Producer"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: dependency-graph-publisher-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  submit-pr-snapshot:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and submit the triggering PR dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true
