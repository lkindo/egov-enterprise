name: Lighthouse (frontend runtime performance)

# [2026-08-09 신설] 프론트 **런타임 성능·접근성을 재는 것이 아무것도 없었다.**
#
#   frontend/lighthouserc.json 과 package.json 의 lighthouse 스크립트는 **이미 있었는데**
#   어떤 워크플로도 그것을 실행하지 않았다 — 설정만 있고 측정은 없는 상태였다.
#   백엔드는 부하 테스트가 완주해 p(95) 를 남기는데(load-test.yml),
#   사용자가 실제로 체감하는 프론트 쪽 수치는 아무도 재고 있지 않았다.
#
# ⚠ 측정 대상을 /admin → /login 으로 바꿨다.
#   /admin 은 미들웨어가 미인증 요청을 **307 로 /login 에 리다이렉트**한다(실측).
#   즉 종전 설정으로 측정했다면 admin 화면이 아니라 로그인 화면을 재면서
#   "admin 성능" 이라고 이름 붙이는 셈이었다. 로그인은 **모든 사용자가 처음 보는 공개 화면**이고
#   인증 없이 결정적으로 잴 수 있다.
#
# ⚠ 성능 임계값은 'warn' 으로 시작한다 — CI 러너의 CPU 변동이 커서 error 로 두면
#   코드와 무관한 red 가 반복된다. 접근성은 러너 변동에 둔감하므로 'error' 로 강제한다.
#   (AGENTS H5: 게이트라고 부르려면 결정적이어야 한다. 아직 아닌 축은 그렇다고 밝힌다.)
#
# 커밋 단위 게이트가 아니라 주간 관측이다 — ci.yml 을 늘리지 않는다.

on:
  schedule:
    - cron: "0 19 * * 0" # 매주 일요일 04:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # ci.yml 의 frontend-build 와 같은 순서다 — setup-node 의 cache:"pnpm" 이
      #   캐시 경로를 알아내려고 pnpm 실행 파일을 호출하므로 설치가 먼저여야 한다.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # [2026-08-09 신설 — 첫 수동 실행이 이것 때문에 실패했다]
      #   `next start` 는 NODE_ENV=production 이고, 미들웨어는 prod 에서 JWT_SECRET 이 없으면
      #   **모듈 로드 시점에 throw** 한다(공개된 dev 기본값으로 조용히 서명 검증하는 최악 상태 방지).
      #   matcher 가 `/((?!_next/static|_next/image|favicon.ico).*)` 라 /login 도 그 대상이므로
      #   **모든 페이지 요청이 500** 이 되고, Lighthouse 는 ERRORED_DOCUMENT_REQUEST 로 죽는다.
      #   실측(run 31319613189): 리포트 0건 — 즉 이 워크플로는 성능을 **하나도 재지 못했다.**
      #
      #   ci.yml 의 e2e 잡이 이미 같은 문제를 같은 방식으로 풀어 뒀다(`openssl rand -hex 44`).
      #   여기서는 백엔드와 대칭일 필요가 없다 — 로그인하지 않는 공개 화면만 재기 때문이다.
      #   회차마다 새로 만들므로 저장소에 시크릿을 남기지 않는다.
      #
      # ⚠ **빌드 이전**이어야 한다. 미들웨어는 Edge Runtime 이고 Next 는 Edge 번들의
      #   `process.env` 를 **빌드 시점에 인라인**한다(ci.yml 의 2026-07-28 캐시 오염 사례 참조).
      #   기동 직전에 넣으면 번들에는 이미 값이 없는 상태로 박혀 있어 아무 효과가 없다.
      - name: Generate ephemeral JWT secret (측정 전용 · 회차마다 폐기)
        run: echo "JWT_SECRET=$(openssl rand -hex 44)" >> "$GITHUB_ENV"

      # lhci 가 startServerCommand 로 `next start` 를 띄우므로 빌드가 선행돼야 한다.
      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Run Lighthouse CI
        working-directory: frontend
        run: pnpm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: frontend/.lighthouseci
          retention-days: 30

      # 리포트가 실제로 생겼는지 확인한다 — dependency-check 에서 겪은 것과 같은 형태의
      #   거짓 초록(스텝은 통과했는데 산출물이 0건)을 여기서 되풀이하지 않는다.
      - name: Verify reports were actually produced
        if: always()
        run: |
          set -euo pipefail
          COUNT=$(find frontend/.lighthouseci -name '*.report.json' 2>/dev/null | wc -l)
          echo "생성된 Lighthouse 리포트: ${COUNT}건"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Lighthouse 리포트가 생성되지 않았습니다 — 이 실행은 성능을 **측정하지 못했습니다**."
            exit 1
          fi
          find frontend/.lighthouseci -name '*.report.json' -printf '  %f\n'
