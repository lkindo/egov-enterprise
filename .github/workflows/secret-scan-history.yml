name: Secret Scan (history audit)

# [이 워크플로는 게이트가 아니다 — 감사 도구다]
#
# ci.yml 의 `secret-scan` 잡은 **워킹트리 + 증분**만 본다(신규 유입 차단). 그것이 머지 게이트다.
# 이 워크플로는 **히스토리 전량**을 훑는다. 분리한 이유는 하나다 —
#
#   히스토리 전량 스캔은 이 저장소에서 **원리적으로 초록이 될 수 없다.**
#   실측(2026-08-03, gitleaks 8.28.0, 2300 커밋): leak 1351건이 전부 이미 공개된 과거에서 나온다.
#     · frontend/playwright/.auth/{admin,user}.json  2092건 (E2E 인증상태 산출물이 커밋됐던 시기)
#     · api-server/LOG_FILE_IS_UNDEFINED             366건 (LOG_FILE 미해석 로그가 파일로 커밋됨)
#     · test_result_*.txt / business_suite_test_*.txt / dump/supabase_full.sql
#   전부 현재 HEAD 에는 없는 파일이다. 즉 앞으로 아무리 잘해도 이 스캔은 계속 빨갛다.
#
# 되돌릴 수 없는 과거로 상시 red 인 잡을 머지 게이트에 두면 두 가지 중 하나가 일어난다 —
# 아무도 안 보거나, 우회 습관이 생긴다. 둘 다 게이트를 없애는 것과 같다.
# (감사 보고서가 '게이트 강화 → 준수율 하락' 상충으로 지목한 바로 그 지점이다.)
#
# [그래서 이 워크플로의 용도]
#   · 노출 범위를 주기적으로 **확인**한다(줄었는지, 새로운 종류가 생겼는지).
#   · 리포트를 아티팩트로 남겨 로테이션 판단의 근거로 쓴다.
#   · 실패해도 아무 것도 막지 않는다. 대신 **결과를 숨기지도 않는다** — 요약을 잡 서머리에 찍는다.
#
# [진짜 해법] 이미 공개된 유출은 목록화로 닫히지 않는다. 로테이션이다.
#   · docs/04-operations/crypto-key-rotation.md   (암호화 마스터 키)
#   · docs/04-operations/pending-decisions.md     (ssh-key-2026-01-18.key — 로테이션·실물 삭제 미결)

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 09:00 KST (00:00 UTC). 노출 범위 변화를 추적하는 용도라 빈도는 낮게 둔다.
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (full history)
        id: scan
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

          # exit-code 0: 이 워크플로는 차단하지 않는다. 판정이 아니라 관측이다.
          ./gitleaks detect --source . --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --report-format json --report-path gitleaks-history.json --exit-code 0

          COUNT=$(python3 -c "import json;print(len(json.load(open('gitleaks-history.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          # 숨기지 않는다 — 건수와 상위 분포를 잡 서머리에 남긴다.
          {
            echo "## 히스토리 시크릿 스캔 결과"
            echo ""
            echo "총 **${COUNT}건** (이 워크플로는 차단하지 않습니다 — 관측 목적)"
            echo ""
            echo "### 규칙·파일별 상위"
            echo ""
            echo '```'
            python3 - <<'PY'
import json, collections
rows = json.load(open('gitleaks-history.json'))
c = collections.Counter((r['RuleID'], r['File']) for r in rows)
for (rule, f), n in c.most_common(15):
    print(f"{n:6}  {rule:20} {f}")
PY
            echo '```'
            echo ""
            echo "이미 공개된 과거 유출은 목록화가 아니라 **로테이션**으로 닫습니다 —"
            echo "\`docs/04-operations/crypto-key-rotation.md\` · \`docs/04-operations/pending-decisions.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload history report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history.json
          if-no-files-found: warn
          retention-days: 90
