name: Independent migration tool verification

on:
  push:
    branches: [main, master]
    paths:
      - 'migration-tool/**'
      - '**/*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.nvmrc'
      - 'package.json'
      - 'scripts/verify.mjs'
      - 'scripts/migration-verification-contract.test.mjs'
      - 'scripts/required-checks-contract.mjs'
      - '.github/workflows/migration-tool.yml'
  pull_request:
    paths:
      - 'migration-tool/**'
      - '**/*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.nvmrc'
      - 'package.json'
      - 'scripts/verify.mjs'
      - 'scripts/migration-verification-contract.test.mjs'
      - 'scripts/required-checks-contract.mjs'
      - '.github/workflows/migration-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70  # v3

      - name: Allow the checked-in Gradle wrapper to run
        run: chmod +x gradlew

      - name: Verify the independent migration module
        run: node scripts/verify.mjs migration

      - name: Retain the verified migration CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: migration-tool-${{ github.sha }}
          path: migration-tool/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
