name: Independent migration tool verification

on:
  # Full independent-module regression; ordinary PR/push execution belongs to ci.yml.
  schedule:
    - cron: '23 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The measured duration profile is bound to its historical source commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Allow the checked-in Gradle wrapper to run
        run: chmod +x gradlew

      - name: Verify the independent migration module
        run: node scripts/verify.mjs migration

      - name: Retain the verified migration CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migration-tool-${{ github.sha }}
          path: migration-tool/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Retain independent migration coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migration-coverage-${{ github.sha }}
          path: |
            build/reports/jacoco/migration
            build/reports/jacoco/jacocoMigrationReport/jacocoMigrationReport.xml
          if-no-files-found: error
          retention-days: 7
