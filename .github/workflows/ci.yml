name: Java CI with Gradle

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew build jacocoTestReport -Dopenapi.export.path=api-docs.json

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: api-docs.json

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/build/reports/jacoco/test/html/"

  frontend-build:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Download OpenAPI Spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Verify API Type Synchronization
        run: npm run codegen:verify
        working-directory: frontend

      - name: Build and Test
        run: |
          npm run build
          npm run test
        working-directory: frontend

  docker-build-verification:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Verify)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api-server/Dockerfile
          push: false
          tags: egov-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image (Verify)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: egov-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-tests:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Infrastructure (DB & API)
        run: docker-compose up -d db api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: |
          # Start frontend in background and wait for it to be ready
          pnpm dev --port 3001 &
          npx wait-on http://127.0.0.1:3001/login --timeout 60000
          # Run tests
          pnpm exec playwright test e2e/login.spec.ts e2e/dashboard.spec.ts e2e/bbs.spec.ts e2e/admin-user.spec.ts e2e/realtime.spec.ts e2e/adb.spec.ts --workers=1
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
