name: Java CI with Gradle

on:
  push:
    branches: [main, master]
  # 모든 PR에 체크를 등록한다. base 필터는 스택 PR에 검증 자체가 없는 fail-open 경로를 만든다.
  pull_request:
  # 수동 진단 실행은 허용하되, immutable event base가 없는 durability required gate는
  # 의도적으로 fail-closed하므로 병합 권위의 green을 대체할 수 없다.
  workflow_dispatch:

permissions:
  contents: read

# PR 등 main 밖의 ref에서는 최신 커밋만 검증 권위를 가진다. 이전 실행을 취소해 러너 낭비와 결과 혼선을 막는다.
# main 은 커밋마다 따로 끝까지 검증한다(GAP-CI-001·DEC-OPS-178). push 범위는 직전 main SHA(event.before)와의
# 차이라, 앞 실행이 취소되거나 대기 중에 다음 실행으로 교체되면 그 커밋의 코드는 어떤 main 실행에서도
# 검사되지 않는다. 같은 그룹을 쓰면 취소를 끄더라도 대기 중인 실행은 교체되므로 그룹도 SHA 로 나눈다.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 공통 환경 변수
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers

jobs:
  # Cheap, fail-closed change classifier. Workflow-level path filters are not
  # used because a skipped workflow leaves required checks pending. Unknown or
  # empty ranges deliberately select every heavy gate.
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions:read lets the classifier confirm that the push base had its own main CI run.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      migration: ${{ steps.scope.outputs.migration }}
      frontend: ${{ steps.scope.outputs.frontend }}
      schema: ${{ steps.scope.outputs.schema }}
      e2e: ${{ steps.scope.outputs.e2e }}
      mutation: ${{ steps.scope.outputs.mutation }}
      mutation-migration-tool: ${{ steps.scope.outputs.mutation_migration_tool }}
      reusable: ${{ steps.scope.outputs.reusable }}
      reusable-custom: ${{ steps.scope.outputs.reusable_custom }}
      reusable-matrix: ${{ steps.scope.outputs.reusable_matrix }}
      sast: ${{ steps.scope.outputs.sast }}
      docs-only: ${{ steps.scope.outputs.docs_only }}
      atlas: ${{ steps.scope.outputs.atlas }}
      unknown-count: ${{ steps.scope.outputs.unknown_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify changed paths (unknown means full pipeline)
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$PR_BASE_SHA"
          HEAD="$PR_HEAD_SHA"
          if [ -z "$BASE" ]; then
            BASE="$PUSH_BASE_SHA"
            HEAD="$GITHUB_SHA"
          fi

          # PR and integration pushes use the same fail-closed impact mapping.
          # Manual execution and an unavailable base select the complete suite.
          # The event decides the reusable layouts only: a PR verifies one layout per preset,
          # every other event both layouts (ADR-0027).
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            node scripts/ci-change-scope.mjs --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$BASE" "${HEAD:-$GITHUB_SHA}"; then
            node scripts/ci-change-scope.mjs --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
          else
            # A push base without its own main CI run (a dropped push event) was never verified;
            # the classifier then selects the full pipeline instead of trusting the diff.
            VERIFY_BASE=()
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then VERIFY_BASE=(--verify-push-base-run); fi
            node scripts/ci-change-scope.mjs \
              --base "$BASE" \
              --head "${HEAD:-$GITHUB_SHA}" \
              "${VERIFY_BASE[@]}" \
              --event "$GITHUB_EVENT_NAME" \
              --github-output "$GITHUB_OUTPUT"
          fi

  # CodeQL scans the complete source population when code/configuration changes.
  # Do not replace this with a diff-only baseline or suppress existing findings.
  sast-scope:
    needs: change-scope
    if: needs.change-scope.outputs.sast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # PR diff filtering drops unchanged taint findings and breaks full-scan policy.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
    strategy:
      # 20-runner pool에서 E2E/reusable 임계 작업이 밀리지 않게 두 언어를 한 슬롯에서 실행한다.
      # run 36575378891의 합산 실측은 약 7분 20초라 12분 목표 안에서 양언어 전수 분석을 유지한다.
      max-parallel: 1
      fail-fast: false
      matrix:
        language: [java, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK for traced production compilation
        if: matrix.language == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Initialize CodeQL security analysis
        id: codeql
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java' && 'manual' || 'none' }}
          config-file: config/security/codeql.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.4/codeql-bundle-linux64.tar.gz

      - name: Trace all production Java modules
        if: matrix.language == 'java'
        run: ./gradlew compileJava --no-daemon --no-build-cache --rerun-tasks --console=plain -Dfile.encoding=UTF-8

      - name: Analyze secure coding
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          output: build/sast/raw
          upload: never
          upload-database: false

      - name: Enforce secure coding policy
        run: node scripts/sast-policy.mjs build/sast/raw/${{ matrix.language }}.sarif ${{ matrix.language }} build/sast/sanitized/${{ matrix.language }}.sarif build/sast/publish/${{ matrix.language }}.sarif

      - name: Prove secure coding detection and rejection
        env:
          CODEQL_PATH: ${{ steps.codeql.outputs.codeql-path }}
          # Prevent the native tracer from re-injecting the production environment.
          LD_PRELOAD: ''
        run: node scripts/sast-probe.mjs ${{ matrix.language }}

      - name: Upload sanitized security results
        if: always() && steps.analyze.outcome == 'success'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          sarif_file: build/sast/publish/${{ matrix.language }}.sarif
          category: secure-coding/${{ matrix.language }}

      # [2026-10-24 DEC-OPS-382 ⑤] main push 의 SARIF 는 90일, PR·수동 실행은 14일 보관한다.
      - name: Retain sanitized SAST evidence
        if: always() && steps.analyze.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sast-${{ matrix.language }}
          path: build/sast/sanitized/${{ matrix.language }}.sarif
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}

  secure-coding:
    needs: [change-scope, sast-scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 시큐어코딩 언어별 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.sast }}
          SOURCE_RESULT: ${{ needs.sast-scope.result }}
        run: node scripts/aggregate-required-check.mjs

  # 로컬 훅과 무관하게 required CI에서 gitleaks를 hard-fail로 실행한다.
  # 라이선스·가변 태그 노출을 피하려고 고정 버전 바이너리를 직접 내려받는다.
  secret-scan:
    # full run의 초기 작업은 이 job과 분류 직후의 custom 두 layout을 포함해 20-runner 한도 안이다.
    # 분류 직후 시작해 frontend 뒤 profile이 입장하기 전에 슬롯을 반납한다(ADR-0027).
    needs: [change-scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful change classification
        shell: bash
        run: |
          if [ "${{ needs.change-scope.result }}" != "success" ]; then
            echo "::error::변경 범위 분류가 실패하여 어떤 검증도 안전하게 생략할 수 없습니다."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 증분 스캔이 base..head 범위를 보려면 두 커밋이 모두 로컬에 있어야 한다.
          fetch-depth: 0

      # 현재 워킹트리와 이번 변경 범위를 모두 hard-fail로 검사해 신규 시크릿 유입을 차단한다.
      # 과거 전체 감사와 이미 노출된 자격의 회전은 별도 운영 절차이며, 대규모 예외 baseline을 만들지 않는다.
      - name: Run gitleaks (working tree + incremental)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          # 공식 릴리스 checksums.txt 의 linux_x64 tarball SHA-256 — VERSION 을 올리면 그 릴리스의 checksums.txt 에서 함께 바꾼다.
          # 받은 파일을 이 값으로 확인한 뒤에만 풀고 실행한다(일치하지 않으면 sha256sum 이 실패해 단계가 멈춘다).
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          ARCHIVE="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks

          echo "::group::① 워킹트리 스캔"
          ./gitleaks detect --source . --no-git --no-banner --redact --verbose \
            --report-format json --report-path gitleaks-worktree.json --exit-code 1
          echo "::endgroup::"

          # 비교 기준: PR 이면 base, push 면 이전 HEAD. 둘 다 없으면(초회 푸시·수동 실행) 워킹트리 스캔으로 충분하다.
          BASE=""
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ]; then
            echo "ℹ️ 비교 기준 커밋이 없어 증분 스캔을 생략합니다(워킹트리 스캔은 이미 통과)."
            exit 0
          fi

          echo "::group::② 증분 스캔 ($BASE..${{ github.sha }})"
          ./gitleaks detect --source . --no-banner --redact --verbose \
            --log-opts="$BASE..${{ github.sha }}" \
            --report-format json --report-path gitleaks-incremental.json --exit-code 1
          echo "::endgroup::"

      # 실패 보고서를 항상 보존해 탐지 위치를 확인할 수 있게 한다.
      - name: Upload gitleaks reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gitleaks-reports
          path: |
            gitleaks-worktree.json
            gitleaks-incremental.json
          if-no-files-found: ignore
          retention-days: 14

      # 이후 소스 투영 계약은 Git의 미추적 파일도 읽는다. 이 잡이 만든 바이너리와
      # 리포트를 build 아래에 보존해 검사 입력이나 재사용 산출물로 복사되지 않게 한다.
      - name: Keep scanner artifacts outside the source census
        run: |
          mkdir -p build/reports/gitleaks
          for output in gitleaks gitleaks-worktree.json gitleaks-incremental.json; do
            if [ -f "$output" ]; then
              mv -- "$output" build/reports/gitleaks/
            fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned operational contract dependencies
        run: npm ci --ignore-scripts

      # 운영 계약 카탈로그(scripts 의 test.mjs 묶음)에는 frontend 의존성을 실제로 로드하는
      # 계약이 있다 — generated-boundary-census 는 frontend 의 typescript 를 require 해
      # TS 컴파일러 AST 를 쓴다. 그래서 frontend 설치는 그 카탈로그의 전제이며, 카탈로그가
      # 무조건 실행되는 이상 설치도 무조건이어야 한다. 조건부로 두거나 카탈로그 뒤로 밀면
      # required check 가 typescript 모듈 부재로 죽는다(2026-09-01 실측).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - name: Install frontend dependencies for contract execution
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # 우회 가능한 로컬 훅에 의존하지 않도록 저장소 운영 계약을 required CI에서 다시 검증한다.
      - name: Verify repository operational contracts
        env:
          # PR/push 전체 변경 구간의 immutable base를 사용한다. 수동 실행에는
          # 신뢰 가능한 predecessor가 없으므로 durability gate가 의도적으로 fail-closed한다.
          UI_QUALITY_INDEX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:operational-contracts

      - name: Verify Prometheus alert firing and recovery
        run: npm run verify:alerts

      # Ordinary review dates are maintenance signals. Invalid input still fails;
      # pending institution approval is checked by the separate adoption command.
      - name: Report governance review freshness
        run: |
          mkdir -p build/reports/governance
          node scripts/governance-review.mjs --product online --mode report > build/reports/governance/review.json
          node scripts/governance-review-summary.mjs build/reports/governance/review.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload governance review report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: governance-review
          path: build/reports/governance/review.json
          if-no-files-found: error
          retention-days: 30

      # 크로스 스택 계약(frontend/src/__tests__/cross-stack — Atlas 계약 포함)은 백엔드
      # 소스를 함께 감사하므로 frontend 축이 아니라 여기서도 실행한다. 백엔드-only PR 은
      # frontend-scope 가 skip 되어 이 계약들이 어디서도 돌지 않았다 — 예: 서버 정렬을
      # `.desc()` → `.asc()` 로 바꾸는 변경에서, 정확히 그 드리프트를 잡는 계약이 실행 0 이었다.
      # frontend 축이 켜지면 required frontend-coverage-scope의 전체 스위트가 같은 모집단을
      # 소유한다. frontend가 꺼진 backend-only/Atlas 변경은 여기서 계속 검증한다.
      - name: Verify cross-stack contracts (frontend↔backend truth binding)
        if: (needs.change-scope.outputs.atlas == 'true' || needs.change-scope.outputs.backend == 'true') && needs.change-scope.outputs.frontend != 'true'
        run: pnpm exec vitest run src/__tests__/cross-stack
        working-directory: frontend

      # Gradle graph producer는 public fork에서도 read-only로 artifact를 만들고, 별도의
      # workflow_run 잡이 write token으로 제출한다. dependency-review-action 자체는 retry
      # timeout 뒤 snapshot warning이 남아도 비교를 계속하므로, required check가 Gradle
      # head snapshot 없이 녹색이 되지 않게 API warning header를 먼저 fail-closed 확인한다.
      - name: Require complete dependency snapshots
        if: github.event_name == 'pull_request' && (needs.change-scope.outputs.backend == 'true' || needs.change-scope.outputs.migration == 'true' || needs.change-scope.outputs.frontend == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_WAIT_SECONDS: "600"
        run: node scripts/dependency-snapshot-readiness.mjs

      # PR에서 새로 유입되는 운영 의존성만 증분 비교한다. 기존 의존성 전수 CVE DB 스캔은
      # dependency-check.yml의 주간 실행이 담당해, 매 커밋의 40분대 중복 비용을 되살리지 않는다.
      - name: Block newly introduced high-risk runtime dependencies
        if: github.event_name == 'pull_request' && (needs.change-scope.outputs.backend == 'true' || needs.change-scope.outputs.migration == 'true' || needs.change-scope.outputs.frontend == 'true')
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false
          warn-only: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60

  # Conditional heavy source. The stable `backend-build` required context is
  # emitted by the fail-closed aggregate below, including docs-only changes.
  backend-scope:
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # 콜드 캐시와 Testcontainers 기동을 포함한 백엔드 전체 게이트에 필요한 상한이다.
    # 장시간 dependency 감사는 주간 워크플로가 담당한다.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          # Sole writer when online verification is selected; all matrix jobs only restore.
          cache-disabled: false
          cache-read-only: false
          cache-overwrite-existing: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle 배포본 확보만 제한 재시도한다. 실제 빌드·테스트는 한 번만 실행해 실패 신호를 보존한다.
      - name: Provision Gradle distribution with bounded retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle 배포본을 3회 시도 후에도 확보하지 못했습니다."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Gradle 배포본 확보 실패(${attempt}/3), ${delay}초 후 재시도합니다."
            sleep "$delay"
          done

      # [2026-09-01 main 한정] 이 스텝은 빌드 캐시를 우회해 foundation 테스트를 한 번은 실제로
      #   돌리는 anti-vacuity 게이트다(`org.gradle.caching=true` + setup-gradle 캐시 복원이라
      #   캐시 히트로 스킵될 수 있다). 목적은 정당하지만 **비용이 순수 중복**이었다.
      #
      #   실측(run 33513096063 backend-scope): `:foundation:test` 가 같은 잡에서 두 번 실행됐다
      #   (13:28:35 이 스텝 · 13:29:22 아래 `build ... check`). `--no-build-cache` 는 결과를
      #   캐시에 넣지 않으므로 뒤따르는 build 가 캐시를 못 찾고 처음부터 다시 돌린다. 다른 네
      #   모듈은 각 1회인데 foundation 만 2회였고, 그 중복이 85초다.
      #
      #   Gradle 빌드 캐시는 입력 해시 기반이라 히트는 정당한 스킵이고, 이 저장소는 그 입력
      #   선언도 관리한다(api-server/build.gradle 의 flywayMigrations inputs.dir — SQL 만 바뀐
      #   커밋이 테스트를 스킵하지 못하게 한 이력). 그래서 PR 마다 지불할 이유는 약하다.
      #   다만 "캐시 키 계산이 틀린 경우" 라는 위험은 실재하므로 게이트를 없애지 않고
      #   **main 병합 시점**으로 옮긴다 — PR 은 85초 빨라지고 캐시 오염은 계속 잡힌다.
      - name: Cache-bypass regression gate (foundation, main only)
        if: github.ref == 'refs/heads/main' && needs.change-scope.outputs.schema == 'true'
        run: ./gradlew :foundation:test --no-build-cache --warning-mode fail --console=plain

      - name: Build and Test with Gradle
        id: build-and-test
        run: |
          set -o pipefail
          ./gradlew onlineBuild jacocoOnlineCoverageVerification "-Dopenapi.export.path=$GITHUB_WORKSPACE/api-docs.json" --warning-mode fail --console=plain 2>&1 | tee /tmp/build-and-test.log

      - name: Verify committed api-docs.json is fresh (contract drift gate)
        id: api-docs-gate
        # api-docs.json이 tracked 상태인지 먼저 확인해 삭제가 diff 검사에서 공집합 통과하지 않게 한다.
        run: |
          git ls-files --error-unmatch -- "$GITHUB_WORKSPACE/api-docs.json"
          git diff --exit-code -- "$GITHUB_WORKSPACE/api-docs.json"

      # [2026-10-24] 읽기 전용 PIT 잡이 Maven Central 에 가지 않게, 그 잡이 받는 외부 의존성을 이 writer 의 Gradle 캐시에 싣는다
      #   (build.gradle resolvePitDependencies — run 39597152074·39879169321 의 429·403). setup-gradle 의 post 는 잡이 붉어도 저장하므로
      #   시험 결과와 상관없이 돈다. 해석만 하고 재시도하지 않는다 — 실패는 그대로 붉다.
      - name: Resolve PIT dependencies into the Gradle cache
        id: pit-deps
        if: ${{ !cancelled() }}
        run: ./gradlew resolvePitDependencies --warning-mode fail --console=plain

      - name: Publish backend JUnit duration evidence
        if: always()
        run: node scripts/ci-junit-duration-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # [2026-10-24 DEC-OPS-382 ⑤] 온라인 모듈의 시험 결과 XML 을 보관한다 — 산출물 시험 목록(정적 추출)의 실행 증거다.
      #   main push 는 90일, PR·수동 실행은 14일이다. PR 실행은 영향 분류로 고른 시험의 결과다. 게이트가 아니다.
      - name: Retain backend test result XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-test-results
          path: |
            foundation/build/test-results/**/*.xml
            business-core/build/test-results/**/*.xml
            business-app/build/test-results/**/*.xml
            api-server/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          overwrite: true
        continue-on-error: true # 보관 업로드 — 게이트 아님

      - name: Check OpenAPI Spec Changes
        id: openapi-changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            api:
              - 'api-server/**'
              - 'foundation/**'
              - 'business-core/**'
              - 'business-app/**'
        continue-on-error: true # 아티팩트 업로드 판정용 — 게이트 아님

      - name: Upload OpenAPI Spec (if changed)
        if: steps.openapi-changes.outputs.api == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openapi-spec-changed
          path: api-docs.json
          retention-days: 30
        continue-on-error: true # 아티팩트 업로드 — 게이트 아님

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/online
            build/reports/jacoco/jacocoOnlineReport/jacocoOnlineReport.xml

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openapi-spec
          path: api-docs.json

      # 실패 스텝·마지막 출력·JUnit 메시지를 error annotation으로 노출해 로그 권한 없이도 진단하게 한다.
      - name: Surface failure detail (annotations)
        if: failure()
        run: |
          emit() { # $1=title  $2=file
            [ -f "$2" ] || return 0
            MSG=$(tail -c 3000 "$2" | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1::$MSG"
          }
          # 어떤 스텝이 실제로 실패했는지 먼저 명시 — 로그 tail 만 보면 통과한 스텝을 오인한다
          echo "::error title=실패 스텝 판정::build-and-test=${{ steps.build-and-test.outcome }} / api-docs-gate=${{ steps.api-docs-gate.outcome }} / pit-deps=${{ steps.pit-deps.outcome }}"
          # 컴파일/태스크 오류 본문을 별도로 발췌 — tail 창에 안 잡히는 경우가 있다
          if [ -f /tmp/build-and-test.log ]; then
            echo "::error title=오류 발췌(error:/What went wrong)::$(grep -E "error:|What went wrong|Compilation failed|FAILED$" -A 3 /tmp/build-and-test.log | tail -c 2500 | paste -sd' ' -)"
          fi
          emit "Build and Test 마지막 출력" /tmp/build-and-test.log
          # 실패한 JUnit 테스트의 클래스·메시지를 최대 5건 노출
          node scripts/ci-annotate-test-failures.mjs
          # 계약 드리프트 게이트가 붉을 때 무엇이 달라졌는지도 노출
          if ! git diff --quiet api-docs.json 2>/dev/null; then
            echo "::error title=api-docs.json 드리프트::$(git diff --stat api-docs.json)"
          fi

  # Physical schema validation is independent from online unit/coverage work.
  # Running it in a separate reader job removes a serial 6-minute segment while
  # backend-build still requires both sources through fail-closed aggregation.
  backend-schema-scope:
    needs: change-scope
    if: needs.change-scope.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pull timing is visible separately from container initialization and tests.
      - name: Pre-pull PostgreSQL image for Testcontainers
        id: schema-image
        run: docker pull --quiet postgres:17-alpine || (sleep 15 && docker pull --quiet postgres:17-alpine)

      - name: Real PostgreSQL Schema Validation (Testcontainers + Flyway + validate)
        id: schema-validation
        run: |
          set -o pipefail
          ./gradlew :api-server:schemaValidationTest --warning-mode fail --console=plain 2>&1 | tee /tmp/schema-validation.log

      - name: Publish schema JUnit duration evidence
        if: always()
        run: node scripts/ci-junit-duration-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Surface schema validation failure detail
        if: failure()
        run: |
          echo "::error title=실패 스텝 판정::image=${{ steps.schema-image.outcome }} / schema-validation=${{ steps.schema-validation.outcome }}"
          if [ -f /tmp/schema-validation.log ]; then
            echo "::error title=Schema Validation 마지막 출력::$(tail -c 3000 /tmp/schema-validation.log | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          node scripts/ci-annotate-test-failures.mjs

  # The migration module's 123 source test classes are an exact, duration-balanced
  # population. Each shard produces its own JaCoCo data; migration-scope below merges
  # all three files before applying the unchanged LINE 85% / BRANCH 70% gate.
  migration-test-scope:
    needs: change-scope
    if: needs.change-scope.outputs.migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The measured duration profile is bound to its historical source commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          # Only shard zero writes when the online backend writer is absent.
          cache-read-only: ${{ needs.change-scope.outputs.backend != 'false' || strategy.job-index != 0 }}

      - name: Allow the checked-in Gradle wrapper to run
        run: chmod +x gradlew

      - name: Verify migration contracts before the measured shard
        run: node --test scripts/migration-verification-contract.test.mjs

      - name: Run measured migration test shard (${{ matrix.shard }})
        run: node scripts/migration-test-shard.mjs --shard "${{ matrix.shard }}"

      # [2026-10-24] backend writer 가 없는 이관 전용 실행에서는 이 샤드가 새 캐시 키의 유일한 writer 다. 여기서 PIT 의존성을 받지 않으면
      #   그 키가 PIT 산출물 없이 저장되고, 같은 키는 다시 저장되지 않아 다음 *.gradle 변경까지 PIT 잡이 원격에서 받는다.
      #   backend-scope 의 같은 스텝과 같은 규칙(시험이 붉어도 돈다, 재시도하지 않는다)이다. 루트 태스크라 온라인 모듈의 의존성까지
      #   받으며(그 키에서 돌 온라인 PIT 잡의 몫), 원격 일시 장애로 붉으면 이관 집계를 거쳐 backend-build 가 붉다 — 실패한 잡만 다시 돌린다.
      - name: Resolve PIT dependencies into the Gradle cache
        id: pit-deps
        if: ${{ !cancelled() && needs.change-scope.outputs.backend == 'false' && strategy.job-index == 0 }}
        run: ./gradlew resolvePitDependencies --warning-mode fail --console=plain

      - name: Publish migration shard JUnit duration evidence
        if: always()
        run: node scripts/ci-junit-duration-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Retain migration shard execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migration-test-shard-${{ strategy.job-index }}
          path: |
            migration-tool/build/jacoco/test.exec
            migration-tool/build/test-results/test/**/*.xml
            migration-tool/build/migration-shard-manifest.json
          if-no-files-found: error
          retention-days: 14

  migration-scope:
    needs: [change-scope, migration-test-scope]
    if: ${{ always() && needs.change-scope.result == 'success' && needs.change-scope.outputs.migration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # verify.mjs reruns the profile provenance contract after artifact download.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Allow the checked-in Gradle wrapper to run
        run: chmod +x gradlew

      - name: Require every migration test shard to succeed
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.migration }}
          SOURCE_RESULT: ${{ needs.migration-test-scope.result }}
        run: node scripts/aggregate-required-check.mjs

      - name: Download all migration shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: build/migration-shards
          pattern: migration-test-shard-*

      - name: Verify the independent migration module
        run: node scripts/verify.mjs migration
        env:
          MIGRATION_SHARD_EXECUTION_ROOT: build/migration-shards

      - name: Publish merged migration JUnit duration evidence
        if: always()
        run: node scripts/ci-junit-duration-summary.mjs build/migration-shards >> "$GITHUB_STEP_SUMMARY"

      - name: Retain migration JUnit timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migration-junit-timing-${{ github.sha }}
          path: build/migration-shards/**/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Retain the verified migration CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migration-tool-${{ github.sha }}
          path: migration-tool/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Retain independent migration coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migration-coverage-${{ github.sha }}
          path: |
            build/reports/jacoco/migration
            build/reports/jacoco/jacocoMigrationReport/jacocoMigrationReport.xml
          if-no-files-found: error
          retention-days: 7

  # 전체 advisory DB 스캔은 주간 dependency-check 워크플로가 담당한다.

  # Conditional heavy source. The stable `frontend-build` required context is
  # emitted by the fail-closed aggregate below, including docs-only changes.
  frontend-scope:
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # codegen 입력은 백엔드가 신선도를 검증한 루트 api-docs.json 하나뿐이다.

      - name: Install dependencies
        id: fe-install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Form validation census and RED-proof contracts
        id: fe-form-validation
        run: pnpm run test:form-validation
        working-directory: frontend

      # [계약 드리프트 게이트] index 의 api-docs.json(백엔드 job 이 신선함을 이미 검증)으로 타입/Zod 를 임시 디렉터리에 다시 만들어
      # index 의 생성물과 비교하고, 작업 트리가 index 와 다르면 작업 트리 쌍도 같은 방법으로 비교한다(verify-generated-contracts.mjs).
      # CI 체크아웃에서는 index 가 검사 대상 커밋이다. 스펙은 바뀌었는데 codegen 을 안 돌린 드리프트를 차단한다.
      - name: Verify generated API types are in sync with spec (contract drift gate)
        id: fe-codegen
        run: |
          pnpm run codegen:verify
          pnpm run codegen:verify:zod
        working-directory: frontend

      # Next 빌드가 제외하는 e2e/ 타입을 별도 tsconfig로 required CI에서 검사한다.
      # 브라우저 샤드를 기동하기 전에 저비용 타입 오류를 먼저 차단한다.
      - name: Type check (E2E specs — 루트 tsconfig 가 exclude 하는 범위)
        id: fe-typecheck-e2e
        run: npx tsc -p tsconfig.e2e.json --noEmit
        working-directory: frontend

      # ESLint error 규칙과 warning 래칫을 강제한다. 임계값 SSOT는 frontend/package.json이다.
      # 수치를 이 주석에 복제하거나 높이지 말고, 위반을 고친 뒤 SSOT를 낮춘다.
      - name: Lint (ESLint)
        id: fe-lint
        run: pnpm run lint
        working-directory: frontend

      # lockfile을 한 번만 조회해 critical 전체와 운영 의존성 high를 차단한다.
      # 개발 의존성 high는 같은 JSON에서 warning으로 남기며 네트워크/형식 오류는 fail-closed다.
      - name: Frontend dependency audit policy
        id: fe-audit
        run: node ../scripts/frontend-audit-policy.mjs
        working-directory: frontend

      # 프로덕션 미들웨어는 공개 dev 시크릿으로의 조용한 폴백을 금지한다. 이 잡은 백엔드를
      # 기동하지 않으므로 대칭값은 불필요하지만, 빌드 자체에는 회차별 임시값이 반드시 필요하다.
      - name: Generate ephemeral JWT secret (frontend build only)
        run: echo "JWT_SECRET=$(openssl rand -hex 44)" >> "$GITHUB_ENV"

      - name: Build production frontend
        id: fe-build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/fe-build.log
          pnpm run bundle:check
        working-directory: frontend

      # [2026-09-01 제거] `next-build-cache` 업로드를 걷어낸다.
      #
      # 이 아티팩트는 워크플로 어디서도 내려받지 않는 죽은 업로드였다. e2e 샤드가 콜드 Next
      # 빌드를 반복하므로(실측 47~65초 × 3) 소비자로 연결해 보려 했으나, **전제가 틀렸다**:
      # 이 프로젝트는 Turbopack 을 쓰고(next.config.ts 의 `turbopack` 설정) `.next/cache` 에는
      # 이미지 캐시만 남는다. 실측 — 업로드된 아티팩트 크기가 283 바이트였고, 복원 스텝은
      # 1초 만에 끝났으며 그 뒤 빌드 시간은 60~65초로 **줄지 않았다**(오히려 콜드와 같다).
      # 빈 껍데기를 주고받는 비용만 남으므로 업로드째 제거한다.
      #
      # 샤드 간 프런트 빌드 재사용이 필요하면 Turbopack 이 실제로 쓰는 캐시 경로를 먼저
      # 실측해야 한다 — 그 전에 경로를 추측해 옮기면 지금과 같은 무효 캐시가 다시 생긴다.
      # 실패 스텝과 빌드·테스트 출력을 annotation으로 노출해 로그 권한 없이도 진단하게 한다.
      - name: Surface failure detail (annotations)
        if: failure()
        run: |
          echo "::error title=실패 스텝 판정::install=${{ steps.fe-install.outcome }} / form-validation=${{ steps.fe-form-validation.outcome }} / codegen=${{ steps.fe-codegen.outcome }} / typecheck-e2e=${{ steps.fe-typecheck-e2e.outcome }} / lint=${{ steps.fe-lint.outcome }} / audit=${{ steps.fe-audit.outcome }} / build=${{ steps.fe-build.outcome }}"
          for f in /tmp/fe-build.log; do
            [ -f "$f" ] || continue
            echo "::error title=$(basename $f) 마지막 출력::$(tail -c 2000 "$f" | paste -sd' ' -)"
          done

  # Unit/coverage is independent from the production bundle after dependency installation.
  # A separate runner removes their measured 8m + 2m serial chain while frontend-build below
  # still requires both sources through fail-closed aggregation.
  frontend-coverage-scope:
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Generate ephemeral JWT secret (frontend tests only)
        run: echo "JWT_SECRET=$(openssl rand -hex 44)" >> "$GITHUB_ENV"

      - name: Frontend unit and coverage suite
        id: fe-coverage
        run: |
          set -o pipefail
          pnpm run test:coverage 2>&1 | tee /tmp/fe-test.log
        working-directory: frontend

      # [2026-10-24 DEC-OPS-382 ⑤] Vitest 결과 XML(CI 에서만 junit 보고를 켠다 — vitest.config.mts)을 보관한다. 게이트가 아니다.
      - name: Retain frontend test result XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-test-results
          path: frontend/build/test-results/vitest-junit.xml
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          overwrite: true
        continue-on-error: true # 보관 업로드 — 게이트 아님

      - name: Surface coverage failure detail (annotations)
        if: failure()
        run: |
          echo "::error title=실패 스텝 판정::coverage=${{ steps.fe-coverage.outcome }}"
          if [ -f /tmp/fe-test.log ]; then
            echo "::error title=fe-test.log 마지막 출력::$(tail -c 2000 /tmp/fe-test.log | paste -sd' ' -)"
          fi

  # Stable required contexts. A selected heavy source must succeed; an
  # explicitly unselected source must be skipped. Every other state is red.
  reusable-base:
    # 전체 profile을 frontend production source 뒤에서 함께 시작한다. full run의 초기
    # runner는 migration shard에 먼저 배정하고, profile 하나를 뒤로 밀어 새 임계 경로를
    # 만들지 않는다. !cancelled()라 취소에는 반응하면서 frontend 실패·skip은 검증을 생략시키지 않는다.
    needs: [change-scope, frontend-scope]
    if: "!cancelled() && needs.change-scope.result == 'success' && needs.change-scope.outputs.reusable == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.change-scope.outputs['reusable-matrix']) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '9.15.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # 생성기는 생성물의 API 계약(생성 타입·경계·소비 census)을 원본 frontend 의 TypeScript·openapi-typescript 로
      # 다시 만든다(Phase 2 10c-2, U5-A). 설치하지 않으면 생성이 TOOL_UNAVAILABLE 로 멈춘다(조용히 건너뛰지 않는다).
      - name: Install source frontend tools for contract projection
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generate and verify reusable profile
        run: node scripts/verify-reusable-base.mjs --profile ${{ matrix.profile }} --layout ${{ matrix.layout }}
      - name: Retain reusable profile verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reusable-base-verification-${{ matrix.profile }}-${{ matrix.layout }}
          path: |
            build/reports/reusable-base/*.json
            build/reusable-base/source/*/build/reports/reusable-base/*.json
          if-no-files-found: error
          retention-days: 7

  reusable-custom:
    # 두 layout은 분류 직후 시작해 frontend 가 끝나기 전까지 비어 있는 runner 를 쓴다(ADR-0027).
    # 2026-09-30 backend 뒤로 옮긴 근거(secret-scan 과 슬롯 경합)는 secret-scan 이 분류 직후로,
    # 제품 PIT 가 4슬롯으로 바뀌며 사라졌다. main 처음 5회 중 3회 이상이 15.2분보다 느리면 되돌린다.
    needs: [change-scope]
    if: "!cancelled() && needs.change-scope.result == 'success' && needs.change-scope.outputs['reusable-custom'] == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux 실측에서 single-module이 더 길다. runner가 하나씩 열려도 긴 layout을 먼저 시작한다.
        layout: [single-module, multi-module]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '9.15.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # 생성기는 생성물의 API 계약(생성 타입·경계·소비 census)을 원본 frontend 의 TypeScript·openapi-typescript 로
      # 다시 만든다(Phase 2 10c-2, U5-A). 설치하지 않으면 생성이 TOOL_UNAVAILABLE 로 멈춘다(조용히 건너뛰지 않는다).
      - name: Install source frontend tools for contract projection
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generate and verify custom composition
        run: node scripts/verify-project-composer.mjs --layout ${{ matrix.layout }}
      - name: Retain custom composition verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reusable-custom-verification-${{ matrix.layout }}
          path: |
            build/reports/project-composer/*.json
            build/project-composer/jobs/*/report.json
            build/reusable-base/source/*/build/reports/reusable-base/*.json
          if-no-files-found: error
          retention-days: 7

  backend-build:
    needs: [change-scope, backend-scope, backend-schema-scope, migration-scope, reusable-base, reusable-custom]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 백엔드 범위 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.backend }}
          SOURCE_RESULT: ${{ needs.backend-scope.result }}
        run: node scripts/aggregate-required-check.mjs

      - name: 이관 도구 범위 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.migration }}
          SOURCE_RESULT: ${{ needs.migration-scope.result }}
        run: node scripts/aggregate-required-check.mjs

      - name: 물리 스키마 검증 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.schema }}
          SOURCE_RESULT: ${{ needs.backend-schema-scope.result }}
        run: node scripts/aggregate-required-check.mjs

      - name: 재사용 프로필 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.reusable }}
          SOURCE_RESULT: ${{ needs.reusable-base.result }}
        run: node scripts/aggregate-required-check.mjs

      - name: 사용자 구성 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs['reusable-custom'] }}
          SOURCE_RESULT: ${{ needs.reusable-custom.result }}
        run: node scripts/aggregate-required-check.mjs

  frontend-build:
    needs: [change-scope, frontend-scope, frontend-coverage-scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 프론트엔드 범위 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.frontend }}
          SOURCE_RESULT: ${{ needs.frontend-scope.result }}
        run: node scripts/aggregate-required-check.mjs

      - name: 프론트엔드 커버리지 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.frontend }}
          SOURCE_RESULT: ${{ needs.frontend-coverage-scope.result }}
        run: node scripts/aggregate-required-check.mjs

  e2e-tests:
    # Each shard builds its own runtime; backend/frontend remain separate required checks.
    needs: [change-scope]
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.authz-e2e.yml
      COMPOSE_PROJECT_NAME: egov-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      API_IMAGE_REF: egov-enterprise-api:e2e
    if: ${{ !cancelled() && needs.change-scope.result == 'success' && needs.change-scope.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    # 정상 shard의 여유는 보장하되 멈춘 실행이 러너를 장시간 점유하지 않도록 제한한다.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 실제 스펙은 shard-duration-profile.json의 성공 실행시간을 기준으로 LPT 균등 분배한다.
        # 새/삭제 스펙, 잘못된 시간, 예상 편차 15% 초과는 e2e-shard-plan 계약이 차단한다.
        # 분포 변경 시 profile의 source와 durationsMs를 함께 갱신한다.
        # [2026-09-01 축소: 3 → 2] 샤드는 병렬성을 사지만 **스택 빌드를 그만큼 반복**한다.
        #   실측(PR #529·#530): 샤드당 343초 중 테스트는 82~100초뿐이고 243초가 빌드·기동이다.
        #   즉 샤드를 늘릴수록 러너 시간이 오버헤드만큼 곱해진다(3샤드 러너 991초 중 테스트 27%).
        #   workers 를 2 로 올린 실측이 green 이었으므로(테스트 98~102 → 82~91초, OOM 없음)
        #   그만큼을 샤드에서 회수한다. 이번 실측으로 추정한 병렬 효율(workers2 ≈ 1.4배)을
        #   대입하면 2샤드 × workers 3 은 wall-clock 352초(현재 330초와 대등)에 러너 704초로
        #   **약 29% 절감**이다. 1샤드까지 줄이면 러너는 절반이 되지만 wall-clock 이 461초로
        #   40% 늘어 피드백이 눈에 띄게 느려지므로 채택하지 않았다.
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # 프로덕션 미들웨어는 JWT_SECRET 부재나 공개 dev 기본값으로의 폴백을 거부한다.
      # 백엔드와 프론트 빌드·기동은 회차별 동일한 임시 raw secret을 사용해야 서명 검증이 성립한다.
      - name: Generate ephemeral JWT secret (backend/frontend 대칭)
        run: echo "JWT_SECRET=$(openssl rand -hex 44)" >> "$GITHUB_ENV"

      # MFA는 격리 API에만 회차별 키를 제공한다. 운영 키나 보호계정 강제 적용은 상속하지 않는다.
      - name: Generate isolated MFA keyring (masked, no protected-account rollout)
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createIsolatedMfaEnvironment } from './scripts/run-isolated-e2e.mjs';
          const environment = createIsolatedMfaEnvironment();
          for (const value of Object.values(JSON.parse(environment.MFA_KEYS_JSON))) console.log(`::add-mask::${value}`);
          console.log(`::add-mask::${environment.MFA_KEYS_JSON}`);
          appendFileSync(process.env.GITHUB_ENV, Object.entries(environment).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      # Playwright storageState는 실행 중 갱신되지 않으므로 CI E2E에서만 토큰 수명을 6시간으로 둔다.
      # 운영 기본값은 바꾸지 않으며, shard 중간 만료를 애플리케이션 실패로 오인하지 않게 한다.
      - name: Extend access token lifetime for E2E (운영 기본값은 불변)
        run: echo "JWT_ACCESS_TOKEN_VALIDITY_MS=21600000" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Both shards restore layers; one exports them to avoid duplicate cache uploads.
      # Cache export is optional, but image compilation and runtime checks remain mandatory.
      - name: Build API image
        id: e2e-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: api-server/Dockerfile
          load: true
          push: false
          tags: ${{ env.API_IMAGE_REF }}
          cache-from: type=gha,scope=e2e-api
          cache-to: ${{ strategy.job-index == 0 && 'type=gha,scope=e2e-api,mode=max,ignore-error=true' || '' }}

      - name: Start Docker Infrastructure (DB & API)
        id: e2e-compose
        run: |
          set -o pipefail
          node scripts/e2e-compose-preflight.mjs
          docker compose up --no-build -d db api 2>&1 | tee /tmp/compose-up.log

      - name: Wait for API and Prometheus Metrics
        id: e2e-wait
        run: |
          echo "Waiting for backend to be healthy..."
          # [2026-07-26 상향] 종전 20회×5초=100초. docker compose 가 api 이미지를 소스에서 빌드한 뒤
          # Spring 컨텍스트가 Flyway 마이그레이션까지 끝내야 health 가 200 이 된다(로컬 실측 50~130초).
          # 100초는 러너에서 상시 부족해 "Timeout waiting for healthcheck" 로 E2E 전체가 죽는다.
          max_retries=60
          count=0
          until $(curl --output /dev/null --silent --head --fail http://localhost:8080/actuator/health); do
            printf '.'
            sleep 5
            count=$((count+1))
            if [ $count -eq $max_retries ]; then echo "Timeout waiting for healthcheck"; exit 1; fi
          done
          # [2026-07-26 정정] 종전 `curl -f .../actuator/prometheus` 는 200 을 기대해 **401 에서 죽었다.**
          #   그런데 ApiSecurityConfig 는 /actuator/** 를 ROLE_ADMIN/ROLE_SYSTEM 으로 보호하므로
          #   **401 이 정상 동작**이다. 즉 앱이 아니라 CI 기대값이 틀렸다. 스텝을 지우는 대신
          #   "엔드포인트가 존재하며 보호되어 있다" 를 검증한다 — 미인증 200 이면 보호 회귀로 잡힌다.
          echo "Checking Prometheus metrics endpoint (인증 필요 = 정상)..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/prometheus || echo 000)
          case "$CODE" in
            401|403) echo "metrics 엔드포인트가 보호되어 있음($CODE) — 정상" ;;
            200) echo "::warning title=metrics 미보호::/actuator/prometheus 가 미인증 200 을 반환했습니다. ROLE_ADMIN 보호가 풀렸는지 확인하십시오." ;;
            *) echo "::error title=metrics 엔드포인트 비정상::응답 코드 $CODE (엔드포인트 부재 또는 앱 비정상)"; exit 1 ;;
          esac
          echo "Backend is ready!"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # [2026-10-24] Playwright 시스템 패키지(.deb)를 main 에서만 캐시한다. 설치 실패 3건(run 39819698340·39938808734·39963674681 첫 시도)에서
      #   apt-get update 는 1~11초였고, 막힌 곳은 'Need to get 21.1~25.9 MB of archives' 뒤의 미러 다운로드(약 40kB/s)였다.
      #   apt 는 이름(버전 포함)·크기가 맞는 파일만 쓰므로 낡은 .deb 는 쓰이지 않는다. 키에 러너 이미지·Playwright 버전을 넣는다.
      - name: Resolve Playwright system package cache key
        id: e2e-apt-key
        working-directory: frontend
        run: |
          set -euo pipefail
          playwright=$(node -p "require('@playwright/test/package.json').version")
          prefix="playwright-debs-${ImageOS:-unknown}-${RUNNER_ARCH}-${playwright}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright system packages
        id: e2e-apt-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: ${{ steps.e2e-apt-key.outputs.key }}
          restore-keys: |
            ${{ steps.e2e-apt-key.outputs.prefix }}

      # actions/cache 는 runner 권한이라 root 소유 /var/cache/apt/archives 에 직접 풀지 못한다 — sudo 로 옮겨 둔다.
      - name: Seed apt archive with restored Playwright packages
        if: steps.e2e-apt-restore.outputs.cache-matched-key != ''
        env:
          MATCHED_KEY: ${{ steps.e2e-apt-restore.outputs.cache-matched-key }}
        run: |
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/playwright-debs/*.deb)
          echo "복원한 .deb ${#debs[@]}개 ($MATCHED_KEY)"
          if [ "${#debs[@]}" -gt 0 ]; then sudo cp --no-clobber -- "${debs[@]}" /var/cache/apt/archives/; fi

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 캐시 미적중 경로도 --with-deps 라 같은 apt-get 위험을 갖는다. 브라우저 다운로드가
      # 포함되므로 상한만 더 넉넉히 둔다. 미적중 경로는 적중 경로(install-deps)의 apt 설치에 브라우저 다운로드를
      # 더 하므로 상한이 그보다 작으면 안 된다.
      - name: Install Playwright Browsers
        id: e2e-pw-browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # [2026-08-20] step 타임아웃 신설. 이 단계는 내부적으로 apt-get 을 도는데 상한이 없어서,
      #   미러/락 대기로 멈추면 잡 타임아웃 30분을 통째로 태우고 shard 가 cancelled 로 죽는다.
      #   실측 2회: run 32242157066 shard 1(30m11s), run 32275810178 shard 1·2(30m27s/30m28s).
      #   둘 다 테스트 실패가 아니라 이 단계에서 멈춘 것이며, 재실행하면 그대로 통과했다.
      # [2026-10-24] 5→15분. 2026-10 실패 3건은 멈춤이 아니라 느린 진행이었다(약 40~45kB/s). 25.9MB 는 40kB/s 로 약 11분이라
      #   12분은 여유가 없고, 15분이면 약 30kB/s 까지 받는다. 앞 단계 약 4분 + 15 + 생성기 화면·FE 빌드·실행 약 6.5분으로 잡 상한
      #   30분 안이다. 위 .deb 캐시가 적중하면 다운로드가 거의 없다. 재시도 루프는 넣지 않는다.
      - name: Install Playwright Dependencies (system deps)
        id: e2e-pw-deps
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium
        working-directory: frontend

      # main 첫 샤드만, 정확한 키가 없을 때 보관한다. PR 은 복원만 한다(저장소 캐시 한도·쓰기 경계). 설치 직후라 시험이 실패해도 보관된다.
      - name: Collect Playwright system packages for the main cache
        id: e2e-apt-collect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && strategy.job-index == 0 && steps.e2e-apt-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get autoclean -qq   # 지금 색인에 없는(대체된) 버전을 버려 복원분이 세대마다 쌓이지 않게 한다
          rm -rf "$RUNNER_TEMP/playwright-debs" && mkdir -p "$RUNNER_TEMP/playwright-debs"
          shopt -s nullglob
          debs=(/var/cache/apt/archives/*.deb)
          if [ "${#debs[@]}" -gt 0 ]; then cp -- "${debs[@]}" "$RUNNER_TEMP/playwright-debs/"; fi
          echo "count=${#debs[@]}" >> "$GITHUB_OUTPUT"
          echo "Playwright 시스템 패키지 .deb ${#debs[@]}개를 main 캐시에 보관합니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Save Playwright system packages (main only)
        if: steps.e2e-apt-collect.outputs.count != '' && steps.e2e-apt-collect.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: ${{ steps.e2e-apt-key.outputs.key }}

      - name: Verify local composer browser flow
        if: strategy.job-index == 0
        run: node --test tools/project-composer/ui.test.mjs

      # 프론트 빌드·기동·테스트를 분리해 각 실패와 소요시간을 독립적으로 관측한다.
      # E2E는 개발 서버 전용 transport 변동을 피하도록 프로덕션 빌드로 실행한다.
      - name: Build frontend (production)
        id: e2e-fe-build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/next-build.log
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
          BACKEND_API_URL: http://127.0.0.1:8080/api/v1/
          NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3001

      # Reviewed PR routes select whole specs; integration pushes retain full E2E.
      # API/browser populations are disjoint; selected specs share the owned shard stack.
      # blob reporter는 샤드 병합, line reporter는 콘솔 진단, JSON reporter는 실행 완전성 계약의 입력이다.
      - name: Run E2E Tests (Sharded)
        id: e2e-run
        run: |
          set -euo pipefail
          node ../scripts/e2e-shard-plan.mjs --shard "${{ matrix.shard }}" --ci --plan-output /tmp/e2e-impact-plan.json > /tmp/e2e-specs.txt
          mapfile -t E2E_SPECS < /tmp/e2e-specs.txt
          if [ "${#E2E_SPECS[@]}" -eq 0 ]; then
            echo "::error::Duration-balanced E2E plan returned no specs for shard ${{ matrix.shard }}"
            exit 1
          fi
          printf 'E2E shard %s specs:\n' "${{ matrix.shard }}"
          printf '  %s\n' "${E2E_SPECS[@]}"
          node ../scripts/run-isolated-e2e.mjs --ci-compose --full-inventory -- --project=api-contract --project=full-suite "${E2E_SPECS[@]}" --reporter=blob,line,json 2>&1 | tee /tmp/e2e-run.log
          node ../scripts/playwright-result-contract.mjs --report "$PLAYWRIGHT_JSON_OUTPUT_FILE" --inventory /tmp/e2e-inventory.json "${E2E_SPECS[@]}" --ci-shard "${{ matrix.shard }}"
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
          BACKEND_API_URL: http://127.0.0.1:8080/api/v1/
          NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3001
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/e2e-results.json
          E2E_INVENTORY_OUTPUT_FILE: /tmp/e2e-inventory.json

      # 잘리지 않은 원본 로그를 남긴다 — 애노테이션의 2000자 제한이 이번 진단을 세 번 막았다.
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: e2e-diagnostics-shard-${{ strategy.job-index }}
          path: |
            build/isolated-e2e/*/frontend.log
            build/isolated-e2e/*/discovery.log
            build/isolated-e2e/*/playwright.log
            /tmp/next-build.log
            /tmp/e2e-run.log
            /tmp/e2e-results.json
            /tmp/e2e-inventory.json
            /tmp/e2e-impact-plan.json
            /tmp/compose-up.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          # slash가 있는 matrix.shard 대신 안전한 strategy.job-index를 아티팩트 이름에 사용한다.
          name: playwright-report-shard-${{ strategy.job-index }}
          # blob reporter의 실제 산출 경로를 업로드하고 이름 pattern은 병합 job과 맞춘다.
          path: frontend/blob-report/
          retention-days: 30
          include-hidden-files: true

      # 실패뿐 아니라 timeout의 cancelled 상태에서도 스텝·컨테이너·API 진단을 annotation으로 노출한다.
      - name: Surface failure detail (annotations)
        # GitHub timeout은 failure가 아니라 cancelled이므로 두 상태를 모두 포함한다.
        if: failure() || cancelled()
        env:
          PW_BROWSERS: ${{ steps.e2e-pw-browsers.outcome }}
          PW_DEPS: ${{ steps.e2e-pw-deps.outcome }}
          APT_DEBS: ${{ steps.e2e-apt-restore.outputs.cache-matched-key }}
        run: |
          echo "::error title=실패 스텝 판정::api-build=${{ steps.e2e-build.outcome }} / compose=${{ steps.e2e-compose.outcome }} / api-wait=${{ steps.e2e-wait.outcome }} / pw-browsers=${{ steps.e2e-pw-browsers.outcome }} / pw-deps=${{ steps.e2e-pw-deps.outcome }} / fe-build=${{ steps.e2e-fe-build.outcome }} / run=${{ steps.e2e-run.outcome }}"
          # 인프라 실패를 시험 실패와 따로 보이는 사람용 판정이다 — 설치 단계가 실패하면 E2E 는 돌지 않았다. 스텝 시간 초과는 failure 로
          #   남고(run 39963674681·39938808734·39819698340 첫 시도), cancelled 는 새 push·수동 취소·잡 상한이라 인프라 실패로 세지 않는다.
          #   npm run ci:flaky-report 는 이 제목이 아니라 첫 실패 스텝 이름(STEP_RULES)으로 같은 구분을 한다.
          case "$PW_BROWSERS/$PW_DEPS" in
            failure/*|*/failure)
              echo "::error title=E2E 인프라 실패::kind=playwright-install / pw-browsers=$PW_BROWSERS / pw-deps=$PW_DEPS / apt-debs=${APT_DEBS:-miss} — Playwright 설치(apt 미러·브라우저 내려받기)가 실패해 E2E 를 실행하지 않았습니다. 시험 실패가 아니므로 실패한 잡만 다시 돌립니다." ;;
            cancelled/*|*/cancelled)
              echo "::error title=E2E 설치 중 취소::pw-browsers=$PW_BROWSERS / pw-deps=$PW_DEPS — 새 push·수동 취소·잡 시간 상한으로 설치 중에 멈췄습니다. 인프라 실패로 세지 않습니다." ;;
          esac
          for f in /tmp/e2e-run.log /tmp/compose-up.log /tmp/next-build.log; do
            [ -f "$f" ] || continue
            echo "::error title=$(basename $f) 마지막 출력::$(tail -c 2000 "$f" | paste -sd' ' -)"
          done
          echo "::error title=컨테이너 상태::$(docker compose ps -a 2>&1 | paste -sd' ' -)"
          echo "::error title=API 컨테이너 로그(마지막)::$(docker compose logs --tail=40 api 2>&1 | tail -c 2000 | paste -sd' ' -)"

  e2e-merge-reports:
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E가 실제 실행된 경우에만 병합한다. 상류 실패 리포트는 병합하되 스킵·취소의 파생 red는 만들지 않는다.
    if: always() && needs.e2e-tests.result != 'skipped' && needs.e2e-tests.result != 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # 각 shard를 별도 디렉터리에 받아 파일명 충돌과 동시 추출 경쟁을 피한다.
      # 다운로드 실패는 continue-on-error로 숨기지 않는다.
      - name: Download all reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: frontend/playwright-reports
          pattern: playwright-report-shard-*

      # merge-reports는 바로 아래 blob만 읽으므로 shard 접두사를 붙여 최상위로 평탄화한다.
      # 리포트가 없으면 병합만 경고 후 종료하며, 실제 E2E 실패 권위는 상류 job에 남는다.
      - name: Flatten blob reports
        run: |
          echo "── 다운로드 구조(진단) ──"
          find playwright-reports -type f | head -20
          for d in playwright-reports/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            for f in "$d"*; do
              [ -f "$f" ] || continue
              mv "$f" "playwright-reports/${n}-$(basename "$f")"
            done
          done
          echo "── 평탄화 후 ──"
          ls -la playwright-reports/
        working-directory: frontend

      - name: Merge reports
        run: |
          if [ ! -d ./playwright-reports ] || [ -z "$(ls -A ./playwright-reports 2>/dev/null)" ]; then
            echo "::warning title=병합할 Playwright 리포트 없음::E2E 가 리포트 생성 전에 실패했습니다. 병합을 생략합니다(원인은 e2e-tests 잡 참조)."
            exit 0
          fi
          npx playwright merge-reports --reporter html ./playwright-reports
        working-directory: frontend

      - name: Upload merged report
        if: hashFiles('frontend/playwright-report/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report-merged
          path: frontend/playwright-report
          retention-days: 30

  # Stable merge check for the sharded E2E leaves. Branch protection must
  # depend on this job rather than on each matrix context, so changing the
  # shard count does not silently change the protected contract.
  e2e-test:
    needs: [change-scope, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: E2E 샤드 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.e2e }}
          SOURCE_RESULT: ${{ needs.e2e-tests.result }}
        run: node scripts/aggregate-required-check.mjs

  # PIT 대상·테스트 패턴은 gates.json과 exact-match하며 임계값 SSOT는 build.gradle이다.
  # mutation-scope는 병렬 실행하고 안정 required context mutation-test가 결과를 fail-closed 집계한다.
  # 실패 시 scope·임계값을 축소하지 말고 살아남은 뮤턴트에 단언을 추가한다.
  mutation-scope:
    needs: [change-scope]
    if: ${{ !cancelled() && needs.change-scope.result == 'success' && needs.change-scope.outputs.mutation == 'true' }}
    runs-on: ubuntu-latest
    # 이 잡에는 60분이 필요한 스코프가 없다 — 그 범위는 mutation-scope-migration 이 가져갔다.
    timeout-minutes: 30
    strategy:
      # 제품 13개 배치는 모두 실행한다. 6슬롯 근거: PIT 21범위 구성 뒤 full 실행 7건(39197910752·39211581858·39213303597·
      # 39241700358·39243734759·39291663884·39294207891)에서 이 잡이 매번 마지막이었고(종료 중앙값 16.7분, 2등 reusable-base 14.9분),
      # 9분 이후 꼬리 구간에는 runner 가 14개 이상 비어 있는데 PIT 는 4~6개만 돌았다. 같은 7건의 범위별 job 시간 중앙값으로 선언
      # 순서를 빈 슬롯에 채우면 4슬롯 904초, 6슬롯 657초다(가장 긴 board 한 범위가 하한, runner 대기 제외). 종전 4슬롯은 분류 직후
      # custom 두 layout 이 입장할 슬롯을 남기려던 것(ADR-0027)인데 지금 custom 은 7.8분에 끝나 꼬리가 아니다.
      # 효과는 이후 green full 실행의 벽시계 중앙값으로 판정하고, 줄지 않거나 다른 잡이 늦게 입장해 꼬리가 되면 4로 되돌린다.
      max-parallel: 6
      # 한 스코프가 깨져도 나머지를 끝까지 돌린다 — 어디까지 무너졌는지 한 번에 봐야 한다.
      fail-fast: false
      matrix:
        include:
          # GitHub starts matrix entries in declaration order. 2026-09-29 attempt 2의 job 총시간
          # 391·384·332·288·178·171초 순으로 긴 여섯 scope를 먼저 둔다(target·threshold 는 그대로).
          # 위 7건 중앙값으로는 순서가 조금 다르지만 6슬롯에서는 이 선언 순서로도 하한에 닿아 다시 정렬하지 않는다.
          # 종전 단일 business-app 범위는 1,279 mutations, 14분 12초였다. 현재 report를
          # 겹침 없는 세 모집단으로 나누고 각 모집단에 75%를 따로 적용해 gate를 강화한다.
          - scope: business-app-board
            gradle: ":business-app:pitest"
            classes: "nuri.business.domain.board.*,nuri.business.service.board.*,nuri.business.service.comment.*"
            tests: "nuri.business.*"

          - scope: business-core-file
            gradle: ":business-core:pitest"
            classes: "nuri.business.domain.file.*,nuri.business.service.file.*,nuri.business.service.code.*,nuri.business.domain.log.*,nuri.business.service.deptjob.*"
            tests: "nuri.business.*"

          - scope: business-app-workflow
            gradle: ":business-app:pitest"
            classes: "nuri.business.service.note.*,nuri.business.service.notification.*,nuri.business.service.informalsanction.*"
            tests: "nuri.business.*"

          - scope: business-app-delivery-operation
            gradle: ":business-app:pitest"
            classes: "nuri.business.service.sms.*,nuri.business.service.mail.*,nuri.business.service.event.*,nuri.business.service.reward.*"
            tests: "nuri.business.*"

          # 로그인 IP·시간 정책, refresh 회전, 감사·OTP와 인증 provider·요청 제한·메뉴 순환을 검증한다.
          - scope: business-core-auth
            gradle: ":business-core:pitest"
            classes: "nuri.business.service.auth.*,nuri.business.service.login.*,nuri.business.security.util.*,nuri.business.service.menu.MenuService,nuri.business.service.menu.MenuStructurePlan,nuri.business.security.iam.EgovAuthenticationProvider,nuri.business.security.filter.RateLimitFilter"
            tests: "nuri.business.*"

          # QueryDSL 조건 누락으로 전체 조회·계정 열거가 되는 회귀와 공용 paging 경계를 검증한다.
          # 같은 공통 범위의 주민번호 암복호화 변환도 함께 보호한다.
          - scope: business-core-code-user-common
            gradle: ":business-core:pitest"
            classes: "nuri.business.domain.code.*,nuri.business.domain.user.repository.*,nuri.business.domain.common.*"
            tests: "nuri.business.*"

          # [2026-10-19 DEC-OPS-366] 설문 전체 — 제출자·중복·기간·문항/항목 소속과 응답 표시(SurveyResultService 를 배송·운영에서 옮겼다).
          - scope: business-app-survey
            gradle: ":business-app:pitest"
            classes: "nuri.business.service.survey.*"
            tests: "nuri.business.*"

          # [2026-10-19 DEC-OPS-366] 커뮤니티 가입·회원·메모 보고 지시·일정의 소유·상태 판정.
          - scope: business-app-participation
            gradle: ":business-app:pitest"
            classes: "nuri.business.service.community.*,nuri.business.service.memoreport.*,nuri.business.service.schedule.*"
            tests: "nuri.business.*"

          # [2026-10-19 DEC-OPS-366] 사용자·그룹·부서·정책·부재 — 관리자 변경의 권한 재확인·보호 계정·토큰 폐기·감사.
          #   영속 작업(system.job)은 api-server 통합 시험이 다뤄 business-core 모듈 PIT 가 변이를 잡을 수 없어 넣지 않는다.
          - scope: business-core-user-org
            gradle: ":business-core:pitest"
            classes: "nuri.business.service.user.*,nuri.business.service.group.*,nuri.business.service.department.*,nuri.business.service.system.policy.*,nuri.business.service.system.user.*"
            tests: "nuri.business.*"

          # [2026-10-20 DEC-OPS-373] 업무 홈 실시간 방송과 배너·팝업 — 게시 중 팝업만 사용자에게 열고, 버전 409·첨부 배정을 지킨다.
          #   로컬 실측 98 mutations, 92%, 354초(모듈 컴파일 포함).
          - scope: business-app-home-promotion
            gradle: ":business-app:pitest"
            classes: "nuri.business.service.dashboard.*,nuri.business.service.promotion.*"
            tests: "nuri.business.*"

          # [2026-10-20 DEC-OPS-373] 로그 조회·감사 원장·통계 시계열(기간 상한·빈 날 0 채우기)·관리자 운영 신호의 권한별 포함.
          #   로컬 실측 202 mutations, 78%, 154초.
          - scope: business-core-observability
            gradle: ":business-core:pitest"
            classes: "nuri.business.service.log.*,nuri.business.service.stats.*,nuri.business.service.system.signal.*"
            tests: "nuri.business.*"

          # 상태변경 요청의 Origin/Referer 검증 우회를 탐지하는 보안 경계다.
          - scope: foundation-security-filter
            gradle: ":foundation:pitest"
            classes: "nuri.foundation.security.filter.*"
            tests: "nuri.foundation.*"

          # PII 마스킹과 고유 ID 재시도처럼 조용히 데이터 노출·PK 충돌을 만드는 공통 경계를 검증한다.
          - scope: foundation-core-util
            gradle: ":foundation:pitest"
            classes: "nuri.foundation.core.util.*"
            tests: "nuri.foundation.*"

          # refresh token 검증과 프론트가 대조하는 secret 지문 형식의 회귀를 탐지한다.
          - scope: foundation-jwt
            gradle: ":foundation:pitest"
            classes: "nuri.foundation.security.jwt.*"
            tests: "nuri.foundation.*"

          # 레이트리밋·로그인 제한·감사 로그가 공유하는 client IP와 신뢰 XFF 경계를 검증한다.
          - scope: foundation-client-ip
            gradle: ":foundation:pitest"
            classes: "nuri.foundation.security.net.*"
            tests: "nuri.foundation.*"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Wrapper 배포본 확보만 제한 재시도하고 실제 PIT는 한 번만 실행해 임계값 실패를 보존한다.
      - name: Provision Gradle distribution with bounded retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle 배포본을 3회 시도 후에도 확보하지 못했습니다."
              exit 1
            fi
            backoff=$((attempt * 10))
            echo "::warning::Gradle 배포본 확보 실패(${attempt}/3) — ${backoff}초 후 재시도합니다."
            sleep "$backoff"
          done

      - name: Mutation Test (${{ matrix.scope }})
        run: ./gradlew ${{ matrix.gradle }} --warning-mode fail --console=plain
        env:
          PIT_TARGET_CLASSES: ${{ matrix.classes }}
          PIT_TARGET_TESTS: ${{ matrix.tests }}
          STRICT_MUTATION: "true"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pitest-report-${{ matrix.scope }}
          path: "**/build/reports/pitest"
          retention-days: 30

  # [2026-09-16 DEC-OPS-104] migration-tool 뮤테이션만 따로 세운 잡이다.
  #   실측: 73.4분 CI 에서 임계 경로가 backend-scope 25.2분 → migration-validate-verify 48.0분이었고
  #   나머지 잡은 전부 36.4분에 끝났다. #678·#680 은 이 모듈을 건드리지 않았는데 그 비용을 냈다.
  #   migration-tool 은 온라인 런타임과 분리된 독립 CLI 라(DEC-OPS-005) 다른 모듈의 뮤턴트에 영향을 주지 않는다.
  #   ⚠ 스텝 단위 if 로 좁히지 않는다 — 집계 소스 스텝의 step-level if 는 매니페스트 검증기가 금지한다
  #     ("잡은 초록인데 실제 작업은 건너뜀" 을 막는 규칙). 조건은 잡 단위여야 하고, 이 잡도 매니페스트의
  #     집계 소스로 등록돼 STRICT_MUTATION·checkout·needs·if 가 기존과 같은 엄격도로 검사된다.
  mutation-scope-migration:
    needs: [change-scope]
    if: ${{ !cancelled() && needs.change-scope.result == 'success' && needs.change-scope.outputs['mutation-migration-tool'] == 'true' }}
    runs-on: ubuntu-latest
    # 여덟 scope 모두 30분 안에 끝나야 한다. 종전 결합 범위의 60분 예외는 샤딩으로 제거한다.
    timeout-minutes: 30
    strategy:
      # 슬롯 2개로 실측 긴 순서(LPT)대로 입장한다. 대상·테스트·75% gate·fail-fast 는 그대로고 바뀌는 것은 입장 순서와 동시 수뿐이다.
      # 종전 슬롯 1개는 합산 약 4분 12초(run 36575378891, ADR-0029 L4 전)를 전제로 초기 runner 를 E2E/reusable 에 양보했다. L4 뒤
      # main run 38985970318(af79c310f)에서는 8개 job 합이 1005초라 하나씩 이어 돌아 마지막 범위가 1486초에 끝났고, 나머지 job 은
      # 모두 1025초 안에 끝나 이 잡이 전수 CI 의 임계 경로가 됐다. 슬롯이 1개인 한 범위를 나눠도 합계는 그대로다.
      # 순서는 같은 실행의 job 시간이다: verify 209·validate 197·standardize 176·collect 171·protect 72·runtime-state 64·
      # registry 61·converter 55초. 이 순서로 두 슬롯에 넣으면 사슬별 job 시간 합은 505·500초다(위 job 시간으로 계산한
      # 값으로 runner 대기는 빠졌고, 두 슬롯의 벽시계는 아직 CI 로 재지 않았다). 범위의 시간이 크게 바뀌면 다시 재고 순서를 고친다.
      max-parallel: 2
      # 한 스코프가 깨져도 나머지를 끝까지 돌린다 — 어디까지 무너졌는지 한 번에 봐야 한다.
      fail-fast: false
      matrix:
        include:
          # 2026-09-29 실측: 종전 transform 결합 범위는 74 mutations, 15분 11초였다.
          # 두 클래스와 validate/verify를 독립 75% gate로 나눠 같은 모집단을 병렬 검증한다.
          # 2026-10-15 로컬 실측(ADR-0029 L3a-1 뒤): registry 60 mutations 100% 14초, converter 76 93% 15초,
          # validate 619 94% 65초, verify 159 88% 41초. L3a-2 뒤 converter 86 95% 19초, validate 1000 mutations 94%, 82초(원장 v2 판정 표 포함).
          # L3c 뒤(매핑 id·checkpoint mapping_id) validate 999 94% 75초, verify 163 87% 34초. registry·converter 는 바뀌지 않아 다시 재지 않았다.
          # L3d 뒤(조회 조인·via·LOOKUP_INPUT) validate 1057 94% 123초. verify·registry·converter 는 바뀌지 않아 다시 재지 않았다.
          # ADR-0029 L4(load 안 대사·공통코드 대사, DEC-OPS-324·325) 뒤 2026-10-16 로컬 실측(Gradle 기동 포함, 다른 작업과 겹치지
          # 않은 실행): 검토 지적 반영·L4-B 병합 뒤 verify 1172 mutations 93%(시험 강도 96%) 200초, validate 1496 95%(97%) 121초,
          # converter 87 95% 20초(검토 지적 반영 전 같은 날, 범위 코드는 바뀌지 않았다). 판정은 verify·validate 의 순수
          # 클래스에 두고 대상 DB 질의는 postgres 패키지 구현에 둬 범위를 새로 세우지 않았다. registry 는 바뀌지 않아 다시 재지 않았다.
          - scope: migration-verify
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.verify.*"
            tests: "nuri.migration.verify.MigrationVerifierTest,nuri.migration.verify.MigrationVerifierTypedIdentityTest,nuri.migration.MigrationSafetyIntegrationTest,nuri.migration.verify.ReconciliationJudgeTest,nuri.migration.verify.ReconciliationRunTest,nuri.migration.verify.ReconciliationPlannerTest,nuri.migration.verify.ColumnClassifierTest,nuri.migration.verify.SourceAggregateQueryTest,nuri.migration.verify.ReconciliationValuesTest,nuri.migration.verify.TargetTallyTest,nuri.migration.verify.DomainConformanceTest,nuri.migration.verify.ColumnReplayTest,nuri.migration.verify.ConstraintProofTest,nuri.migration.verify.ReferenceChecksTest,nuri.migration.verify.CodeSetReconcilerTest"

          # 매핑·fkRef와 이관 행 수 검증을 뒤집어 유실·고아 데이터를 PASS로 판정하는 회귀를 차단한다.
          # [ADR-0029 L4-B] 고정 길이 문자 소스 codemap 앞 trim 판정(R3, LoadCapabilities)을 생성기와 coverage 가 함께 쓴다 —
          # 뒤집히면 손으로 쓴 mapping 이 plan 을 지난다. 2026-10-15 로컬 실측 1190 mutations, 95%, 103초. L3c·L3d 병합 뒤(나눈
          # 매핑·조회 컬럼에도 같은 판정) 1250 mutations, 94%, 128초.
          - scope: migration-validate
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.validate.*"
            tests: "nuri.migration.validate.MappingValidatorTest,nuri.migration.validate.MappingValidatorTypedIdentityTest,nuri.migration.validate.TargetStandardValidatorTest,nuri.migration.MigrationPipelineTest,nuri.migration.validate.ledger.TermLedgerValidatorTest,nuri.migration.validate.ledger.TermLedgerLoaderTest,nuri.migration.validate.ledger.LoadCapabilitiesTest,nuri.migration.validate.VerifyReferenceRulesTest,nuri.migration.validate.CodeSetPrecheckTest,nuri.migration.validate.CodeSetTargetsTest"

          # [ADR-0029 L3a-1] 표준 도메인 변환기. 이 경계가 뒤집히면 자리표시·달력 오류 날짜가 표준 값으로 적재되거나
          # 추정기가 위반으로 센 값이 실행에서 통과한다(DomainParityTest). 2026-10-15 로컬 실측 116 mutations, 100%, 10초다.
          # [ADR-0029 L3a-2] 원장에서 mapping 을 만드는 생성기를 더했다 — 뒤집히면 접속 자리표시가 풀린 값으로 쓰이거나
          # 원장에 없는 컬럼이 조용히 빠진다. 생성기와 plan 의 원장 대응이 함께 쓰는 표·컬럼 해석(InventoryTables)도 넣었다 —
          # 뒤집히면 모호한 표나 표기만 다른 컬럼이 엉뚱한 inventory 컬럼으로 풀린다. L3a-2 뒤 로컬 실측 383 mutations, 93%, 42초다.
          # L3c 뒤(생성기가 매핑 id 마다 컬럼을 만든다) 395 mutations, 94%, 39초다. L3d 뒤(조회 경로 행으로 조회 컬럼을 만든다)
          # 425 mutations, 94%, 74초다.
          # [ADR-0029 L3b] 승인 행 격리 판정·상한(isolate)과 값 한계 가드(domain.TargetValueGuard)를 더했다 — 뒤집히면 승인 밖
          # 실패가 격리되거나, 상한을 넘겨 격리하거나, PostgreSQL 이 조용히 반올림하는 값이 통과한다. 범위를 새로 세우지 않고
          # 넓혔다(별도 범위는 10분 넘을 때). 2026-10-15 로컬 실측 558 mutations, 93%, 59초. 같은 날 validate 1082 94% 98초,
          # verify 201 86% 52초(격리 집계 대조 포함).
          # [ADR-0029 L3e] 같은 세션 보관 덤프·격리 키 반출(archive.*)을 더했다 — 뒤집히면 덤프에 행이 빠지거나 멈춘 표의
          # 파일이 남거나, 기존 파일을 덮어쓰거나, Git 작업 트리·승인 산출물 옆에 원시 값이 쓰인다. 2026-10-15 로컬 실측(검토
          # 반영 뒤) 977 mutations, 91%(archive 309, 88%), 108초. 같은 날 validate 1173 94% 125초, verify 268 93% 59초(덤프
          # 행 수·격리 키 반출 대조 포함), protect 199 98% 23초.
          # [ADR-0029 L4-B] 생성기가 CHAR·NCHAR 소스 codemap 앞에 trim 을 요구한다(R3, 판정은 migration-validate 의
          # LoadCapabilities) — 뒤집히면 공백 채운 코드가 실행에서 미매핑으로 멈추거나 그대로·대체값으로 쓰인다. 2026-10-15
          # 검토 반영 뒤 로컬 실측 978 mutations, 92%, 102초. L3c·L3d 병합 뒤(조회 컬럼은 조회 표 타입으로 판정) 1038 mutations,
          # 92%, 135초.
          - scope: migration-standardize
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.domain.*,nuri.migration.generate.*,nuri.migration.discovery.InventoryTables,nuri.migration.isolate.*,nuri.migration.archive.*"
            tests: "nuri.migration.domain.DomainValuesTest,nuri.migration.domain.DomainParityTest,nuri.migration.domain.DomainCategoryTest,nuri.migration.generate.MappingGeneratorTest,nuri.migration.generate.SkeletonReaderTest,nuri.migration.discovery.InventoryTablesTest,nuri.migration.domain.TargetValueGuardTest,nuri.migration.isolate.RowIsolationPolicyTest,nuri.migration.isolate.IsolationTallyTest,nuri.migration.archive.ArchiveFileWriterTest,nuri.migration.archive.ArchiveLocationGuardTest,nuri.migration.archive.ArchiveRunTest"

          # [DEC-OPS-311] 수집 명령(profile·app-scan). 이 경계가 뒤집히면 개인정보 값이 프로파일 빈도표로 새거나
          # 사용처가 조용히 빠진다. 2026-10-15 로컬 실측(ADR-0029 L3a-2 뒤) 1004 mutations, 91%, 92초다.
          # [ADR-0029 L4-B] Oracle 코멘트 사전 뷰 읽기(R2)도 이 범위다 — 뒤집히면 Oracle 코멘트 근거가 사라진다. 드라이버
          # 고유 시각 값 판정(R1, jdbc.JdbcLobReader)은 PIT 범위 밖이고 JdbcLobReaderTest·EtlSourcePagingTest·리허설 IT 가
          # 지킨다. 2026-10-15 로컬 실측 1024 mutations, 91%, 146초다. 프로파일러가 값 읽기 고정 사유를 FAILED 행의
          # failureReason 에 남긴 뒤(L4-B 통합 검토) 1025 mutations, 92%, 108초다.
          - scope: migration-collect
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.profile.*,nuri.migration.appscan.*,nuri.migration.suggest.*"
            tests: "nuri.migration.profile.ColumnProfilerTest,nuri.migration.profile.SourceProfilerTest,nuri.migration.appscan.AppSourceScannerTest,nuri.migration.appscan.SqlUsageExtractorTest,nuri.migration.suggest.ConformanceEstimatorTest,nuri.migration.suggest.TermSuggesterTest,nuri.migration.suggest.LedgerDraftWriterTest"

          # [DEC-OPS-308] 주민번호 암호화·평문 차단·보호 선언 대조. 이 경계가 뒤집히면 평문이 대상 DB 에 남는다.
          # ADR-0029 L3d 뒤(조회 키도 키 소스로 센다) 로컬 실측 191 mutations, 98%, 17초다.
          # [ADR-0029 L3e] 암호화할 소스 값을 보관 덤프에 넣지 않는 판정도 이 범위 시험이 덮는다 — 뒤집히면 평문이 덤프에 남는다.
          # 온라인 원본을 컴파일하는 호환 계약 시험은 뮤턴트마다 javac 를 돌리므로 넣지 않는다(일반 시험이 돌린다).
          - scope: migration-protect
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.protect.*"
            tests: "nuri.migration.protect.AriaEngineTest,nuri.migration.protect.EgovAriaColumnCipherTest,nuri.migration.protect.ColumnProtectionPlanTest,nuri.migration.protect.ColumnProtectorTest"

          # [ADR-0029 L3c, DEC-OPS-319] 매핑 키·keymap 소유 매핑 판정, 매핑 단위 실행 순서, checkpoint 의 mapping_id 범위와
          # 재개 가드. 뒤집히면 한 소스를 나눈 매핑 하나가 조용히 빠지거나, 형제 매핑을 거치는 의존이 순환으로 막히거나,
          # 매핑 id 를 바꾼 재개가 이미 적재한 행을 다시 쓴다. 2026-10-15 로컬 실측 118 mutations, 95%, 12초다.
          # [ADR-0029 L3d, DEC-OPS-320] 조회 조인의 선언 규칙·짝 판정(nuri.migration.lookup.*)을 더했다 — 뒤집히면 짝이 둘 이상인
          # 행이나 짝 없는 행이 조용히 적재되거나, 순서 키 없는 조회가 열린 스트리밍 결과 위에서 실행된다. 204 mutations, 96%, 27초다.
          - scope: migration-runtime-state
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.mapping.*,nuri.migration.state.MigrationStateStore,nuri.migration.etl.TableOrderer,nuri.migration.lookup.*"
            tests: "nuri.migration.mapping.MappingIndexTest,nuri.migration.etl.TableOrdererTest,nuri.migration.state.MigrationStateStoreTest,nuri.migration.lookup.LookupResolverTest,nuri.migration.lookup.LookupRulesTest"

          - scope: migration-transform-registry
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.transform.TransformerRegistry"
            tests: "nuri.migration.transform.TransformerRegistryTest,nuri.migration.artifact.MigrationExecutionContractTest"

          - scope: migration-transform-converter
            gradle: ":migration-tool:pitest"
            classes: "nuri.migration.transform.TypeConverter,nuri.migration.transform.CodeTranslator"
            tests: "nuri.migration.transform.TypeConverterTest,nuri.migration.transform.CodeTranslatorTest,nuri.migration.MigrationSafetyIntegrationTest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Wrapper 배포본 확보만 제한 재시도하고 실제 PIT는 한 번만 실행해 임계값 실패를 보존한다.
      - name: Provision Gradle distribution with bounded retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle 배포본을 3회 시도 후에도 확보하지 못했습니다."
              exit 1
            fi
            backoff=$((attempt * 10))
            echo "::warning::Gradle 배포본 확보 실패(${attempt}/3) — ${backoff}초 후 재시도합니다."
            sleep "$backoff"
          done

      - name: Mutation Test (${{ matrix.scope }})
        run: ./gradlew ${{ matrix.gradle }} --warning-mode fail --console=plain
        env:
          PIT_TARGET_CLASSES: ${{ matrix.classes }}
          PIT_TARGET_TESTS: ${{ matrix.tests }}
          STRICT_MUTATION: "true"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pitest-report-${{ matrix.scope }}
          path: "**/build/reports/pitest"
          retention-days: 30

  # 안정 required context를 유지하며 matrix 전체 결과를 집계한다.
  # always()가 실패 시 aggregate skip으로 바뀌는 fail-open을 막고 계약 테스트가 이를 고정한다.

  # 안정 required context를 유지하며 matrix 전체 결과를 집계한다.
  # always()가 실패 시 aggregate skip으로 바뀌는 fail-open을 막고 계약 테스트가 이를 고정한다.
  mutation-test:
    needs: [change-scope, mutation-scope, mutation-scope-migration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 뮤테이션 스코프 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs.mutation }}
          SOURCE_RESULT: ${{ needs.mutation-scope.result }}
        run: node scripts/aggregate-required-check.mjs

      # 두 소스를 한 스텝에서 합치지 않는다 — 합치면 한쪽의 skip 을 다른 쪽의 success 가 덮는다.
      - name: 이관 도구 뮤테이션 결과 집계
        env:
          CLASSIFIER_RESULT: ${{ needs.change-scope.result }}
          EXPECTED_WORK: ${{ needs.change-scope.outputs['mutation-migration-tool'] }}
          SOURCE_RESULT: ${{ needs.mutation-scope-migration.result }}
        run: node scripts/aggregate-required-check.mjs
