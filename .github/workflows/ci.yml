name: Java CI with Gradle

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  # 수동 실행 — 더미 커밋 없이 파이프라인을 재확인할 수 있어야 한다.
  # (2026-07-26: 과금차단 해제 후 상태 확인을 위해 빈 커밋을 밀어야 했던 문제)
  workflow_dispatch:

permissions:
  contents: read

# [중복 실행 정리] 같은 ref 에 연속 푸시하면 이전 실행이 그대로 살아 있어 동일 파이프라인이 3개까지
# 동시에 돌았다(2026-07-26 실측). 검증 대상은 항상 **최신 커밋**이므로 앞선 실행을 취소해 러너 시간과
# 신호 혼선을 줄인다. 중간 커밋의 결과가 사라지지만, 그 커밋의 결함은 최신 실행에서 동일하게 드러난다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 공통 환경 변수
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers

jobs:
  backend-build:
    runs-on: ubuntu-latest
    # [2026-07-26 상향] 45분에서 timeout 으로 cancelled 됐다(실측 2721초). 테스트는 통과했고 잡이 길었을
    # 뿐이다 — 로컬 15분48초 대비 러너가 느리고 콜드 캐시이며 Testcontainers PG 기동이 더해진다.
    # 지배적 비용이던 dependency-check 는 별 잡으로 분리했고, 여유를 둬 정상 통과 구간을 확보한다.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Gradle 캐싱 활성화
          cache-disabled: false
          cache-read-only: false
          cache-overwrite-existing: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # [2026-07-26 정정] 종전 필터의 'foundation/src/main/java/**/entity/**' 는 실존하지 않는 경로였고
      # (엔티티는 business-core/business-app 소속), 실제 마이그레이션도 api-server 아래에 있다.
      # 즉 이름은 "Schema Integrity" 인데 스키마 변경을 감지하지 못하는 필터였다.
      - name: Detect Schema and JPA Entity Changes
        id: schema-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            schema:
              - 'api-server/src/main/resources/db/migration/**'
              - 'business-core/src/main/java/**/domain/**'
              - 'business-app/src/main/java/**/domain/**'
              - 'foundation/src/main/java/**/domain/**'
              - 'api-server/src/test/resources/application-tc.yml'
              - 'foundation/src/test/resources/db/migration/**'
              - 'foundation/build.gradle'
              - 'foundation/src/test/resources/application-test.yml'
              - 'foundation/src/test/resources/application-test-dump.yml'

      - name: Strict Schema Integrity Validation (No Cache Gateway)
        if: steps.schema-changes.outputs.schema == 'true'
        run: ./gradlew :foundation:test --no-build-cache

      - name: Build and Test with Gradle
        id: build-and-test
        run: |
          set -o pipefail
          ./gradlew build jacocoRootReport check -Dopenapi.export.path=api-docs.json 2>&1 | tee /tmp/build-and-test.log

      # [스키마 진짜 검증] 빈 PostgreSQL 17 에 Flyway 전량 적용 → Hibernate ddl-auto:validate.
      # 단위 테스트는 H2 + create-drop 이라 엔티티↔물리 스키마 불일치를 원리적으로 못 잡는다
      # (2026-07-26 사고: 36자 UUID ↔ varchar(7) 가 전부 그린이었다).
      # 하네스 오프라인 린터(EntitySchemaConformanceLinterTest)와 상보 관계이며, 이쪽은 Docker 가 필요해
      # CI/localGate 계층에 둔다. runner 에는 Docker 가 항상 있으므로 조건부 스킵하지 않는다.
      # 순서: 빌드/테스트 뒤에 둔다 — Docker 환경 문제가 본 빌드 신호를 가리지 않도록.
      # [이미지 선(先)내림] 러너에서 postgres:17 pull 이 Testcontainers 내부 대기 시간을 넘겨
      #   ContainerFetchException ← ConditionTimeoutException 으로 죽었다(2026-07-26 실측).
      #   pull 을 별 스텝으로 분리하면 ① Testcontainers 는 로컬 이미지를 그대로 쓰고
      #   ② pull 자체가 실패할 때(레이트리밋 등) 원인이 그 스텝에서 명확히 드러난다.
      - name: Pre-pull PostgreSQL image for Testcontainers
        run: docker pull --quiet postgres:17 || (sleep 15 && docker pull --quiet postgres:17)

      - name: Real PostgreSQL Schema Validation (Testcontainers + Flyway + validate)
        id: schema-validation
        run: |
          set -o pipefail
          ./gradlew :api-server:schemaValidationTest 2>&1 | tee /tmp/schema-validation.log

      - name: Verify committed api-docs.json is fresh (contract drift gate)
        id: api-docs-gate
        run: git diff --exit-code api-docs.json

      # [2026-07-26 삭제] "Export OpenAPI Spec" 스텝 제거.
      #   ./gradlew :api-server:bootRun & sleep 30 && curl ... || true  형태로,
      #   ① 위 build 의 -Dopenapi.export.path 오프라인 내보내기와 완전히 중복이고
      #   ② `|| true` + continue-on-error 라 어떤 실패도 보고하지 않았으며
      #   ③ 산출물 openapi-generated.json 을 참조하는 곳이 저장소에 0건이었고
      #   ④ 백그라운드 서버가 러너에 남아 후속 잡을 방해할 수 있었다.

      - name: Check OpenAPI Spec Changes
        id: openapi-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api-server/**'
              - 'foundation/**'
              - 'business-core/**'
              - 'business-app/**'
        continue-on-error: true # 아티팩트 업로드 판정용 — 게이트 아님

      - name: Upload OpenAPI Spec (if changed)
        if: steps.openapi-changes.outputs.api == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-changed
          path: api-docs.json
          retention-days: 30
        continue-on-error: true # 아티팩트 업로드 — 게이트 아님

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/aggregated

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: api-docs.json

      # [실패 관측] 잡 로그 다운로드는 admin 권한을 요구해 외부에서 원인을 볼 수 없다(2026-07-26 실측: 403).
      # 실패 시 마지막 출력과 JUnit 실패 메시지를 **error 애노테이션**으로 올려, 권한 없이도 원인이 보이게 한다.
      - name: Surface failure detail (annotations)
        if: failure()
        run: |
          emit() { # $1=title  $2=file
            [ -f "$2" ] || return 0
            MSG=$(tail -c 3000 "$2" | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1::$MSG"
          }
          # 어떤 스텝이 실제로 실패했는지 먼저 명시 — 로그 tail 만 보면 통과한 스텝을 오인한다
          echo "::error title=실패 스텝 판정::build-and-test=${{ steps.build-and-test.outcome }} / schema-validation=${{ steps.schema-validation.outcome }} / api-docs-gate=${{ steps.api-docs-gate.outcome }}"
          # 컴파일/태스크 오류 본문을 별도로 발췌 — tail 창에 안 잡히는 경우가 있다
          if [ -f /tmp/build-and-test.log ]; then
            echo "::error title=오류 발췌(error:/What went wrong)::$(grep -E "error:|What went wrong|Compilation failed|FAILED$" -A 3 /tmp/build-and-test.log | tail -c 2500 | paste -sd' ' -)"
          fi
          emit "Build and Test 마지막 출력" /tmp/build-and-test.log
          emit "Schema Validation 마지막 출력" /tmp/schema-validation.log
          # 실패한 JUnit 테스트의 클래스·메시지를 최대 5건 노출
          grep -rl '<failure\|<error message' --include='*.xml' */build/test-results 2>/dev/null | head -5 | while read f; do
            CLS=$(basename "$f" .xml)
            DETAIL=$(grep -o 'message="[^"]\{0,300\}"' "$f" | head -2 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=테스트 실패: $CLS::$DETAIL"
          done
          # 계약 드리프트 게이트가 붉을 때 무엇이 달라졌는지도 노출
          if ! git diff --quiet api-docs.json 2>/dev/null; then
            echo "::error title=api-docs.json 드리프트::$(git diff --stat api-docs.json)"
          fi

  # [분리됨] OWASP Dependency-Check → .github/workflows/dependency-check.yml (주간 스케줄).
  #   매 푸시 43분을 태우고 취소되던 advisory 스캔을 커밋 단위 파이프라인에서 제거했다(2026-07-26 실측).

  frontend-build:
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # [계보 정합] codegen 은 리포지토리 루트 api-docs.json(백엔드 job 이 git diff 로 신선함 검증)을 읽는다.
      # frontend/ 로 스펙을 내려받던 옛 download-artifact 스텝은 소비처가 없고 frontend/api-docs.json(계보역전)을
      # 유발하므로 제거했다.

      - name: Install dependencies
        id: fe-install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # [계약 드리프트 게이트] 커밋된 api-docs.json(백엔드 job 이 신선함을 이미 검증) 으로부터
      # 타입/Zod 를 재생성해 커밋본과 diff. 스펙은 바뀌었는데 codegen 을 안 돌린 드리프트를 차단한다.
      - name: Verify generated API types are in sync with spec (contract drift gate)
        id: fe-codegen
        run: |
          pnpm run codegen:verify
          pnpm run codegen:verify:zod
        working-directory: frontend

      # [정적 품질 게이트] ESLint error 규칙(jsx-a11y 3종 + React Compiler 계열)을 CI 에서 강제한다.
      # 2026-07-26 기준 error 0 건 달성(warning 515 건은 점진 정리 백로그라 실패시키지 않는다).
      # error 가 1 건이라도 유입되면 실패한다 — 임계를 낮추지 말고 위반을 고칠 것.
      - name: Lint (ESLint)
        id: fe-lint
        run: pnpm run lint
        working-directory: frontend

      # [게이트] critical 취약점은 차단한다 — 결정론적이고 오탐이 드물다.
      - name: Security Audit (critical — blocking)
        id: fe-audit
        run: pnpm audit --audit-level critical
        working-directory: frontend

      # ⚠ [비게이트 / advisory] high 는 신규 권고 등재만으로도 코드 변경 없이 붉어져 CI 를 시간폭탄으로
      #   만들기에 차단하지 않는다. 로그로만 노출하며, 이 스텝의 통과는 "high 취약점 없음"을 뜻하지 않는다.
      - name: Security Audit (high — advisory, non-blocking)
        run: pnpm audit --audit-level high
        working-directory: frontend
        continue-on-error: true

      - name: Build and Test
        id: fe-build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/fe-build.log
          pnpm run test 2>&1 | tee /tmp/fe-test.log
        working-directory: frontend

      - name: Upload Next.js build cache
        uses: actions/upload-artifact@v4
        with:
          name: next-build-cache
          path: frontend/.next/cache
          retention-days: 7

      # [실패 관측] 백엔드 잡과 동일 이유 — 로그는 admin 권한이 필요하므로 어느 스텝이 왜 죽었는지를
      # 애노테이션으로 노출한다(2026-07-26: frontend-build 가 14초에 죽었는데 원인을 볼 수 없었다).
      - name: Surface failure detail (annotations)
        if: failure()
        run: |
          echo "::error title=실패 스텝 판정::install=${{ steps.fe-install.outcome }} / codegen=${{ steps.fe-codegen.outcome }} / lint=${{ steps.fe-lint.outcome }} / audit=${{ steps.fe-audit.outcome }} / build=${{ steps.fe-build.outcome }}"
          for f in /tmp/fe-build.log /tmp/fe-test.log; do
            [ -f "$f" ] || continue
            echo "::error title=$(basename $f) 마지막 출력::$(tail -c 2000 "$f" | paste -sd' ' -)"
          done

  e2e-tests:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    # [2026-07-26 재상향] 40분에서 "The operation was canceled" 로 끊겼다(실측). 비용 구조가 곱셈이다:
    #   샤드마다 (api 이미지 빌드 + Next 프로덕션 빌드) + 테스트당 최대 300초 타임아웃 × 재시도 2회.
    #   현재는 실패가 많아 재시도가 비용을 3배로 만들며, 그 결과 **실패 목록조차 못 받고 취소**됐다.
    #   목록을 확보하는 것이 우선이므로 예산을 올린다. 실패를 정리한 뒤 되돌릴 값이다(항구 설정 아님).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 3 개의 shard 로 분할하여 병렬 실행
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4

      # [양쪽 대칭 시크릿] 프론트 미들웨어는 prod 에서 JWT_SECRET 미설정이면 모듈 로드 시 throw 한다
      #   (공개된 dev 기본값으로 조용히 서명 검증하는 최악 상태 방지). 그리고 백엔드는 같은 시크릿의
      #   raw bytes 로 서명하므로 **좌우가 같아야** 검증이 성립한다 — 어긋나면 로그인 후 곧바로 /login 으로
      #   되돌아가는 무음 실패가 된다(middleware.ts 주석의 2026-07-19 사례).
      #   개발 모드에서는 이 가드가 발동하지 않아 프로덕션 전환에서 처음 드러났다(2026-07-26 CI 실측).
      #   회차마다 임시 시크릿을 만들어 compose(api 컨테이너)와 프론트 빌드/기동에 동일하게 공급한다.
      #   (hex 88자 = dev 기본값과 동일 길이대 → HS512 로 추론된다)
      - name: Generate ephemeral JWT secret (backend/frontend 대칭)
        run: echo "JWT_SECRET=$(openssl rand -hex 44)" >> "$GITHUB_ENV"

      # [2026-07-28 신설] 액세스 토큰 수명을 이 잡에서만 6시간으로 늘린다(운영 기본값 1시간은 불변).
      #   근거(실측 · CI run 30279822185): shard 2 가 **66분** 걸렸고, 토큰 수명 1시간을 넘긴
      #   시점부터 04 후반·05·06·07 이 통째로 red 였다. Playwright 의 storageState 는 setup 에서
      #   1회 생성되고 갱신되지 않으며, 프론트 미들웨어는 exp 경과 시 재발급 없이 /login 으로
      #   돌린다. 그래서 실패가 "셀렉터를 못 찾음"으로 보이지만 실제 렌더된 것은 로그인 폼이다.
      #   만료 토큰을 주입해 동일 증상을 재현·확증했다(2026-07-28).
      #   ⚠ 이것은 개별 테스트 결함을 덮는 우회가 아니다 — 잡이 느려질수록 더 많은 테스트가
      #     만료 구간에 들어가는 **구조적 실패**라, 테스트를 하나씩 고쳐도 재발한다.
      #     실행 시간 자체를 줄이는 과제와는 별개로 이 축을 먼저 제거한다.
      - name: Extend access token lifetime for E2E (운영 기본값은 불변)
        run: echo "JWT_ACCESS_TOKEN_VALIDITY_MS=21600000" >> "$GITHUB_ENV"

      # build 와 up 을 분리한다 — 실패가 이미지 빌드인지 컨테이너 기동인지 한 회차로 구분되고,
      # 출력을 파일로 남겨 애노테이션에 실을 수 있다(로그 다운로드는 admin 권한 필요).
      - name: Build API image
        id: e2e-build
        run: |
          set -o pipefail
          docker compose build api 2>&1 | tee /tmp/compose-build.log

      - name: Start Docker Infrastructure (DB & API)
        id: e2e-compose
        run: |
          set -o pipefail
          docker compose up -d db api 2>&1 | tee /tmp/compose-up.log

      - name: Wait for API and Prometheus Metrics
        id: e2e-wait
        run: |
          echo "Waiting for backend to be healthy..."
          # [2026-07-26 상향] 종전 20회×5초=100초. docker compose 가 api 이미지를 소스에서 빌드한 뒤
          # Spring 컨텍스트가 Flyway 마이그레이션까지 끝내야 health 가 200 이 된다(로컬 실측 50~130초).
          # 100초는 러너에서 상시 부족해 "Timeout waiting for healthcheck" 로 E2E 전체가 죽는다.
          max_retries=60
          count=0
          until $(curl --output /dev/null --silent --head --fail http://localhost:8080/actuator/health); do
            printf '.'
            sleep 5
            count=$((count+1))
            if [ $count -eq $max_retries ]; then echo "Timeout waiting for healthcheck"; exit 1; fi
          done
          # [2026-07-26 정정] 종전 `curl -f .../actuator/prometheus` 는 200 을 기대해 **401 에서 죽었다.**
          #   그런데 ApiSecurityConfig 는 /actuator/** 를 ROLE_ADMIN/ROLE_SYSTEM 으로 보호하므로
          #   **401 이 정상 동작**이다. 즉 앱이 아니라 CI 기대값이 틀렸다. 스텝을 지우는 대신
          #   "엔드포인트가 존재하며 보호되어 있다" 를 검증한다 — 미인증 200 이면 보호 회귀로 잡힌다.
          echo "Checking Prometheus metrics endpoint (인증 필요 = 정상)..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/prometheus || echo 000)
          case "$CODE" in
            401|403) echo "metrics 엔드포인트가 보호되어 있음($CODE) — 정상" ;;
            200) echo "::warning title=metrics 미보호::/actuator/prometheus 가 미인증 200 을 반환했습니다. ROLE_ADMIN 보호가 풀렸는지 확인하십시오." ;;
            *) echo "::error title=metrics 엔드포인트 비정상::응답 코드 $CODE (엔드포인트 부재 또는 앱 비정상)"; exit 1 ;;
          esac
          echo "Backend is ready!"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright Dependencies (system deps)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Restore Next.js build cache
        uses: actions/download-artifact@v4
        with:
          name: next-build-cache
          path: frontend/.next/cache
        continue-on-error: true

      # [2026-07-28 분리] 종전에는 프론트 빌드·기동·테스트가 **한 run 블록**이었다. 그래서 잡이
      #   70분을 썼을 때 **그 중 빌드가 몇 분인지조차 알 수 없었다** — 스텝 단위 소요시간은 API 로
      #   조회할 수 있지만 블록 내부는 나눠지지 않는다(실측 진단에서 실제로 막혔다).
      #   실패 지점 판별에도 같은 문제가 있었다: 빌드 실패인지 기동 실패인지 테스트 실패인지가
      #   한 스텝의 outcome 하나로 뭉개졌다. 셋으로 나눠 각각을 관측·판정 가능하게 만든다.
      # [프로덕션 모드] `next dev` 가 아니라 프로덕션 빌드로 띄운다. 이 저장소에는 *next-dev 의
      #   Server-Action transport 플레이키(앱 버그 아님 · 프로덕션 빌드로만 해소)* 기록이 있어,
      #   E2E 를 개발 서버에 붙이는 한 article CRUD 계열이 간헐 실패한다. 위 'Restore Next.js
      #   build cache' 가 살아 있어 빌드 비용도 상당 부분 회수된다.
      - name: Build frontend (production)
        id: e2e-fe-build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/next-build.log
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      # [2026-07-26 정정] dev 스크립트에 이미 `-p 3001` 이 들어 있다
      #   (cross-env NODE_OPTIONS=... next dev -p 3001).
      #   종전 `pnpm run dev -- -p 3001` 은 인자를 덧붙여 `next dev -p 3001 -- -p 3001` 이 되고,
      #   Next 가 `-p` 를 **프로젝트 디렉터리**로 해석해 즉사했다:
      #   "Invalid project directory provided, no such directory: .../frontend/-p"
      #   그 결과 wait-on 이 60초를 기다린 뒤 타임아웃했다(실제 원인은 기동 실패).
      #   출력을 파일로 남긴다 — 종전에는 dev 가 즉사해도 wait-on 이 60초 뒤 "Timed out" 만 남겨
      #   **진짜 원인이 가려졌다**. 대기 시간도 러너의 콜드 부팅을 감안해 120초로 둔다.
      # ⚠ `nohup` 필수: 스텝을 분리하면 각 스텝이 별도 셸이라, 그냥 `&` 로 띄운 프로세스는 스텝
      #   종료 시 정리 대상이 될 수 있다. 다음 스텝에서도 살아 있어야 하므로 세션에서 떼어낸다.
      - name: Start frontend and wait for readiness
        id: e2e-fe-start
        run: |
          nohup pnpm run start:3001 > /tmp/next-start.log 2>&1 &
          disown || true
          npx wait-on http://127.0.0.1:3001/login --timeout 120000
          echo "프론트 기동 확인: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/login)"
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      # [2026-07-27] 출력을 파일로 남긴다. 종전에는 어디에도 남기지 않아, 잡이 75분
      #   timeout 으로 잘렸을 때(= conclusion 이 failure 가 아니라 cancelled) **어느 테스트가
      #   예산을 먹었는지 알 방법이 전혀 없었다.** 로그 조회는 권한이 필요하므로 annotations
      #   경로로 꺼내 쓸 수 있게 해 둔다(백엔드 잡의 tee 관례와 동일).
      - name: Run E2E Tests (Sharded)
        id: e2e-run
        run: |
          set -o pipefail
          npx playwright test --shard=${{ matrix.shard }} 2>&1 | tee /tmp/e2e-run.log
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # matrix.shard 는 '1/3' 형태라 아티팩트 이름에 '/' 가 들어가 업로드가 거부된다
          # (2026-07-26 실측: "The artifact name is not valid ... Forward slash /").
          # strategy.job-index(0,1,2)를 쓰면 download 의 pattern(playwright-report-shard-*)도 그대로 맞는다.
          name: playwright-report-shard-${{ strategy.job-index }}
          path: frontend/playwright-report/
          retention-days: 30
          include-hidden-files: true

  # E2E 테스트 결과를 하나로 병합하는 잡 (선택 사항)
      # [실패 관측] E2E 는 과금차단 기간 내내 미실행이라 실패 지점이 불투명하다. 어느 스텝이 죽었는지와
      # 컨테이너 상태·API 로그를 애노테이션으로 노출한다(로그 다운로드는 admin 권한 필요).
      - name: Surface failure detail (annotations)
        # [2026-07-27 정정] 종전 `if: failure()` 는 **timeout 으로 잘린 경우를 통과시켰다.**
        #   GitHub 은 timeout-minutes 초과 잡을 failure 가 아니라 **cancelled** 로 표시하므로,
        #   실제로 2026-07-27 실행에서 e2e 3샤드가 75분 timeout 으로 잘렸을 때 이 스텝이 통째로
        #   skip 됐고 **원인 신호가 하나도 남지 않았다**. 진단이 가장 필요한 경우에 진단이 꺼지는
        #   구조였다. cancelled 까지 포함한다(성공 시엔 여전히 돌지 않는다).
        if: failure() || cancelled()
        run: |
          echo "::error title=실패 스텝 판정::api-build=${{ steps.e2e-build.outcome }} / compose=${{ steps.e2e-compose.outcome }} / api-wait=${{ steps.e2e-wait.outcome }} / fe-build=${{ steps.e2e-fe-build.outcome }} / fe-start=${{ steps.e2e-fe-start.outcome }} / run=${{ steps.e2e-run.outcome }}"
          for f in /tmp/e2e-run.log /tmp/compose-build.log /tmp/compose-up.log /tmp/next-build.log /tmp/next-start.log; do
            [ -f "$f" ] || continue
            echo "::error title=$(basename $f) 마지막 출력::$(tail -c 2000 "$f" | paste -sd' ' -)"
          done
          echo "::error title=컨테이너 상태::$(docker compose ps -a 2>&1 | paste -sd' ' -)"
          echo "::error title=API 컨테이너 로그(마지막)::$(docker compose logs --tail=40 api 2>&1 | tail -c 2000 | paste -sd' ' -)"

  e2e-merge-reports:
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # [2026-07-26 정정] 종전 `if: always()` 는 e2e-tests 가 **스킵된 경우에도** 실행돼,
    # 병합할 리포트가 없으니 반드시 실패했다 — 상류 실패 1건이 CI 에 red 2건으로 보이게 만드는
    # 신호 오염이었다. 실제로 실행된 경우에만 병합한다(실패한 e2e 의 리포트는 여전히 병합 대상).
    if: always() && needs.e2e-tests.result != 'skipped' && needs.e2e-tests.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: frontend/playwright-reports
          pattern: playwright-report-shard-*
          merge-multiple: true

      # [연쇄 실패 제거] E2E 가 **리포트를 만들기 전에** 죽으면 다운로드할 아티팩트가 없어
      #   `merge-reports` 가 "Directory does not exist" 로 실패한다. 그러면 상류 실패 1건이 red 2건으로
      #   보여 신호가 오염된다(2026-07-26 실측). 병합할 것이 없으면 경고만 남기고 통과시킨다 —
      #   E2E 자체의 실패는 e2e-tests 잡이 이미 red 로 보고하므로 은폐가 아니다.
      - name: Merge reports
        run: |
          if [ ! -d ./playwright-reports ] || [ -z "$(ls -A ./playwright-reports 2>/dev/null)" ]; then
            echo "::warning title=병합할 Playwright 리포트 없음::E2E 가 리포트 생성 전에 실패했습니다. 병합을 생략합니다(원인은 e2e-tests 잡 참조)."
            exit 0
          fi
          npx playwright merge-reports --reporter html ./playwright-reports
        working-directory: frontend

      - name: Upload merged report
        if: hashFiles('frontend/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: frontend/playwright-report
          retention-days: 30

  # ── 증분 뮤테이션 테스트 (PIT) ──
  # 리팩토링 대상 도메인으로 targetClasses 를 한정한 증분(Incremental) 분석.
  # STRICT_MUTATION: 'true' → build.gradle 의 mutationThreshold=75 하드 게이트 강제. (백엔드 헌법 제16조)
  #
  # [실측 이력 2026-07-26]
  #   board 범위    69.8%(194/278) → 보강 → 83%(430/518, 범위 확대 후)
  #   file 범위     69.8%(37/53)   → 보강 → 81%(43/53)
  # 스코어가 떨어져 이 잡이 빨간불이면, 임계를 낮추거나 대상을 줄이지 말고
  # 죽지 않은 뮤턴트에 단언을 추가할 것.
  #
  # [범위 확대 2026-07-26] 종전 대상은 board/file 4패턴뿐이었고, 그중 file 2패턴은
  # business-app 에 존재하지 않아(FileService 는 business-core 소속) 실제로는 board 만 측정됐다.
  # `nuri.business.service.*` 전수 실측(729 뮤턴트/73.1%)으로 패키지별 점수를 뽑은 뒤,
  # 임계를 안정적으로 상회하는 패키지만 편입해 518 뮤턴트/83% 를 확보했다(종전 278 대비 1.86배).
  #
  # 미편입(=보강 백로그, 측정 점수순):
  #   faq 70 · template 63 · memoreport 61 · addressbook 59 · help 58 · report 56
  #   · schedule 39 · scrap 39 · stats 29 · user.listener 0
  # 각 패키지의 테스트를 보강해 편입해도 전체 점수가 75% 아래로 내려가지 않으면 위 목록에 추가한다.
  #
  # business-core 는 file 도메인(업로드 경로)을 담당하므로 별도 스텝으로 함께 강제한다.
  mutation-test:
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache PIT incremental history
        uses: actions/cache@v4
        with:
          path: "**/build/pitest/pitHistory.txt"
          key: pit-history-${{ github.sha }}
          restore-keys: |
            pit-history-

      - name: Incremental Mutation Test (business-app scope)
        run: ./gradlew :business-app:pitest
        env:
          PIT_TARGET_CLASSES: "nuri.business.domain.board.*,nuri.business.service.board.*,nuri.business.service.note.*,nuri.business.service.notification.*,nuri.business.service.sms.*,nuri.business.service.mail.*,nuri.business.service.informalsanction.*,nuri.business.service.comment.*,nuri.business.service.image.*,nuri.business.service.calendar.*,nuri.business.service.isg.*,nuri.business.service.log.*,nuri.business.service.operation.*"
          PIT_TARGET_TESTS: "nuri.business.*"
          STRICT_MUTATION: "true"

      - name: Incremental Mutation Test (business-core file scope)
        run: ./gradlew :business-core:pitest
        env:
          PIT_TARGET_CLASSES: "nuri.business.domain.file.*,nuri.business.service.file.*"
          PIT_TARGET_TESTS: "nuri.business.*"
          STRICT_MUTATION: "true"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: "**/build/reports/pitest"
          retention-days: 30
