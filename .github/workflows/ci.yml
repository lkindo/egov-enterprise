name: Java CI with Gradle

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # 공통 환경 변수
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Gradle 캐싱 활성화
          cache-disabled: false
          cache-read-only: false
          cache-overwrite-existing: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect Schema and JPA Entity Changes
        id: schema-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            schema:
              - 'foundation/src/main/java/**/entity/**'
              - 'foundation/src/test/resources/db/migration/**'
              - 'foundation/build.gradle'
              - 'foundation/src/test/resources/application-test.yml'
              - 'foundation/src/test/resources/application-test-dump.yml'

      - name: Strict Schema Integrity Validation (No Cache Gateway)
        if: steps.schema-changes.outputs.schema == 'true'
        run: ./gradlew :foundation:test --no-build-cache

      - name: Build and Test with Gradle
        run: ./gradlew build jacocoRootReport check -Dopenapi.export.path=api-docs.json

      # [계약 드리프트 게이트] 위 build 가 -Dopenapi.export.path 로 api-docs.json 을 재생성한다.
      # 커밋된 api-docs.json 이 실제 DTO/컨트롤러와 어긋나면(=stale) 여기서 diff 로 빌드를 실패시킨다.
      # (예: 신설 엔드포인트가 커밋된 스펙에 누락된 채 머지되는 상황 차단)
      - name: Verify committed api-docs.json is fresh (contract drift gate)
        run: git diff --exit-code api-docs.json

      - name: Export OpenAPI Spec
        run: ./gradlew :api-server:bootRun & sleep 30 && curl -s http://localhost:8080/v3/api-docs > openapi-generated.json || true
        continue-on-error: true

      - name: Check OpenAPI Spec Changes
        id: openapi-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api-server/**'
              - 'foundation/**'
              - 'business-core/**'
              - 'business-app/**'
        continue-on-error: true

      - name: Upload OpenAPI Spec (if changed)
        if: steps.openapi-changes.outputs.api == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-changed
          path: api-docs.json
          retention-days: 30
        continue-on-error: true

      - name: OWASP Dependency-Check Security Scan
        run: ./gradlew dependencyCheckAnalyze --info
        continue-on-error: true

      - name: Upload OWASP Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-security-report
          path: |
            **/build/reports/dependency-check-report.html
            **/build/reports/dependency-check-report.xml
          retention-days: 30

      - name: Upload Quality and Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/dependency-check

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/aggregated

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: api-docs.json

  frontend-build:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # [계보 정합] codegen 은 리포지토리 루트 api-docs.json(백엔드 job 이 git diff 로 신선함 검증)을 읽는다.
      # frontend/ 로 스펙을 내려받던 옛 download-artifact 스텝은 소비처가 없고 frontend/api-docs.json(계보역전)을
      # 유발하므로 제거했다.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # [계약 드리프트 게이트] 커밋된 api-docs.json(백엔드 job 이 신선함을 이미 검증) 으로부터
      # 타입/Zod 를 재생성해 커밋본과 diff. 스펙은 바뀌었는데 codegen 을 안 돌린 드리프트를 차단한다.
      - name: Verify generated API types are in sync with spec (contract drift gate)
        run: |
          pnpm run codegen:verify
          pnpm run codegen:verify:zod
        working-directory: frontend

      - name: Security Audit
        run: pnpm audit --audit-level high
        working-directory: frontend
        continue-on-error: true

      - name: Build and Test
        run: |
          pnpm run build
          pnpm run test
        working-directory: frontend

      - name: Upload Next.js build cache
        uses: actions/upload-artifact@v4
        with:
          name: next-build-cache
          path: frontend/.next/cache
          retention-days: 7

  e2e-tests:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3 개의 shard 로 분할하여 병렬 실행
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Infrastructure (DB & API)
        run: docker-compose up -d db api

      - name: Wait for API and Prometheus Metrics
        run: |
          echo "Waiting for backend to be healthy..."
          max_retries=20
          count=0
          until $(curl --output /dev/null --silent --head --fail http://localhost:8080/actuator/health); do
            printf '.'
            sleep 5
            count=$((count+1))
            if [ $count -eq $max_retries ]; then echo "Timeout waiting for healthcheck"; exit 1; fi
          done
          echo "Checking Prometheus metrics endpoint..."
          curl -f http://localhost:8080/actuator/prometheus || exit 1
          echo "Backend is ready!"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright Dependencies (system deps)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Restore Next.js build cache
        uses: actions/download-artifact@v4
        with:
          name: next-build-cache
          path: frontend/.next/cache
        continue-on-error: true

      - name: Run E2E Tests (Sharded)
        run: |
          # Start frontend in background
          pnpm run dev -- -p 3001 &
          npx wait-on http://127.0.0.1:3001/login --timeout 60000
          # Run tests with sharding for parallel execution
          npx playwright test --shard=${{ matrix.shard }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30
          include-hidden-files: true

  # E2E 테스트 결과를 하나로 병합하는 잡 (선택 사항)
  e2e-merge-reports:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: frontend/playwright-reports
          pattern: playwright-report-shard-*
          merge-multiple: true

      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter html ./playwright-reports
        working-directory: frontend

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: frontend/playwright-report
          retention-days: 30

  # ── 증분 뮤테이션 테스트 (PIT) ──
  # 리팩토링 대상 도메인으로 targetClasses 를 한정한 증분(Incremental) 분석.
  # 현재는 '리포트 전용'(STRICT_MUTATION: false → mutationThreshold=0)이며, 각 대상 클래스의
  # 뮤테이션 스코어 75% 달성을 확인한 뒤 STRICT_MUTATION: 'true' 로 전환하면
  # build.gradle 의 mutationThreshold=75 하드 게이트가 강제된다. (백엔드 헌법 제16조)
  mutation-test:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache PIT incremental history
        uses: actions/cache@v4
        with:
          path: "**/build/pitest/pitHistory.txt"
          key: pit-history-${{ github.sha }}
          restore-keys: |
            pit-history-

      - name: Incremental Mutation Test (refactored scope)
        run: ./gradlew :business-core:pitest :business-app:pitest
        env:
          PIT_TARGET_CLASSES: "nuri.business.domain.file.*,nuri.business.domain.board.*,nuri.business.service.file.*,nuri.business.service.board.*"
          PIT_TARGET_TESTS: "nuri.business.*"
          STRICT_MUTATION: "false"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: "**/build/reports/pitest"
          retention-days: 30
