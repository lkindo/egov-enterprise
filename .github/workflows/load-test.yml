name: Performance Load Test

# [2026-07-26 트리거 축소] 종전에는 main/develop 의 **모든 push 와 PR** 마다 부하 테스트가 돌았다.
#   ① 부하 테스트는 코드 정합성 게이트가 아니라 성능 관측이라 커밋 단위로 돌릴 필요가 없고
#   ② 대상 BASE_URL 이 없는 환경에서는 매 푸시마다 실패해 CI 신호를 오염시켰다(전량 red).
#   주간 스케줄 + 수동 실행으로 전환한다.
on:
  schedule:
    - cron: "0 17 * * 0" # 매주 일요일 02:00 KST
  workflow_dispatch:
    inputs:
      load_level:
        description: "Load Level (100, 500, 1000)"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "500"
          - "1000"
      duration:
        description: "Test duration (e.g., 5m, 30s)"
        required: false
        default: "5m"

env:
  K6_VERSION: "1.7.1"
  BASE_URL: ${{ secrets.LOAD_TEST_BASE_URL || 'http://localhost:8080' }}
  TEST_USERNAME: ${{ secrets.LOAD_TEST_USERNAME || 'testuser' }}
  TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD || 'testpass123!' }}

jobs:
  load-test:
    # [이중 가드] 위 on: 에서 push/pull_request 를 제거했는데도 GitHub 이 트리거 설정을 캐시해
    # 커밋 3회분 동안 계속 push 이벤트로 실행했다(2026-07-26 실측: event=push, path=load-test.yml).
    # 워크플로우 정의 반영을 기다리지 않고 잡 레벨에서 확실히 차단한다 — 이렇게 하면 실행되더라도
    # skipped 로 끝나 CI 신호를 오염시키지 않는다.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: egov
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/
          k6 version

      - name: Start Backend Server
        run: |
          # Set up application properties for test
          mkdir -p api-server/src/main/resources
          cat > api-server/src/main/resources/application-test.yml << EOF
          spring:
            datasource:
              url: jdbc:postgresql://localhost:5432/egov
              username: postgres
              password: postgres
              driver-class-name: org.postgresql.Driver
            jpa:
              hibernate:
                ddl-auto: create-drop
              show-sql: false
              properties:
                hibernate:
                  format_sql: false
          server:
            port: 8080
          EOF

          # Start backend in background
          ./gradlew :api-server:bootRun --daemon > backend.log 2>&1 &

          # Wait for server to be ready
          echo "Waiting for backend server to start..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "Backend failed to start"
          exit 1
        env:
          SPRING_PROFILES_ACTIVE: test
          # 가상 스레드 pinning 관측: 부하 테스트 중 pinning 발생 시 backend.log 에 스택트레이스 기록
          TRACE_PINNED: full

      - name: Run k6 Load Test
        run: |
          # Determine which scenario to run
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            LOAD_LEVEL="${{ github.event.inputs.load_level }}"
          else
            # Default to 100 for CI runs
            LOAD_LEVEL="100"
          fi

          echo "Running load test with $LOAD_LEVEL concurrent users"

          # Create results directory
          mkdir -p test-results/k6
          mkdir -p test/load-tests/results

          # Run k6 with selected scenario
          # HTML report will be automatically generated by handleSummary function
          k6 run \
            --out json=test-results/k6/results.json \
            --tag load_level=$LOAD_LEVEL \
            --tag git_sha=$GITHUB_SHA \
            --tag git_ref=$GITHUB_REF \
            --scenario users-$LOAD_LEVEL \
            test/load-tests/scenarios/load-levels.js

          # Copy generated HTML report to central location
          if [ -f test/load-tests/results/*.html ]; then
            cp test/load-tests/results/*.html test-results/k6/report.html
            echo "HTML report copied to test-results/k6/report.html"
          else
            echo "Warning: No HTML report generated"
          fi

          # Generate summary
          k6 inspect --execution-requirements test/load-tests/scenarios/load-levels.js

      - name: Report Virtual Thread Pinning
        if: always()
        run: |
          echo "=== Virtual thread pinning events during load test (jdk.tracePinnedThreads=full) ==="
          if [ -f backend.log ]; then
            PINNED=$(grep -ic "pinned" backend.log || true)
            echo "Pinning-related log lines: ${PINNED:-0}"
            if [ "${PINNED:-0}" -gt 0 ]; then
              echo "::warning::Virtual thread pinning detected during load test (${PINNED} lines). Review backend.log artifact; consider ReentrantLock on hot I/O or Hikari pool tuning."
              grep -i -A 15 "pinned" backend.log | head -120 || true
            else
              echo "No virtual thread pinning detected under this load level."
            fi
          else
            echo "backend.log not found (backend may not have started)."
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            test-results/k6/
            backend.log
          retention-days: 30

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-html-report-${{ github.run_id }}
          path: |
            test-results/k6/report.html
            test/load-tests/results/*.html
          retention-days: 30

      - name: Upload k6 results to Dashboard (optional)
        if: always() && secrets.K6_CLOUD_TOKEN != ''
        run: |
          # Convert to k6 Cloud format if token is available
          echo "K6 Cloud upload skipped (configure K6_CLOUD_TOKEN secret to enable)"
        continue-on-error: true

      - name: Stop Backend Server
        if: always()
        run: |
          # Stop gradle daemon
          ./gradlew --stop || true

          # Kill any remaining java processes
          pkill -f bootRun || true

      # Optional: Deploy HTML Report to GitHub Pages
      # To enable this feature:
      # 1. Create a gh-pages branch: git checkout --orphan gh-pages && git commit --allow-empty -m "Init" && git push origin gh-pages
      # 2. Go to Settings > Pages > Source: Deploy from a branch > gh-pages > / (root)
      # 3. Uncomment the step below
      #
      # - name: Deploy to GitHub Pages
      #   if: github.ref == 'refs/heads/main' && always()
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: test-results/k6
      #     destination_dir: reports/${{ github.run_id }}
      #     commit_message: 'Deploy k6 report for run ${{ github.run_id }}'
