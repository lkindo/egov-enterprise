name: Performance Load Test

# [2026-07-26 트리거 축소] 종전에는 main/develop 의 **모든 push 와 PR** 마다 부하 테스트가 돌았다.
#   ① 부하 테스트는 코드 정합성 게이트가 아니라 성능 관측이라 커밋 단위로 돌릴 필요가 없고
#   ② 대상 BASE_URL 이 없는 환경에서는 매 푸시마다 실패해 CI 신호를 오염시켰다(전량 red).
#   주간 스케줄 + 수동 실행으로 전환한다.
on:
  schedule:
    - cron: "0 17 * * 0" # 매주 일요일 02:00 KST
  workflow_dispatch:
    inputs:
      load_level:
        description: "Load Level (100, 500, 1000)"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "500"
          - "1000"
      # [2026-08-09 삭제] `duration` 입력이 있었으나 **어디에서도 참조되지 않았다**(실측 0건).
      #   부하 시간은 load-levels.js 의 시나리오 stages 에 박혀 있어서, 이 칸에 무엇을 넣든
      #   실행 시간은 바뀌지 않았다 — 조작 가능해 보이는데 아무 효과가 없는 입력은
      #   "설정했으니 그렇게 돌 것" 이라는 잘못된 믿음만 만든다(AGENTS H5 와 같은 성격).
      #   시간을 바꾸려면 load-levels.js 의 해당 시나리오 stages 를 수정할 것.

# ⚠ 워크플로우 레벨 env 에서는 secrets 컨텍스트를 쓸 수 없다(사용 가능: github·vars·inputs).
#   종전 이 블록이 ${{ secrets.LOAD_TEST_* }} 를 참조해 **파일 전체가 무효(startup_failure)** 였고,
#   그래서 이 워크플로우는 한 번도 실행된 적이 없다(2026-07-26 실측: jobs=0 · 즉시 failure).
#   무효 파일이면 GitHub 이 트리거 판정에 '마지막 유효 설정'을 쓰기 때문에, on: 을 schedule 전용으로
#   바꿔도 계속 push 로 실행되던 현상까지 여기서 비롯됐다. secrets 는 잡 레벨 env 로 내린다.
env:
  K6_VERSION: "1.7.1"

jobs:
  load-test:
    # [이중 가드] 워크플로우 정의 반영이 늦어도 확실히 차단 — 실행되더라도 skipped 로 끝난다.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: ${{ secrets.LOAD_TEST_BASE_URL || 'http://localhost:8080' }}
      # [2026-08-09 정정] 기본값 testuser/testpass123! 은 **어느 시드에도 없는 계정**이었다.
      #   이 잡은 docker compose 로 빈 DB 를 띄우므로 seed-dev 의 실제 계정만 로그인된다.
      #   (E2E 와 같은 계정 — frontend/e2e/test-credentials.ts)
      TEST_USERNAME: ${{ secrets.LOAD_TEST_USERNAME || 'webmaster' }}
      TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD || '1' }}
      # if: 조건에서 판정하려면 secrets 가 아니라 env 로 노출돼 있어야 한다(아래 Dashboard 스텝 참조)
      K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}


    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      # [2026-08-08 순서 정정] pnpm 설치가 setup-node **뒤**에 있어 매번 죽었다.
      #   setup-node 의 `cache: "pnpm"` 은 캐시 경로를 알아내려고 `pnpm` 실행 파일을 호출한다.
      #   그런데 설치가 다음 스텝이라 그 시점에 pnpm 이 없다:
      #     ##[error]Unable to locate executable file: pnpm
      #   ci.yml 은 3곳 모두 pnpm -> setup-node 순서다(정상 동작 중). 그 순서에 맞춘다.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/
          k6 version

      # [2026-08-08 재작성] 종전 스텝은 두 가지를 잘못하고 있었다.
      #
      #   ① **커밋된 설정 파일을 덮어썼다.**
      #      `cat > api-server/src/main/resources/application-test.yml` 로 파일을 갈아엎는데,
      #      그 파일은 실존하는 커밋 대상이다(H2 인메모리 + 로그보존 스케줄러 비활성 등
      #      테스트 컨텍스트 의도가 담겨 있다). 워크플로가 저장소 설정을 파괴하고 있었다.
      #
      #   ② **DB 이름이 어긋났다.** 서비스 컨테이너와 주입 설정은 `egov` 인데 앱이 접속하는
      #      곳은 `egovdb` 다. 실측 로그:
      #        org.postgresql.util.PSQLException: FATAL: database "egovdb" does not exist
      #      그래서 5분 대기 후 "Backend failed to start" 로 죽었다.
      #      (덤으로 postgres:14 였다 — 프로젝트 표준은 17이다.)
      #
      #   ci.yml 의 E2E 가 이미 `docker compose up -d db api` 로 띄우고 정상 동작한다.
      #   같은 방식을 쓰면 DB 이름·버전·스키마가 compose 정의 하나로 통일되고,
      #   설정 파일을 건드릴 이유가 사라진다.
      - name: Start Backend (docker compose)
        run: |
          set -o pipefail
          docker compose up -d --wait db api 2>&1 | tee /tmp/lt-compose.log

      - name: Diagnose on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 150 db api || true

      - name: Run k6 Load Test
        run: |
          # Determine which scenario to run
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            LOAD_LEVEL="${{ github.event.inputs.load_level }}"
          else
            # Default to 100 for CI runs
            LOAD_LEVEL="100"
          fi

          echo "Running load test with $LOAD_LEVEL concurrent users"

          # Create results directory
          mkdir -p test-results/k6
          mkdir -p test/load-tests/results

          # [2026-08-09 정정] 종전 `--scenario users-$LOAD_LEVEL` 은 **존재하지 않는 플래그**였다.
          #   실측(k6 v1.7.1): level=error msg="unknown flag: --scenario" → exit 255.
          #   그래서 이 스텝은 한 번도 완주한 적이 없다(그 앞의 DB 파손이 8월 8일에 걷히면서
          #   비로소 드러났다 — 두 파손이 서로를 가리고 있었다).
          #
          #   k6 는 시나리오를 CLI 로 고르는 수단을 제공하지 않는다. 스크립트가 __ENV 를 읽어
          #   options.scenarios 를 좁히는 것이 정석이고, load-levels.js 를 그렇게 고쳤다.
          #
          #   ⚠ 시스템 환경변수가 아니라 **`-e` 플래그**로 넘긴다. `k6 run` 은
          #   --include-system-env-vars 가 기본 true 지만 `k6 inspect` 는 아니다(실측).
          #   서브커맨드별 기본값에 기대지 않고 양쪽 모두 명시한다.
          #
          #   K6_SCENARIO 를 빼먹으면 세 시나리오가 동시에 돈다(1600 VU · 20분).
          #   오타면 스크립트가 즉시 실패한다(실측 exit 107).
          # HTML report will be automatically generated by handleSummary function
          k6 run \
            --out json=test-results/k6/results.json \
            --tag load_level=$LOAD_LEVEL \
            --tag git_sha=$GITHUB_SHA \
            --tag git_ref=$GITHUB_REF \
            -e K6_SCENARIO=users-$LOAD_LEVEL \
            test/load-tests/scenarios/load-levels.js

          # Copy generated HTML report to central location
          if [ -f test/load-tests/results/*.html ]; then
            cp test/load-tests/results/*.html test-results/k6/report.html
            echo "HTML report copied to test-results/k6/report.html"
          else
            echo "Warning: No HTML report generated"
          fi

          # Generate summary — 여기도 같은 시나리오로 좁혀야 한다.
          #   빼먹으면 실행한 것과 다른(세 시나리오 합산) 요구사항을 출력해 보고서가 어긋난다.
          k6 inspect --execution-requirements \
            -e K6_SCENARIO=users-$LOAD_LEVEL \
            test/load-tests/scenarios/load-levels.js

      - name: Report Virtual Thread Pinning
        if: always()
        run: |
          echo "=== Virtual thread pinning events during load test (jdk.tracePinnedThreads=full) ==="
          # [2026-08-08] backend 를 compose 로 띄우므로 backend.log 파일이 생기지 않는다.
          #   컨테이너 로그를 같은 이름으로 뽑아 이후 로직(pinning grep·아티팩트 업로드)을 그대로 쓴다.
          docker compose logs --no-color api > backend.log 2>/dev/null || true
          if [ -f backend.log ]; then
            PINNED=$(grep -ic "pinned" backend.log || true)
            echo "Pinning-related log lines: ${PINNED:-0}"
            if [ "${PINNED:-0}" -gt 0 ]; then
              echo "::warning::Virtual thread pinning detected during load test (${PINNED} lines). Review backend.log artifact; consider ReentrantLock on hot I/O or Hikari pool tuning."
              grep -i -A 15 "pinned" backend.log | head -120 || true
            else
              echo "No virtual thread pinning detected under this load level."
            fi
          else
            echo "backend.log not found (backend may not have started)."
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            test-results/k6/
            backend.log
          retention-days: 30

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: k6-html-report-${{ github.run_id }}
          path: |
            test-results/k6/report.html
            test/load-tests/results/*.html
          retention-days: 30

      # ⚠ if: 조건에서는 secrets 컨텍스트를 쓸 수 없다(사용 가능: github·env·steps·needs·job·runner·vars·inputs).
      #   종전 `if: always() && secrets.K6_CLOUD_TOKEN != ''` 이 **파일 전체를 무효(startup_failure)** 로
      #   만들고 있었다 — 이것이 load-test 가 한 번도 실행되지 못한 두 번째 원인이다(첫째는 workflow-level
      #   env 의 secrets 참조). 잡 레벨 env 로 승격한 값을 env 컨텍스트로 판정한다.
      - name: Upload k6 results to Dashboard (optional)
        if: always() && env.K6_CLOUD_TOKEN != ''
        run: |
          # Convert to k6 Cloud format if token is available
          echo "K6 Cloud upload skipped (configure K6_CLOUD_TOKEN secret to enable)"
        continue-on-error: true

      - name: Stop Backend (docker compose)
        if: always()
        run: docker compose down -v || true
