name: OWASP ZAP Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch: # Allow manual trigger

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.authz-e2e.yml
      # [2026-09-24] 2026-09-24 첫 API 스캔에서 응답 535건이 429 였다 — 그만큼의 공격이 핸들러에 닿지 못했고,
      #   응답 차이로 판정하는 규칙(SQL 인젝션 등)은 429 와 200 의 차이를 신호로 읽을 수 있다.
      #   스캔 환경에서만 한도를 올린다. 요청 제한 자체는 RateLimitFilter 테스트가 따로 검증한다.
      RATE_LIMIT_REQUESTS_PER_MINUTE: '1000000'
      RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE: '1000000'
      # [2026-10-29] 스캔에 넘기는 OpenAPI 사본에서 빼는 연산(세미콜론 구분, 'METHOD 경로'). 세션을 끝내는 연산만 둔다.
      #   ZAP 은 정의를 가져오면서 연산마다 요청을 하나씩 보내고, 그 요청에도 스캐너 토큰이 붙는다. 로그아웃은
      #   2026-10-19(97bdac2e2)부터 설계대로 그 시각 이전에 발급된 액세스 토큰을 거부하므로, 2026-10-25 실행은
      #   가져오기 도중 스캐너 세션이 끊겨 나머지 스캔이 인증 없이 돌았다(401 3,809건, 세션 확인 단계 red).
      #   로그아웃은 파라미터·본문이 없고 입력은 ZAP 이 갖지 않는 refresh 쿠키뿐이라 빼도 공격 표면 손실이 작다.
      #   서버 동작은 의도된 보안 수정이라 바꾸지 않는다. 목록은 WorkflowManifestLinterTest 가 정확히 고정한다.
      ZAP_SESSION_ENDING_OPERATIONS: 'POST /api/v1/auth/logout'
    name: Scan the application
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      # [2026-08-08] `--wait` 로 교체하고 `sleep 30` 스텝을 제거한다.
      #   종전에는 `up -d` 뒤 고정 30초를 기다렸다. 그런데 그 30초는 컨테이너가 **Started** 된
      #   시점이 아니라 `up -d` 가 **반환한** 시점부터 센다. 2026-08-02 실행에서 frontend 는
      #   03:38:08 에 Started 였고 스캔은 03:38:38 에 시작해 접속 실패했다 —
      #   `Started` 는 "프로세스가 떴다" 이지 "요청을 받을 준비가 됐다" 가 아니다.
      #   `--wait` 는 모든 서비스가 healthy 가 될 때까지 기다린다(frontend healthcheck 신설분 포함).
      - name: Start Docker Infrastructure
        run: docker compose up -d --wait db api frontend

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          # API 스캔 쪽은 false 인데 여기만 기본값(true)이라 **실패 시 GitHub 이슈가 자동 생성**된다.
          # 스캔이 한 번도 성공한 적이 없어 드러나지 않았을 뿐이다. 리포트는 아티팩트로 남으므로
          # 이슈 자동 생성은 끄고 두 스텝의 거동을 맞춘다.
          allow_issue_writing: false
          # [2026-08-08] 두 스텝이 기본 아티팩트명 `zap_scan` 을 공유해 두 번째 업로드가
          #   409 Conflict 로 죽었다 — **스캔은 둘 다 성공했는데** 잡이 실패했다:
          #     Failed to CreateArtifact: (409) an artifact with this name already exists
          #   이름을 분리한다.
          artifact_name: zap_baseline_frontend
          
      # [2026-09-24] API 는 OpenAPI 정의를 읽어 문서화된 연산 전체를, 로그인한 상태로 스캔한다.
      #   종전에는 full-scan 이 `/v3/api-docs` 를 **웹 페이지로** 크롤링했다. 링크를 따라가는 방식이라
      #   JSON 안의 API 경로를 찾지 못했고, 2026-09-20 리포트의 대상 URL 은 문서·health·robots·sitemap·`/`
      #   다섯 개뿐이었다 — API 엔드포인트는 한 번도 스캔되지 않았다. 인증도 없어 대부분 401 에서 멈췄을 것이다.
      #
      #   스캐너 계정은 E2E 가 쓰는 개발 시드 관리자다(격리 compose 의 버리는 DB — authz-e2e 오버레이).
      #   계정 값은 E2E 와 같은 모듈에서 읽고 토큰은 로그에서 가린다. 이 단계는 frontend baseline 뒤에 둔다 —
      #   GITHUB_ENV 는 이후 단계에만 적용되므로 화면 스캔은 종전처럼 로그인 전 상태로 남는다.
      - name: Authenticate API scanner
        run: |
          set -euo pipefail
          body=$(node --input-type=module -e "import { TEST_CREDENTIALS } from './frontend/e2e/synthetic-test-credentials.mjs'; process.stdout.write(JSON.stringify({ userId: TEST_CREDENTIALS.admin.id, password: TEST_CREDENTIALS.admin.password }))")
          token=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' -d "$body" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s)?.data?.accessToken;if(!t)process.exit(1);process.stdout.write(t)})")
          echo "::add-mask::$token"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://localhost:8080/api/v1/auth/me)
          if [ "$code" != "200" ]; then
            echo "::error::스캐너 토큰으로 /api/v1/auth/me 가 HTTP $code 를 돌려줬다 — 이대로면 인증 없이 스캔한다."
            exit 1
          fi
          {
            echo "ZAP_AUTH_HEADER=Authorization"
            echo "ZAP_AUTH_HEADER_VALUE=Bearer $token"
            echo "ZAP_AUTH_HEADER_SITE=localhost"
            echo "SCANNER_TOKEN=$token"
          } >> "$GITHUB_ENV"

      # 위 ZAP_SESSION_ENDING_OPERATIONS 의 연산만 뺀 정의 사본을 작업 공간에 만든다(ZAP 컨테이너의 /zap/wrk).
      #   목록의 연산이 정의에 없으면 실패한다 — 경로가 바뀐 낡은 제외가 조용히 아무것도 빼지 않게 두지 않는다.
      - name: Prepare API definition without session-ending operations
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/v3/api-docs -o "$RUNNER_TEMP/api-docs.json"
          node -e '
            const fs = require("node:fs");
            const [source, target] = process.argv.slice(1);
            const spec = JSON.parse(fs.readFileSync(source, "utf8"));
            const listed = (process.env.ZAP_SESSION_ENDING_OPERATIONS ?? "").split(";").map((entry) => entry.trim()).filter(Boolean);
            if (listed.length === 0) { console.log("::error::ZAP_SESSION_ENDING_OPERATIONS 가 비어 있다."); process.exit(1); }
            const methods = ["get", "put", "post", "delete", "options", "head", "patch", "trace"];
            for (const entry of listed) {
              const [method, path, extra] = entry.split(" ");
              const key = (method ?? "").toLowerCase();
              const item = spec.paths?.[path];
              if (extra !== undefined || !methods.includes(key) || !item || !Object.hasOwn(item, key)) {
                console.log(`::error::스캔에서 뺄 연산이 정의에 없다(낡은 제외): ${entry}`);
                process.exit(1);
              }
              delete item[key];
              if (!methods.some((name) => Object.hasOwn(item, name))) delete spec.paths[path];
            }
            fs.writeFileSync(target, JSON.stringify(spec));
          ' "$RUNNER_TEMP/api-docs.json" zap-api-docs.json
          {
            echo "### ZAP API 스캔 정의"
            echo "- 세션을 끝내 스캔 정의에서 뺀 연산: $ZAP_SESSION_ENDING_OPERATIONS"
          } >> "$GITHUB_STEP_SUMMARY"

      # 능동 스캔은 40분에서 끊는다. 액세스 토큰 유효시간이 60분(jwt.access-token-validity-ms 기본값)이라
      #   그보다 길면 중간부터 조용히 로그인 없이 스캔하게 된다. 끊긴 범위는 리포트와 아래 요약에 남는다.
      #   대상은 위 단계가 만든 파일이다(zap-api-scan.py 가 /zap/wrk 기준으로 연다). 정의의 첫 servers 가 상대 경로('/')라
      #   -O 로 대상 호스트를 준다.
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d  # v0.10.0
        with:
          target: 'zap-api-docs.json'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-O http://localhost:8080 -z "-config scanner.maxScanDurationInMins=40"'
          allow_issue_writing: false
          artifact_name: zap_api_scan

      # 스캔이 스캐너 계정을 바꾸거나(비밀번호·상태·삭제) 토큰이 만료되면 그 뒤 요청은 인증 없이 나갔다.
      #   그런 결과를 인증 스캔으로 읽지 않도록 세션이 끝까지 살아 있었는지 확인한다.
      - name: Verify scanner session survived
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SCANNER_TOKEN" http://localhost:8080/api/v1/auth/me)
          {
            echo "### ZAP API 스캔"
            echo "- 능동 스캔 상한: 40분(액세스 토큰 유효 60분 안)"
            echo "- 스캔 뒤 스캐너 세션: HTTP $code"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error::스캔 도중 스캐너 세션이 끊겼다(HTTP $code). 이후 요청은 인증 없이 나갔으므로 이 결과를 인증 스캔으로 읽으면 안 된다."
            exit 1
          fi

      # [2026-08-08 신설] 실패 진단. 이 워크플로에는 **진단 스텝이 하나도 없었다.**
      #   그래서 2026-08-08 실행에서 `container egov-frontend is unhealthy` 로 죽었을 때
      #   컨테이너 로그가 남지 않아 원인을 추정할 수밖에 없었다(`docker compose down` 이
      #   always 로 돌면서 흔적까지 지웠다).
      #   실패했을 때 무엇을 볼 수 있는지가 게이트의 값을 결정한다.
      # [2026-10-29] 기동 직후에서 정리 직전으로 옮겼다. 2026-10-25 세션 확인 실패 때 이 단계가 기동 뒤에만 있어
      #   api 로그가 남지 않았고, 거부 사유를 보고서의 경고 순서로 추정해야 했다. 지금은 어느 단계가 실패해도 돈다.
      #   api 는 꼬리 로그와 함께 전체 로그에서 인증 거부·로그아웃 줄을 따로 보인다.
      - name: Diagnose on failure
        if: failure()
        run: |
          echo '===== compose ps ====='
          docker compose ps -a
          for svc in db api frontend; do
            echo "===== logs: $svc ====="
            docker compose logs --tail 120 "$svc" || true
            echo "===== inspect health: $svc ====="
            cid=$(docker compose ps -aq "$svc" || true)
            [ -n "$cid" ] && docker inspect --format '{{json .State}}' "$cid" || true
          done
          echo '===== api: authentication rejections and logouts ====='
          docker compose logs api 2>&1 | grep -E '\[JwtFilter\] Authentication rejected|\[Logout\]' | tail -n 50 || true

      - name: Stop Docker Infrastructure
        if: always()
        run: docker compose down
