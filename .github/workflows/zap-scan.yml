name: OWASP ZAP Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch: # Allow manual trigger

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the application
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      # [2026-08-08] `--wait` 로 교체하고 `sleep 30` 스텝을 제거한다.
      #   종전에는 `up -d` 뒤 고정 30초를 기다렸다. 그런데 그 30초는 컨테이너가 **Started** 된
      #   시점이 아니라 `up -d` 가 **반환한** 시점부터 센다. 2026-08-02 실행에서 frontend 는
      #   03:38:08 에 Started 였고 스캔은 03:38:38 에 시작해 접속 실패했다 —
      #   `Started` 는 "프로세스가 떴다" 이지 "요청을 받을 준비가 됐다" 가 아니다.
      #   `--wait` 는 모든 서비스가 healthy 가 될 때까지 기다린다(frontend healthcheck 신설분 포함).
      - name: Start Docker Infrastructure
        run: docker compose up -d --wait db api frontend
          
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          # full scan 쪽은 false 인데 여기만 기본값(true)이라 **실패 시 GitHub 이슈가 자동 생성**된다.
          # 스캔이 한 번도 성공한 적이 없어 드러나지 않았을 뿐이다. 리포트는 아티팩트로 남으므로
          # 이슈 자동 생성은 끄고 두 스텝의 거동을 맞춘다.
          allow_issue_writing: false
          
      - name: ZAP Full Scan for API
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c  # v0.13.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          allow_issue_writing: false
          
      - name: Stop Docker Infrastructure
        if: always()
        run: docker compose down
