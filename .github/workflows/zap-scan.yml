name: OWASP ZAP Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch: # Allow manual trigger

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the application
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Start Docker Infrastructure
        run: docker compose up -d db api frontend
      
      - name: Wait for services
        run: |
          echo "Waiting for services to be ready..."
          sleep 30
          
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae  # v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          
      - name: ZAP Full Scan for API
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c  # v0.13.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          allow_issue_writing: false
          
      - name: Stop Docker Infrastructure
        if: always()
        run: docker compose down
