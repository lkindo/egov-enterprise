name: Gradle Dependency Graph Producer

# GitHub/Gradle의 public-fork 권장 신뢰 경계를 따른다.
# - pull_request: untrusted Gradle 코드는 read-only token으로 graph를 생성해 artifact만 올린다.
# - push/workflow_dispatch: trusted ref만 contents:write로 즉시 제출한다.
# PR artifact의 제출은 dependency-submission-publish.yml의 workflow_run 잡이 담당하며,
# write token을 가진 잡은 PR 코드를 checkout하거나 실행하지 않는다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-producer-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  generate-pr-snapshot:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate read-only PR dependency graph artifact
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        env:
          # The action does not assign scopes by default. Without this, CI's
          # fail-on-scopes: runtime filter would ignore the Gradle graph.
          # A constant correlator also pairs the PR snapshot with the trusted
          # main snapshot even though the least-privilege job IDs differ.
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: egov-gradle-dependency-graph
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: (compileClasspath|runtimeClasspath)
        with:
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1
          cache-disabled: true
          validate-wrappers: true

  # [2026-08-29] ref 가드를 명시했다. 위 주석은 "trusted ref만 contents:write" 라고 약속했지만
  # 가드는 이벤트 이름 하나뿐이었고, workflow_dispatch 는 임의 브랜치를 지정할 수 있다 —
  # 즉 임의 브랜치의 Gradle 빌드가 write 토큰으로 실행될 수 있었고, 계약은 그 약한 조건을
  # 그대로 동결하고 있었다. 문서가 약속한 경계를 코드가 집행하게 한다.
  # push 트리거는 이미 main 한정이고, 복구 경로인 `--ref main` dispatch 도 그대로 통과한다.
  submit-trusted-snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate and submit trusted dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        env:
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: egov-gradle-dependency-graph
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: (compileClasspath|runtimeClasspath)
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true
          validate-wrappers: true
