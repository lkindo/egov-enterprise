name: OWASP Dependency-Check (advisory)

# [2026-07-26 분리] 종전에는 ci.yml 의 backend-build 안에 있었고, NVD 데이터 다운로드가 잡 시간을
#   지배해 45분 timeout 의 주된 원인이었다. 병렬 잡으로 떼어냈지만 그마저 **매 푸시 2620초(43분)를
#   태우고 취소**됐다(실측) — advisory 스캔이 커밋 단위 러너 시간을 독식할 이유가 없다.
#   주간 스케줄 + 수동 실행으로 옮긴다. 커밋 단위 게이트는 ci.yml 이 담당한다.
#
# ⚠ 이 워크플로우는 **게이트가 아니다**. NVD 다운로드가 레이트리밋·네트워크에 좌우돼 결정론적이지
#   않기 때문이다. 게이트로 승격하려면 secrets.NVD_API_KEY 를 발급·주입해 다운로드를 안정화한 뒤
#   continue-on-error 를 제거해야 한다(GEMINI.md §0.7-H5 — 게이트인 척하는 스텝 금지).

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    # 스케줄/수동 외에는 돌지 않는다(워크플로우 정의 반영 지연에 대비한 이중 가드)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up JDK 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07  # v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70  # v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # [W0-09] NVD 데이터 캐시. data.directory(build.gradle) 를 캐싱하는 스텝이 없어
      #   매 실행 NVD 전량을 다시 받았고, 그것이 43분 소진의 구조적 원인이었다.
      #   API 키만 넣고 캐시를 넣지 않으면 개선폭이 제한된다.
      - name: Cache NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: build/dependency-check-cache
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: OWASP Dependency-Check
        run: ./gradlew dependencyCheckAnalyze
        env:
          # [W0-09] build.gradle 의 dependencyCheck.nvd.apiKey 가 이 값을 읽는다.
          #   플러그인은 환경변수를 스스로 읽지 않으므로, 시크릿 등록만으로는 아무 효과가 없었다.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      # [W0-09] 리포트가 실제로 생성됐는지 확인한다.
      #   종전에는 스캔이 exit 1 로 죽고 리포트가 0건이어도 이중 continue-on-error 때문에
      #   워크플로가 초록으로 끝나, "CVE 스캔이 돌고 있다"는 거짓 안전감을 만들었다.
      #   이 스텝은 continue-on-error 를 붙이지 않는다 — 스캔 자체는 아직 게이트가 아니지만,
      #   '리포트가 없다'는 사실만큼은 신호로 남아야 한다(GEMINI.md §0.7-H5).
      - name: Verify report was actually produced
        if: always()
        run: |
          set -euo pipefail
          COUNT=$(find . -path '*/build/reports/dependency-check-report.*' -type f | wc -l)
          echo "생성된 dependency-check 리포트 파일 수: $COUNT"
          find . -path '*/build/reports/dependency-check-report.*' -type f || true
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::dependency-check 리포트가 하나도 생성되지 않았습니다 — 스캔이 완주하지 못했습니다(NVD_API_KEY 미등록 또는 다운로드 실패 의심)."
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: owasp-security-report
          path: |
            **/build/reports/dependency-check-report.html
            **/build/reports/dependency-check-report.xml
          retention-days: 30
        continue-on-error: true
