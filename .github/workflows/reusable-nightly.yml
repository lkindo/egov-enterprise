name: Reusable nightly verification

# T2 야간 검증(설계서 12단계, DEC-OPS-283). 재사용 생성물의 일반 테스트(Gradle 시험 작업·vitest)를 돌린다.
# 산출물 검증(T1)은 생성 단계 안에서 PR CI 와 같은 진입점이 한다. required 가 아니고 병합을 막지 않는다.
# 지금은 수동 실행만 한다. 첫 녹색 수동 실행 뒤 다음 변경에서 예약 실행(정각 회피)을 켠다.
# 기능 브랜치의 무거운 직접 선택 검증도 이 워크플로를 쓴다: gh workflow run reusable-nightly.yml --ref <브랜치> -f compositions=board+survey
on:
  workflow_dispatch:
    inputs:
      compositions:
        description: "비우면 전체 계획. 'preset:<id>' 또는 '<기능>+<기능>' 토큰을 공백·쉼표로 나열한다."
        required: false
        default: ''
        type: string
      layout:
        description: 'auto = 시작 구성은 두 레이아웃, 단독 폐포는 날짜로 번갈아 한 레이아웃'
        required: false
        default: auto
        type: choice
        options: [auto, both, multi-module, single-module]
      contracts:
        description: '생성물 안에서 계약 생성물을 다시 만들어 대조한다(--check)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: reusable-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Plan compositions from the catalog
        id: plan
        env:
          NIGHTLY_COMPOSITIONS: ${{ inputs.compositions }}
          NIGHTLY_LAYOUT: ${{ inputs.layout }}
        run: node scripts/reusable-nightly.mjs plan --compositions "$NIGHTLY_COMPOSITIONS" --layout "$NIGHTLY_LAYOUT" --github-output "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.id }}, ${{ matrix.layout }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # 20개 runner 중 절반은 낮의 PR 몫으로 남긴다.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '9.15.0'
      # 저장소 Actions 캐시가 한도를 넘었다. 캐시는 읽기만 하고 단일 writer(ADR-0023)를 흔들지 않는다.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Generate, verify and test the composition
        env:
          NIGHTLY_ITEM: ${{ toJSON(matrix) }}
          NIGHTLY_CONTRACTS: ${{ inputs.contracts }}
        run: node scripts/reusable-nightly.mjs run --item "$NIGHTLY_ITEM" --contracts "$NIGHTLY_CONTRACTS"
      - name: Retain the composition report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reusable-nightly-report-${{ matrix.id }}-${{ matrix.layout }}
          path: build/reports/reusable-nightly/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw test reports of a failed composition
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reusable-nightly-raw-${{ matrix.id }}-${{ matrix.layout }}
          path: |
            build/reusable-base/source/*/build/test-results/**/*.xml
            build/reusable-base/source/*/*/build/test-results/**/*.xml
            build/reusable-base/source/*/build/reports/reusable-nightly/vitest.json
          if-no-files-found: ignore
          retention-days: 7

  summary:
    needs: [plan, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Download composition reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: build/reports/reusable-nightly
          pattern: reusable-nightly-report-*
      - name: Summarize every planned composition
        env:
          NIGHTLY_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          printf '%s' "$NIGHTLY_MATRIX" > "$RUNNER_TEMP/nightly-plan.json"
          node scripts/reusable-nightly.mjs summary --plan "$RUNNER_TEMP/nightly-plan.json" --reports build/reports/reusable-nightly
