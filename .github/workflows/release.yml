name: Docker Release

# [W0-11] 공급망 하드닝 (2026-08-01)
#   ① 모든 서드파티 액션을 커밋 SHA 로 핀했다. 이 워크플로는 contents:write 와 packages:write 를
#      쥔 채 실행되므로, 가변 major 태그(@v3 등)는 업스트림이 태그를 옮기는 것만으로 임의 코드가
#      릴리스·배포 권한과 함께 실행되는 경로가 된다.
#      SHA 핀은 자동 보안패치를 멈추므로 .github/dependabot.yml 의 github-actions 엔트리와 **세트**로만
#      의미가 있다. 둘 중 하나만 있으면 핀이 곧 방치가 된다.
#   ② 릴리스가 검증 없이 나가던 문제를 막기 위해 build-and-push 앞에 verify 잡을 둔다.
#      태그에서 무거운 CI 를 중복 실행하지 않고, 태그 대상 SHA 에 manifest가 선언한 main 필수 체크가 모두
#      success 로 존재하는지를 검증한다. 검증 이력이 없는 SHA, main 밖의 SHA, red SHA 는 릴리스할 수 없다.

on:
  push:
    tags:
      - 'v*'

permissions:
  # [2026-09-16 DEC-OPS-103] 이미지를 GHCR 로 발행한다. W0-11 이 packages:write 를 뺀 이유(GHCR 미사용)가
  #   더는 성립하지 않는다 — Docker Hub 자격이 저장소에 없어 build-and-push 가 항상 실패했고, 릴리스 생성
  #   단계가 같은 잡의 뒤쪽에 있어 **GitHub 릴리스도 한 번도 발행되지 않았다**(v0.1.0 은 워크플로 밖에서 만들었다).
  #   GHCR 은 GITHUB_TOKEN 으로 push 하므로 새 시크릿과 그 회전 부담이 생기지 않는다.
  contents: write   # softprops/action-gh-release 가 릴리스를 생성한다
  checks: read      # 태그 대상 SHA 의 required check 결론 검증
  packages: write   # GHCR 에 backend/frontend 이미지를 push 한다

jobs:
  # [W0-11] 릴리스 전제 조건. 실패하면 배포도 릴리스도 발행되지 않는다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tagged commit on main with complete CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --no-tags
          REQUIRED_BRANCH="$(jq -er '.branch | select(type == "string" and length > 0)' \
            .github/required-checks.json)"
          if [ "$REQUIRED_BRANCH" != "main" ]; then
            echo "::error::릴리스 기준 브랜치와 required check SSOT가 다릅니다: $REQUIRED_BRANCH"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 대상 $GITHUB_SHA 는 origin/main 이력에 포함되지 않습니다."
            exit 1
          fi

          REQUIRED_CHECKS_JSON="$(jq -er '
            .requiredChecks
            | if type != "array" or length == 0 then error("requiredChecks is empty")
              elif any(.[]; ((.context | type) != "string") or ((.context | length) == 0))
                then error("requiredChecks contains an invalid context")
              else map(.context)
              end
          ' .github/required-checks.json)"
          mapfile -t REQUIRED_CHECKS < <(jq -r '.[]' <<< "$REQUIRED_CHECKS_JSON")
          REQUIRED_INTEGRATION_ID="$(jq -er '.integrationId | select(type == "number" and . > 0)' \
            .github/required-checks.json)"
          CHECK_RUNS="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100&filter=latest" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // ""), (.app.id | tostring)] | @tsv')"

          for check_name in "${REQUIRED_CHECKS[@]}"; do
            if ! awk -F '\t' -v name="$check_name" -v app="$REQUIRED_INTEGRATION_ID" \
              '$1 == name && $2 == "completed" && $3 == "success" && $4 == app { found = 1 } END { exit !found }' \
              <<< "$CHECK_RUNS"; then
              echo "::error::태그 대상 SHA 에 지정 provider의 성공한 필수 체크가 없습니다: $check_name"
              exit 1
            fi
          done

          echo "태그 대상 SHA 의 main 포함 여부와 필수 CI ${#REQUIRED_CHECKS[@]}종을 확인했습니다."

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Compilation integrity gate (AGENTS.md Verification)
        run: ./gradlew compileJava compileTestJava

      - name: Harness gate (헌법/표준 린터)
        run: ./gradlew :api-server:harnessTest

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend type gate
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend exec tsc --noEmit

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # 소유자 이름을 소문자로 정규화한다. GHCR 은 대문자가 섞인 경로를 거부하므로, 대문자 조직으로
      #   이 템플릿을 가져간 파생 제품에서 push 가 죽는다.
      - name: Resolve GHCR namespace
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test -n "$OWNER" || {
            echo "::error::repository_owner 가 비어 있어 이미지 이름을 만들 수 없습니다."
            exit 1
          }
          printf 'namespace=%s\n' "$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ steps.registry.outputs.namespace }}/egov-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: api-server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ steps.registry.outputs.namespace }}/egov-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_API_URL=${{ vars.BACKEND_API_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      # 트리거가 tags/v* 단독이라 종전의 `if: startsWith(github.ref, 'refs/tags/')` 도 항상 참이었다.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
