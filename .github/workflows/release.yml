name: Docker Release

# [W0-11] 공급망 하드닝 (2026-08-01)
#   ① 모든 서드파티 액션을 커밋 SHA 로 핀했다. 이 워크플로는 contents:write 와 DOCKERHUB_TOKEN 을
#      쥔 채 실행되므로, 가변 major 태그(@v3 등)는 업스트림이 태그를 옮기는 것만으로 임의 코드가
#      릴리스·배포 권한과 함께 실행되는 경로가 된다.
#      SHA 핀은 자동 보안패치를 멈추므로 .github/dependabot.yml 의 github-actions 엔트리와 **세트**로만
#      의미가 있다. 둘 중 하나만 있으면 핀이 곧 방치가 된다.
#   ② 릴리스가 검증 없이 나가던 문제를 막기 위해 build-and-push 앞에 verify 잡을 둔다.
#      태그에서 무거운 CI 를 중복 실행하지 않고, 태그 대상 SHA 에 manifest가 선언한 main 필수 체크가 모두
#      success 로 존재하는지를 검증한다. 검증 이력이 없는 SHA, main 밖의 SHA, red SHA 는 릴리스할 수 없다.

on:
  push:
    tags:
      - 'v*'

permissions:
  # [W0-11] packages:write 제거 — 이미지는 Docker Hub 로 push 되고 GHCR 을 쓰지 않아 사용처가 0이었다.
  contents: write   # softprops/action-gh-release 가 릴리스를 생성한다
  checks: read      # 태그 대상 SHA 의 required check 결론 검증

jobs:
  # [W0-11] 릴리스 전제 조건. 실패하면 배포도 릴리스도 발행되지 않는다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tagged commit on main with complete CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --no-tags
          REQUIRED_BRANCH="$(jq -er '.branch | select(type == "string" and length > 0)' \
            .github/required-checks.json)"
          if [ "$REQUIRED_BRANCH" != "main" ]; then
            echo "::error::릴리스 기준 브랜치와 required check SSOT가 다릅니다: $REQUIRED_BRANCH"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 대상 $GITHUB_SHA 는 origin/main 이력에 포함되지 않습니다."
            exit 1
          fi

          REQUIRED_CHECKS_JSON="$(jq -er '
            .requiredChecks
            | if type != "array" or length == 0 then error("requiredChecks is empty")
              elif any(.[]; ((.context | type) != "string") or ((.context | length) == 0))
                then error("requiredChecks contains an invalid context")
              else map(.context)
              end
          ' .github/required-checks.json)"
          mapfile -t REQUIRED_CHECKS < <(jq -r '.[]' <<< "$REQUIRED_CHECKS_JSON")
          REQUIRED_INTEGRATION_ID="$(jq -er '.integrationId | select(type == "number" and . > 0)' \
            .github/required-checks.json)"
          CHECK_RUNS="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100&filter=latest" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // ""), (.app.id | tostring)] | @tsv')"

          for check_name in "${REQUIRED_CHECKS[@]}"; do
            if ! awk -F '\t' -v name="$check_name" -v app="$REQUIRED_INTEGRATION_ID" \
              '$1 == name && $2 == "completed" && $3 == "success" && $4 == app { found = 1 } END { exit !found }' \
              <<< "$CHECK_RUNS"; then
              echo "::error::태그 대상 SHA 에 지정 provider의 성공한 필수 체크가 없습니다: $check_name"
              exit 1
            fi
          done

          echo "태그 대상 SHA 의 main 포함 여부와 필수 CI ${#REQUIRED_CHECKS[@]}종을 확인했습니다."

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70  # v3

      - name: Compilation integrity gate (AGENTS.md Verification)
        run: ./gradlew compileJava compileTestJava

      - name: Harness gate (헌법/표준 린터)
        run: ./gradlew :api-server:harnessTest

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend type gate
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend exec tsc --noEmit

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Require Docker Hub release credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME 이 없어 배포 산출물을 발행할 수 없습니다."
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN 이 없어 배포 산출물을 발행할 수 없습니다."
            exit 1
          }

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/egov-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: api-server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/egov-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_API_URL=${{ vars.BACKEND_API_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      # 트리거가 tags/v* 단독이라 종전의 `if: startsWith(github.ref, 'refs/tags/')` 도 항상 참이었다.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
