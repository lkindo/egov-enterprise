# [W0-10] 의존성 자동 업데이트 압력.
#
# [존재 이유] 이 저장소는 CVE 가시성이 사실상 0이었다 — dependency-check 는 주간 스케줄이고
#   리포트가 0건이었으며, Spring Boot 는 3.4.1 에 고정, Node 는 EOL 라인이다.
#   Dependabot 은 그 공백을 커밋 단위가 아니라 '시간' 축에서 메운다.
#
# [전제] security-update(취약점 기반 긴급 PR)는 저장소의 Dependabot alerts 가 켜져 있어야 발생한다.
#   version-update 만으로는 CVE 대응이 되지 않는다.
#
# [주의] directories 는 실측 경로다 — Dependabot 은 Gradle 서브프로젝트를 자동 재귀하지 않는다.
#   open-pull-requests-limit 을 낮게 유지한다. 첫 주에 PR 이 폭증하면 아무도 보지 않는 노이즈가 된다.

version: 2
updates:
  # ── GitHub Actions ──
  #   전 워크플로 uses: 참조가 가변 major 태그다(SHA 핀 0건). 태그가 이동하면 릴리스 권한을 쥔 채
  #   임의 코드가 실행된다. release.yml 의 SHA 핀과 세트로 동작해야 핀이 방치로 굳지 않는다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # [2026-08-03] 그룹핑이 gradle 에만 있어 나머지 생태계가 패키지당 1 PR 을 냈다 —
      #   실측 22건 중 20건이 단건이었고, 이 파일 머리주석(11행)이 경계한 '아무도 보지 않는
      #   노이즈' 가 그대로 실현됐다. minor/patch 를 한 덩어리로 접고 major 만 개별로 남긴다
      #   (major 는 파괴적 변경이라 개별 판정이 필요하다).
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── Docker ── 베이스 이미지가 다이제스트로 핀돼 있어(2026-08-02) 자동 갱신이 멈춘 상태다.
  #   SHA/다이제스트 핀은 Dependabot 과 세트로만 의미가 있다 — 둘 중 하나만 있으면 핀이 곧 방치다.
  - package-ecosystem: "docker"
    directories:
      - "/api-server"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # [2026-08-03] 그룹핑이 gradle 에만 있어 나머지 생태계가 패키지당 1 PR 을 냈다 —
      #   실측 22건 중 20건이 단건이었고, 이 파일 머리주석(11행)이 경계한 '아무도 보지 않는
      #   노이즈' 가 그대로 실현됐다. minor/patch 를 한 덩어리로 접고 major 만 개별로 남긴다
      #   (major 는 파괴적 변경이라 개별 판정이 필요하다).
      minor-and-patch:
        update-types: ["minor", "patch"]
    # [2026-09-30] 런타임 메이저(JDK·Node)는 버전 번호가 아니라 결정이다 — 지원 주기(LTS)·ADR-0024 류의
    #   전환 검증이 먼저다. #808(Temurin 21→23, 비 LTS·지원 종료)과 #809(Node 22→26)가 CI 를 통과했지만
    #   CI e2e 는 프런트를 로컬 Node 로 돌려 Node 26 런타임을 검증하지 않는다. 메이저는 받지 않고, 같은 라인의
    #   digest·패치 갱신은 계속 받는다. 런타임을 올릴 때는 이 항목을 ADR 과 함께 바꾼다.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ── Gradle ── 루트 build.gradle + gradle/libs.versions.toml + 5개 서브모듈
  #   ⚠ version-update 는 이 설정으로 돌지만, **security-update(취약점 기반 PR)는 의존성 그래프에
  #     maven 항목이 있어야 발생한다**. 그 그래프는 .github/workflows/dependency-submission.yml 이
  #     채운다 — 그 워크플로가 죽으면 백엔드 CVE 가시성이 조용히 0으로 돌아간다.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/api-server"
      - "/business-app"
      - "/business-core"
      - "/foundation"
      - "/migration-tool"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # [2026-10-07] Gradle wrapper 9.8.0 이상은 제안하지 않는다(DEC-OPS-237). PIT 플러그인
      #   info.solidsoft.pitest 1.19.0(배포된 최신판)이 9.8.0 에서 deprecated 된 Configuration.setVisible 을
      #   호출해 CI 의 --warning-mode fail 이 모든 Gradle 잡을 막는다(build.gradle:129). 아래 gradle-wrapper
      #   그룹으로 떼어 두었는데도 wrapper 가 catch-all 묶음에 다시 섞여(#802·#829·#849) 라이브러리 패치를
      #   붙잡았고, 적용할 수 없는 PR 이 매주 붉은 채 남았다.
      #   재개 조건: PIT 플러그인 수정판(szpak/gradle-pitest-plugin PR #398) 배포. 그 판이 other-minor-and-patch
      #   묶음으로 올라오면 적용한 뒤 이 규칙을 같은 변경에서 걷는다. 게이트(--warning-mode fail)는 끄지 않는다.
      # ⚠ 트레이드오프: ignore 는 security update 에도 적용된다. 그동안 wrapper 보안 권고는 Dependabot 이
      #   PR 로 알려 주지 않으므로 Gradle 보안 공지를 따로 확인한다.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.8.0"]
    groups:
      # 카탈로그 한 줄이 다중 모듈을 동시에 깨뜨릴 수 있으므로, 관련 업데이트를 묶어
      # CI 가 한 번에 판정하게 한다.
      spring:
        patterns:
          - "org.springframework*"
      test-tooling:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.testcontainers*"
      # [2026-09-30] Gradle wrapper 는 라이브러리와 따로 올린다. 9.8.0 에서 PIT 플러그인 1.19.0 이
      #   deprecated Configuration.setVisible 을 호출해 CI 의 --warning-mode fail 이 모든 Gradle 잡을 막았고,
      #   그 wrapper 가 같은 묶음의 라이브러리 패치까지 붙잡았다(#802). 이 그룹은 catch-all 보다 앞에 두었지만
      #   wrapper 가 다시 catch-all 에 섞여(#829·#849) 분리가 동작하지 않았다. 2026-10-07 부터 9.8.0 이상은 위
      #   ignore 로 제안하지 않으며, ignore 를 걷은 뒤 이 그룹이 실제로 분리하는지 다시 확인한다.
      gradle-wrapper:
        patterns:
          - "gradle-wrapper"
      # [2026-08-03] 위 그룹들에 걸리지 않는 나머지 minor/patch 도 접는다.
      #   그룹 정의가 있어도 패턴 밖 패키지는 단건 PR 이 되므로, catch-all 이 없으면
      #   '그룹핑했다' 는 서술과 실제 PR 수가 어긋난다(실측: gradle 단건 PR 다수).
      other-minor-and-patch:
        update-types: ["minor", "patch"]

  # ── npm (frontend) ── pnpm-lock.yaml (npm 생태계가 pnpm 락을 처리)
  #   ci.yml 의 `pnpm install --frozen-lockfile` 이 락 정합을 즉시 판정하므로,
  #   첫 몇 건은 락 갱신이 어긋나지 않는지 직접 확인할 것.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # [2026-09-13] zod 4.5 이상은 제안하지 않는다. zod 4.6.2 가 core 에 JIT 컴파일러 등을 더해
      #   단일 JS 청크 번들 예산(150,000B)을 넘겼고(152,335B), 그래서 package.json 이 `~4.4.3` 으로
      #   고정돼 있다(경위: frontend/scripts/check-bundle-budget.mjs 머리주석, PR #634).
      #   이 규칙이 없으면 minor 그룹 PR 이 매주 zod 를 다시 싣고, 같은 예산 게이트에서 그룹 전체가 막힌다.
      #   4.4.x 패치는 범위 밖이라 계속 제안된다.
      # ⚠ 트레이드오프: GitHub 옵션 문서상 ignore 는 security update 에도 적용된다. 4.5 이상에서만
      #   고쳐지는 zod 취약점이 나오면 Dependabot 이 PR 을 열지 않는다. 그 경우는 CI 의 frontend
      #   audit 정책(High 이상 차단)이 모든 PR 을 막아 드러나며, 그때 예산 재산정 또는 zod 소비 방식
      #   변경(zod/mini 등)을 함께 결정한다. 고정을 풀면 이 규칙도 같은 변경에서 걷는다.
      - dependency-name: "zod"
        versions: [">=4.5.0"]
    groups:
      # [2026-08-03] 그룹핑이 gradle 에만 있어 나머지 생태계가 패키지당 1 PR 을 냈다 —
      #   실측 22건 중 20건이 단건이었고, 이 파일 머리주석(11행)이 경계한 '아무도 보지 않는
      #   노이즈' 가 그대로 실현됐다. minor/patch 를 한 덩어리로 접고 major 만 개별로 남긴다
      #   (major 는 파괴적 변경이라 개별 판정이 필요하다).
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── npm (루트) ── package-lock.json (deps 는 cross-env, pg 2개뿐이라 한도를 낮게 둔다)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # [2026-08-03] 그룹핑이 gradle 에만 있어 나머지 생태계가 패키지당 1 PR 을 냈다 —
      #   실측 22건 중 20건이 단건이었고, 이 파일 머리주석(11행)이 경계한 '아무도 보지 않는
      #   노이즈' 가 그대로 실현됐다. minor/patch 를 한 덩어리로 접고 major 만 개별로 남긴다
      #   (major 는 파괴적 변경이라 개별 판정이 필요하다).
      minor-and-patch:
        update-types: ["minor", "patch"]
