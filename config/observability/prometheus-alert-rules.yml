# eGov Enterprise — Prometheus 경보 규칙 예시
#
# 적재: Prometheus 설정의 rule_files 에 이 파일을 넣고, api 서비스 관리 포트(9090)의 /actuator/prometheus 를
#   스크레이프한다. 관리 포트는 컨테이너 네트워크 안에서만 연다(docker-compose.prod.yml [W1-12]).
#   절차와 한계는 docs/04-operations/observability-baseline.md 가 정본이다.
#
# ⚠ 임계값과 지속 시간은 **시작점**이다. 운영 트래픽을 1~2주 관측한 뒤 조정한다 — 이 저장소는 운영 부하 분포를
#   갖고 있지 않다(GAP-OPS-001). 수신처(Alertmanager 라우팅)는 인수처가 정한다(PD-OPS-001).
#
# ⚠ 규칙이 참조하는 메트릭 이름·태그는 scripts/observability-alert-rules-contract.test.mjs 가 코드·테스트와
#   대조한다. 코드에서 이름이 바뀌면 경보는 오류 없이 영원히 조용해지므로, 그 대조가 red 로 알린다.
groups:
  - name: egov-api-security
    rules:
      # 요청 제한 필터는 HTTP 관측보다 먼저 응답을 끝내므로 429 는 http_server_requests 에 잡히지 않는다.
      #   원천은 RateLimitFilter 의 전용 카운터다. bucket 은 login(로그인 전용 한도)·all(전체 한도)이다.
      #   오래 이어지면 공격이거나 한도가 실제 사용량보다 낮다 — 한도를 낮춘 직후라면 후자를 먼저 의심한다
      #   (application.yml 의 nuri.security.rate-limit 순서 주석).
      - alert: EgovRateLimitRejectionsSustained
        expr: sum by (application, bucket) (rate(security_ratelimit_rejected_total[5m])) * 60 > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "요청 제한(429) 거절이 10분째 분당 30건을 넘습니다 (bucket={{ $labels.bucket }})"
          description: "api 로그의 [RATE-LIMIT] 줄에서 ip·uri 를 확인해 공격인지 한도 부족인지 판정합니다."

      # 로그인 실패(401)는 표준 요청 메트릭의 uri·status 태그로 본다. 계정 잠금·잘못된 비밀번호가 여기에 들어간다.
      #   특정 계정이 아니라 전체 비율이 오르면 비밀번호 대입(credential stuffing)을 의심한다.
      - alert: EgovLoginFailureSpike
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri="/api/v1/auth/login", status="401"}[5m])) * 60 > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "로그인 실패(401)가 5분째 분당 20건을 넘습니다"
          description: "요청 제한 로그인 버킷 거절(EgovRateLimitRejectionsSustained, bucket=login)과 함께 오르는지 확인합니다."

      # 항상 등록되는 gauges다. 최초 활성화/PASS anchor는 health.json에 지속되어 재기동이 유예를 초기화하지 않는다.
      # 비활성 상태의 healthy_age와 last_run_unhealthy는 0이다. DRIFT/FAILED는 별도 즉시 상태 경보가 본다.
      - alert: EgovAttachmentIntegrityNoHealthyRun
        expr: max by (application) (nuri_attachment_integrity_healthy_age_seconds{}) > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "첨부 무결성 점검이 26시간째 정상 완료를 기록하지 못했습니다"
          description: "미실행도 포함합니다. health.json의 최초 활성화/PASS 시각과 latest.json의 결과를 확인합니다."

      - alert: EgovAttachmentIntegrityDisabled
        expr: min by (application) (nuri_attachment_integrity_enabled{}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "첨부 무결성 정기 점검이 비활성 상태입니다"
          description: "ATTACHMENT_INTEGRITY_ENABLED 설정과 기관의 점검 정책을 확인합니다."

      - alert: EgovAttachmentIntegrityUnhealthy
        expr: max by (application) (nuri_attachment_integrity_last_run_unhealthy{}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "최근 첨부 무결성 점검이 정상 완료되지 않았습니다"
          description: "latest.json의 DRIFT·INCOMPLETE·FAILED·REPORT_FAILED와 저장소 상태를 확인합니다."

      - alert: EgovAttachmentIntegrityObservationFailed
        expr: min by (application) (nuri_attachment_integrity_observation_healthy{} + 1 - nuri_attachment_integrity_enabled{}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "첨부 무결성 점검 상태를 지속적으로 기록하거나 복원할 수 없습니다"
          description: "진단 디렉터리의 읽기·쓰기 권한, 링크, health.json 형식과 디스크 상태를 확인합니다."

      # 전이 카운터 대신 committed DB 상태를 본다. 공유 DB의 복제본 scrape를 더하지 않고 max로 집계한다.
      # 상태 라벨은 PENDING/RUNNING/RETRY/SUCCEEDED/FAILED 다섯 개이며 업무 유형·작업 식별자는 태그가 아니다.
      - alert: EgovDurableWorkFailed
        expr: max by (application) (nuri_durable_work_jobs{status="FAILED"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FAILED 상태의 내구 작업이 남아 있습니다"
          description: "durable-jobs 조회로 대상 작업을 찾고, 저장소·전달 채널 원인을 고친 뒤 DWORK_RETRY 로 재처리합니다."

      - alert: EgovDurableWorkDueBacklog
        expr: max by (application, status) (nuri_durable_work_oldest_due_age_seconds{status="PENDING"} or nuri_durable_work_oldest_due_age_seconds{status="RETRY"} or nuri_durable_work_oldest_due_age_seconds{status="RUNNING"}) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "처리 시각이 지난 내구 작업이 15분 이상 대기합니다 (status={{ $labels.status }})"
          description: "PENDING·RETRY의 예약 시각 또는 RUNNING의 lease 만료 시각을 기준으로 실행기와 전달 채널을 확인합니다."

      - alert: EgovDurableWorkObservationFailed
        expr: min by (application) (nuri_durable_work_observation_healthy{}) == 0 or max by (application) (nuri_durable_work_observation_age_seconds{}) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "내구 작업 상태 조회가 실패하거나 오래 갱신되지 않았습니다"
          description: "DB 연결과 읽기 권한, 집계 쿼리 제한 시간, 메트릭 갱신 실행 경로를 확인합니다. 마지막 정상 집계는 유지됩니다."
