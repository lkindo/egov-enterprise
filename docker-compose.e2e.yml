version: "3.8"

# ====================================================
# EGOV Enterprise E2E Test Environment
# 실제 Supabase DB 스냅샷을 로컬 PostgreSQL에 복원하여
# 실제 데이터와 동일한 환경에서 E2E 테스트를 수행합니다.
# ====================================================

services:
  # ── 1. 로컬 PostgreSQL (Supabase 스냅샷 복원) ──────────────────
  db-e2e:
    image: postgres:17
    container_name: egov-e2e-postgres
    restart: "no"
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: egovdb
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: egov123
    volumes:
      - ./dump/supabase_e2e_full.sql:/docker-entrypoint-initdb.d/01_full_dump.sql:ro
      - ./dump/init_users.sql:/docker-entrypoint-initdb.d/02_init_users.sql:ro
      - ./dump/03_seed_extra.sql:/docker-entrypoint-initdb.d/03_seed_extra.sql:ro
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egov -d egovdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - e2e-net

  # ── 2. Spring Boot API 서버 (로컬 E2E DB 사용) ─────────────────
  api-e2e:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: egov-e2e-api
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      SPRING_APPLICATION_JSON: >
        {
          "spring": {
            "profiles": { "active": "e2e" },
            "datasource": {
              "url": "jdbc:postgresql://db-e2e:5432/egovdb?currentSchema=public&prepareThreshold=0",
              "jdbc-url": "jdbc:postgresql://db-e2e:5432/egovdb?currentSchema=public&prepareThreshold=0",
              "username": "egov",
              "password": "egov123",
              "driver-class-name": "org.postgresql.Driver",
              "hikari": {
                "jdbc-url": "jdbc:postgresql://db-e2e:5432/egovdb?currentSchema=public&prepareThreshold=0",
                "maximum-pool-size": 10
              }
            },
            "jpa": {
              "hibernate": { "ddl-auto": "none" },
              "show-sql": false
            }
          },
          "management": {
            "health": { "mail": { "enabled": false } }
          },
          "jwt": {
            "secret": "dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg=="
          }
        }
      JWT_SECRET: "dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg=="
    depends_on:
      db-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 60s
    networks:
      - e2e-net

  # ── 3. Next.js Frontend ─────────────────────────────────────────
  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://api-e2e:8080/api/v1
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: egov-e2e-frontend
    restart: "no"
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      BACKEND_API_URL: http://api-e2e:8080/api/v1
    depends_on:
      api-e2e:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - e2e-net

volumes:
  e2e_postgres_data:

networks:
  e2e-net:
    driver: bridge
