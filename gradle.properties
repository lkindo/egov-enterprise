# JVM 메모리 설정 (일반 개발 머신 ~16GB RAM 기준 — 과다 구독으로 인한 네이티브 OOM 방지)
org.gradle.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 빌드 성능 최적화 (동시 테스트 포크 제한: 포크 힙 × workers ≤ 실 RAM 유지)
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true
