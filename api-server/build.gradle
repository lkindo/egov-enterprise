plugins {
    id 'org.springframework.boot'
    id 'war'
}

dependencies {
    implementation project(':common-service')
    implementation project(':common-core')
    implementation project(':common-security')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.springdoc.openapi
    
    // JSP Support - Required for legacy eGovFrame components
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'
    
    // MyBATIS Support - Migration to JPA in progress (Phase A modules completed)
    implementation libs.mybatis.starter
    
    // Legacy Dependencies
    implementation libs.icu4j // ChineseCalendar 등
    implementation libs.commons.io
    implementation libs.guava
    implementation libs.commons.lang3
    implementation 'jakarta.json:jakarta.json-api:2.1.3'
    implementation libs.parsson // JSON-P implementation
    implementation libs.postgresql

    // Missing Enterprise Dependencies
    implementation libs.commons.email
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.batch:spring-batch-infrastructure'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // implementation 'org.springframework.boot:spring-boot-starter-data-ldap'
    
    // eGovFrame Batch
    implementation libs.egovframe.rte.bat.core
    implementation libs.egovframe.rte.fdl.access
    implementation libs.egovframe.rte.fdl.crypto
    implementation libs.egovframe.rte.fdl.idgnr
    implementation libs.egovframe.rte.fdl.cmmn
    implementation libs.egovframe.rte.fdl.excel
    implementation libs.egovframe.rte.fdl.security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    
    // JSON Simple (Legacy Support) - Removed
    // implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    
    // Apache Commons Net (FTP)
    implementation libs.commons.net
    
    // XML Processing (Legacy)
    implementation libs.xmlbeans
    implementation libs.jdom2
    
    // Database Connection Pool (Legacy)
    implementation libs.commons.dbcp2
    
    // File Upload (Legacy) - Removed
    // implementation 'commons-fileupload:commons-fileupload:1.5'

    // Social Login (ScribeJava)
    implementation libs.scribejava.apis
    implementation libs.scribejava.core

    // Twitter API V2 Support - Removed due to module decommissioning
    // implementation 'org.twitter4j:twitter4j-core:4.1.2'
    // implementation 'io.github.takke:twitter4j-v2:1.4.4'

    // Lombok - io.freefair.lombok 8.10 플러그인이 자동으로 처리함
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation libs.archunit.junit5
    
    // Performance Optimization
    implementation 'org.springframework.boot:spring-boot-starter-websocket' // WebSocket Support
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
