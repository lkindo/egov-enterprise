spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  web:
    resources:
      add-mappings: false
      static-locations:
        - "classpath:/static/"
        - "classpath:/public/"
        - "classpath:/resources/"
        - "classpath:/META-INF/resources/"
  resources:
    add-mappings: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    hibernate:
      # [2026-09-06] create-drop → create. 이 프로파일의 H2 는 JVM 전체가 공유하는 단일 in-memory DB(DB_CLOSE_DELAY=-1)이고
      #   테스트 컨텍스트 캐시는 8개 상한이라, 캐시에서 축출된 JPA 컨텍스트가 닫히며 **공유 DB 의 테이블을 drop** 했다.
      #   그 뒤 아직 캐시에 살아 있는 다른 컨텍스트(BaseSecurityTest 하위 3클래스가 공유)가 그 테이블을 읽으면 42S02 다
      #   (CI run 33975652970: PrivilegeEscalationVulnerabilityTest 2건, 단독 실행은 green — 순서 의존). 새 @WebMvcTest 클래스
      #   하나가 축출 순서를 밀면 재발하는 구조라 상한을 올리는 대신 종료 시 drop 자체를 없앤다. create 는 컨텍스트 생성 시
      #   drop+create 만 하므로 스키마는 JVM 이 끝날 때까지 남고, 데이터 격리는 종전과 같이 각 테스트의 setUp 책임이다.
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  flyway:
    enabled: false
  # 순환 참조 허용 (테스트 환경)
  main:
    allow-circular-references: false
    allow-bean-definition-overriding: true
  test:
    context:
      cache:
        maxSize: 8
  # [2026-08-07] spring.ai 설정 제거 - spring-ai 의존성 자체를 걷어냈다.
  #   없는 오토컨피그를 exclude 하거나 없는 기능을 enabled:false 로 두면 팬텀 참조가 된다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 파일 업로드 경로 (테스트용)
file:
  upload-dir: ./test-uploads
  upload:
    path: ./test-uploads

# JWT 테스트 설정
jwt:
  secret: test-secret-key-for-unit-testing-purposes-only-12345678901234567890
  expiration: 3600000

cors:
  allowed-origins: "http://localhost:3000"

# 로깅 설정
logging:
  level:
    root: INFO
    org.springframework.beans.factory: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.model.mapping: DEBUG
    nuri: DEBUG
    org.springframework.boot.autoconfigure: DEBUG

# RBAC DB 인가 모드 (테스트 프로필 디폴트는 false로 두어 기존 테스트 보호, 신규 격리 테스트만 활성화)
rbac:
  shadow:
    enabled: true
  db-auth:
    enabled: false
    secure-paths: "/api/v1/admin/**,/actuator/**,/api/v1/help,/api/v1/help/**"


