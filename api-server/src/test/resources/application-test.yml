spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  web:
    resources:
      add-mappings: false
      static-locations:
        - "classpath:/static/"
        - "classpath:/public/"
        - "classpath:/resources/"
        - "classpath:/META-INF/resources/"
  resources:
    add-mappings: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration, org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration, org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  flyway:
    enabled: false
  # 순환 참조 허용 (테스트 환경)
  main:
    allow-circular-references: false
    allow-bean-definition-overriding: true
  test:
    context:
      cache:
        maxSize: 8
  ai:
    openai:
      chat:
        enabled: false
      embedding:
        enabled: false
    ollama:
      chat:
        enabled: false
      embedding:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 파일 업로드 경로 (테스트용)
file:
  upload-dir: ./test-uploads
  upload:
    path: ./test-uploads

# JWT 테스트 설정
jwt:
  secret: test-secret-key-for-unit-testing-purposes-only-12345678901234567890
  expiration: 3600000

cors:
  allowed-origins: "http://localhost:3000"

# 로깅 설정
logging:
  level:
    root: INFO
    org.springframework.beans.factory: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.model.mapping: DEBUG
    nuri: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.ai: DEBUG

# RBAC DB 인가 모드 (테스트 프로필 디폴트는 false로 두어 기존 테스트 보호, 신규 격리 테스트만 활성화)
rbac:
  shadow:
    enabled: true
  db-auth:
    enabled: false
    secure-paths: "/api/v1/admin/**,/actuator/**,/api/v1/surveys,/api/v1/surveys/**,/api/v1/leader-schedules,/api/v1/leader-schedules/**,/api/v1/main-images,/api/v1/main-images/**,/api/v1/help,/api/v1/help/**,/api/v1/faqs,/api/v1/faqs/**,/api/v1/calendar/holidays,/api/v1/calendar/holidays/**"


