# 🧊 하네스 게이트 동결 매니페스트 — HarnessBaselineIntegrityTest 의 대조 기준(SSOT)
#
# [무엇인가] 게이트 성격의 테스트(4개 모듈: harness 디렉터리 + *LinterTest/*ArchTest/*MatrixTest/
#   *GuardrailIntegrationTest/*ValidationIntegrationTest)가 판정에 쓰는 static final 상수(동결 목록·
#   예외/화이트리스트·스캔 경로·
#   탐지 정규식)를 "<문자열리터럴 수>:<정규화 소스의 sha256 앞 12자리>" 로 고정한 것.
#   키는 <모듈>/<클래스>.<상수> 이며, __harness.classes 는 게이트 클래스 자체의 삭제·개명을 잡는다.
#
# [왜 있는가] 2026-07-26 Phase 2 감사에서 같은 은폐 패턴이 두 번 관측됐다 —
#   ① 동결 베이스라인(GRANDFATHERED)을 비워 PK 전략 일괄 변경을 통과시킴
#   ② 예외 목록(EXCLUDED_PATHS)을 신설해 진짜 계약 드리프트 신호를 소거함.
#   두 경우 모두 게이트는 그린이었다. 이 매니페스트는 그런 편집을 '불가능'하게 만들지 않는다.
#   목적은 은폐를 불가능하게가 아니라 **조용할 수 없게** 만드는 것이다 — 목록을 손대면
#   서로 다른 디렉터리의 두 파일이 함께 바뀌고, diff 에 의도가 드러난다.
#
# [갱신 방법] 변경이 정당할 때만:
#   1) 사유를 커밋 메시지 또는 .gemini/tasks/ 기록에 남긴다(무엇을·왜 완화/확장했는지).
#   2) ./gradlew :api-server:harnessTest
#   3) build/harness/baseline-manifest.actual.properties 를 이 파일로 복사한다.
# 갱신 전에 자문할 것: 지금 고치는 것이 '위반' 인가, '빨간 신호' 인가? (GEMINI.md §0.7-H2)
# [2026-08-01 Wave 0] 신규 게이트 6종 편입 + SchemaNamingLinterTest.CONSTRAINT_NAME 파서 버그 수정.
#   · 신설 6종: SignupContract / SeedLocation / ConfigSafety / SecretLiteral / HandlerReachesService / DockerfilePackageManager
#     — 12축 감사 Wave 0 에서 고친 결함(공개 signup 권한 상승·운영 시드 자격증명·배포 형상 개발기본값·
#       시크릿 리터럴·저장경로 없는 200 응답·배포 이미지 패키지 매니저 불일치)의 재발 방지 게이트.
#   · CONSTRAINT_NAME 변경 사유: DROP CONSTRAINT IF EXISTS <name> 에서 'if' 를 제약명으로 오인식하던
#     파서 버그를 고쳤다(V2_33 에서 거짓 위반 3건 실측). 탐지 범위 축소가 아니라 오탐 제거이며,
#     CREATE_TABLE/SEQUENCE/INDEX 가 이미 IF NOT EXISTS 를 흡수하는 것과 동일한 보완이다.

# [2026-08-03 복원] 이 헤더는 0f52e7e06 에서 build/harness/baseline-manifest.actual.properties 를
#   **통째로 복사**하는 과정에 자동생성 2줄로 덮여 사라졌다(항목 131건은 그대로였고 손실된 것은
#   문서였다). 그런데 이 헤더가 곧 §0.7-H2 가드레일 자체다 — 다음 사람이 목록을 손대기 전에
#   읽어야 할 "위반인가, 빨간 신호인가" 자문이 여기에만 적혀 있다. actual 파일을 복사할 때는
#   **데이터 라인만** 가져오고 이 주석 블록은 보존한다.

# [2026-08-03 Wave 1 보완] ConfigSafetyLinterTest 상수 3종 **신설**(축소·완화 아님).
#   KEY_MANAGEMENT_PORT / COMPOSE_HEALTHCHECK_ACTUATOR / COMPOSE_HOST_PORT_MAPPING —
#   관리 포트 분리(W1-12) 형상의 두 전제를 기계로 고정한다:
#     ① compose 헬스체크가 관리 포트를 찌르는가(어긋나면 운영 컨테이너가 영구 unhealthy → frontend 미기동)
#     ② 관리 포트가 호스트에 매핑되지 않았는가(ApiSecurityConfig 가 그 포트에서 /actuator/prometheus 를
#        permitAll 로 여는 근거가 바로 이 미노출이다 — 노출되면 미인증 메트릭 공개가 된다)
#   두 위반을 각각 주입해 red 를 확인했다(§0.7-H5). 판정 축이 늘었을 뿐 기존 항목은 하나도 바뀌지 않았다.

# [2026-08-03 Wave 1 보완] 게이트 클래스 1종 **신설** — TestSecurityChainOverrideLinterTest.
#   Wave 1 결정 원장 A-1 이 요구한 "재발 방지 린터" 가 이행되지 않아 신설한다. 테스트/픽스처가
#   SecurityFilterChain @Bean 을 선언하거나 mock-security* 프로파일을 쓰는 지점의 census 를 동결해,
#   보안 테스트가 프로덕션 ApiSecurityConfig 대신 자기가 쓴 체인을 검증하는 구조가 **더 늘지 못하게** 막는다.
#   현행 6항목은 실사용 중이라 동결로 시작한다(해소는 docs/04-operations/wave2-carryover.md §2 로 이월).
#   위반을 주입해 red 를 확인했다(§0.7-H5). __harness.classes 증가는 게이트 추가이지 완화가 아니다.

# [2026-08-03] ConfigSafetyLinterTest.DEPLOY_SCRIPT 신설 — 배포 스크립트가 prod 오버레이를
#   물고 있는지 검사하는 축을 추가한다. W0-04 의 봉합 전체가 deploy.sh 의 한 줄에 매달려 있었고,
#   그 줄이 지워지면 운영이 조용히 base 프로파일로 돌아가는데 린터는 그린이었다.
#   위반(그 줄 제거)을 주입해 red 를 확인했다(§0.7-H5). 판정 축 추가이지 완화가 아니다.

# [2026-08-03] 훅 무결성 축 신설 — __hooks.pre-push / __hooks.pre-commit.
#   Wave 0 P1-7 은 ① fast-pass 반전 ② 훅 자체 sha256 등재 둘 다 요구했는데 ①만 이행돼 있었다.
#   git 은 워킹트리의 훅을 그대로 실행하므로, 훅을 무력화하는 편집(조기 return 무조건화·fast-pass
#   정규식 복원·SKIP_HARNESS 반전)은 **그 편집된 훅이 자기 자신의 푸시를 승인**한다.
#   해시를 여기 동결하면 그 편집이 훅이 아니라 JVM 테스트에서 잡혀 우회가 성립하지 않는다.
#   훅 파일 삭제도 MISSING 으로 잡는다 — git 은 훅 없이 조용히 동작하므로 삭제가 가장 값싼 우회다.
#   훅을 정당하게 고쳤다면 이 두 줄을 함께 갱신한다(두 파일이 같이 바뀌어 diff 에 의도가 드러난다).

# [2026-08-03 Wave 1·2] 게이트 3종 갱신 — 전부 **판정 축 확대/예외 축소**이며 완화가 아니다.
#   · OwnershipGuardBaselineLinterTest.FROZEN_CENSUS  16 → 40
#       census 키를 `클래스#헬퍼` → `클래스#메서드#헬퍼` 로 격상. 종전에는 가드가 메서드 사이를
#       옮겨 다녀도 개수가 같아 보이지 않았다(2026-07-29 에 고친 IDOR 이 조용히 부활 가능했다).
#       항목이 늘어난 것은 대상이 늘어서가 아니라 **같은 대상을 더 잘게 본다**는 뜻이다.
#   · SecurityAuthAnnotationLinterTest.WRITE_AUTHZ_GUARDED_ELSEWHERE  16 → 15
#       `.business`/`.foundation` **패키지 전체 스킵**(컨트롤러 68중 65)이 삭제되고
#       FileApiController 면제도 제거됐다(대신 컨트롤러에 @PreAuthorize 부착). 예외가 줄었다.
#   · TestSecurityChainOverrideLinterTest.FROZEN_OVERRIDES  6 → 5
#       BaseSecurityTest 가 mock-security-test 프로파일을 벗어나 프로덕션 ApiSecurityConfig 위에서
#       돌게 되어 해소됐다. 게이트가 그 해소를 red 로 알려 목록을 줄이게 만들었다 — 설계 의도대로다.
#       (해소 근거는 그 린터 클래스의 '해소 기록' 주석에 남겼다.)

