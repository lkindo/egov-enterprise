# [2026-08-03] 게이트 클래스 1종 **신설** — HibernatePropertyBindingLinterTest.
#   application.yml 의 Hibernate 튜닝 키가 `spring.jpa.hibernate.*` 아래 있었다. Boot 는 그 위치에서
#   ddl-auto/naming 만 바인딩하고 나머지는 **조용히 무시**한다 — 실패도 경고도 없다. 그래서
#   order_inserts/order_updates 는 꺼진 채였고(Hibernate 기본 false), batch_size 는 선언값 25 가 아니라
#   기본값 15 로 돌고 있었다. "설정에 적혀 있으니 적용된다"는 이해와 실제가 갈라진 상태였다.
#   게이트는 두 축으로 판정한다: ① 자기 컨텍스트에 양쪽 prefix 를 동시에 주입해 어느 쪽이 도달하는지
#   실행으로 증명 ② 운영 yml 에 무시되는 키가 남아 있는지 정적 검사. 위반 주입 red 확인(§0.7-H5).
#   __harness.classes 증가는 게이트 추가이지 완화가 아니다.

# [2026-08-04] __hooks.pre-push 갱신 — pre-push 에 ESLint 단계를 **추가**했다(완화 아님).
#   근거: 2026-08-03 에 useAppForm.test.tsx 의 lint 에러 1건이 pre-push 를 그대로 통과했고,
#   그 결과 CI frontend-build 가 죽으면서 e2e-tests(needs: frontend-build)가 22티어 통째로
#   skip 됐다. 즉 lint 에러 1건이 E2E 전체를 재우고 있었다.
#   tsc 는 이것을 대체하지 못한다 — 이 저장소의 lint 는 타입이 아니라 계약 규칙
#   (인라인 z.object 금지 = 백엔드 생성 스키마 SSOT 강제)을 담고 있다.
#   차단 대상은 error 뿐이며 경고 457건은 통과시킨다(오탐 지배 게이트는 SKIP 을 정당화한다).
#   실측 비용 32초. 위반 주입 exit 1 / 제거 exit 0 을 양방향 확인했다(§0.7-H5).

# [2026-08-04] 게이트 클래스 1종 **신설** — AttachmentSourceRegistryLinterTest.
#   첨부파일 인가를 '인증만 하면 누구나'(수평 IDOR)에서 **도달성 기반**으로 바꿨다
#   (FileAccessPolicy / AttachmentSource). 그 판정의 전제는 레지스트리가 첨부를 참조하는
#   도메인 13종을 전부 알고 있다는 것이다 — 신규 도메인이 atchFileId 를 갖는데 등록되지 않으면
#   그 첨부는 어떤 근거도 만들지 못해 **정상 사용자가 자기 첨부에서 403** 을 맞는다.
#   레지스트리는 코드에, 도메인은 엔티티에 있어 둘은 조용히 갈라진다. 이 게이트가 그 이탈을 잡는다.
#   판정 축 2개(누락/유령) 모두 예외 목록을 두지 않는다 — 13종 규모라 예외 없이 유지할 수 있고,
#   예외가 필요해지는 순간이 곧 판정이 흐려지는 순간이다(§0.7-H2).
#   ATTACHMENT_STORAGE_TABLES(2항목)는 예외 목록이 아니라 **대상 정의**다(첨부 저장소 자신은
#   참조원이 아니라 참조 대상). 위반(레지스트리에서 tb_bbs_item 제거)을 주입해 red 확인(§0.7-H5).
#   __harness.classes 증가는 게이트 추가이지 완화가 아니다.
