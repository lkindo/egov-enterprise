spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    # [ADR-0024] 이 파일은 main application.yml 을 가린다. 운영과 같은 Jackson 기본값을 쓰도록 같은 선택을 둔다 —
    #   빠지면 테스트만 Jackson 3 기본값(날짜·primitive null·정렬 등)으로 검증한다.
    use-jackson2-defaults: true
    # Boot 3.5 는 파라미터 이름 모듈을 등록했다. Jackson 2 기본값은 이것을 끄므로 명시로 되돌린다(생성자 바인딩 유지).
    mapper:
      detect-parameter-names: true
    serialization:
      fail-on-empty-beans: false
  jpa:
    properties:
      # [2026-10-18] main application.yml 과 같은 비관적 잠금 대기 상한(ms). 이 파일이 main 을 가리므로 같은 값을 둔다 —
      #   빠지면 테스트만 상한 없이 기다린다. LockWaitTimeoutIntegrationTest 가 두 값의 일치와 실제 시간 초과를 본다.
      jakarta:
        persistence:
          lock:
            timeout: 5000
  # [ADR-0036] main application.yml 과 같은 페이징 규약(1 기반 page, 상한 100). 이 파일이 main 을 가리므로 같은 값을 둔다 —
  #   빠지면 시험만 0 기반 page 로 검증하며 green 이 된다. PageableConstructionLinterTest 가 두 값의 일치를 본다.
  data:
    web:
      pageable:
        one-indexed-parameters: true
        max-page-size: 100

file:
  upload:
    path: ./test-uploads

