spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  # [ADR-0024 1단계] 이 파일은 main application.yml 을 가린다. 운영과 같은 JSON 변환기(Jackson 2 호환)를 쓰도록
  #   같은 선택을 둔다 — 빠지면 테스트는 Jackson 3, 운영은 Jackson 2 로 서로 다른 변환기를 검증한다.
  jackson2:
    serialization:
      fail-on-empty-beans: false
  http:
    converters:
      preferred-json-mapper: jackson2
  websocket:
    messaging:
      preferred-json-mapper: jackson2

