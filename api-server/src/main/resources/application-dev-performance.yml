# 개발 환경 설정 (성능 분석 활성화)
spring:
  jpa:
    # SQL 로그 출력
    show-sql: true
    properties:
      hibernate:
        # SQL 포맷팅
        format_sql: true
        # 바인딩 변수 로그 출력
        jdbc:
          logging:
            enabled: true
        
# Hibernate 통계 (성능 분석용)
logging:
  level:
    # SQL 로그
    org.hibernate.SQL: DEBUG
    # 바인딩 변수 로그
    org.hibernate.orm.jdbc.bind: TRACE
    # 통계 로그
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: DEBUG
    # 캐시 로그
    org.hibernate.cache: DEBUG

# Hibernate 성능 분석 설정
hibernate:
  # 통계 활성화
  generate_statistics: true
  # 배치 사이즈 설정
  jdbc:
    batch_size: 25
    fetch_size: 100
  # N+1 쿼리 감지
  default_batch_fetch_size: 100
