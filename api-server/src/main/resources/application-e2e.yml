server:
  port: 8080
  error:
    include-stacktrace: never
    include-exception: false

spring:
  config:
    activate:
      on-profile: e2e

  flyway:
    # [W0-02] e2e 전용: auth.setup.ts 가 쓰는 webmaster/TEST1 의 알려진 비밀번호를 적재한다.
    #   이 시드가 없으면 신규 DB(CI 컨테이너)에서 로그인이 401 로 전멸한다.
    locations: classpath:db/migration,classpath:db/seed-dev


  # eGovFrame Property Service 지원을 위한 기본값 설정 (SystemLogApiController 등에서 사용)
  pageUnit: 10
  pageSize: 10

  # [2026-08-07] spring.ai 설정 제거 - spring-ai 의존성 자체를 걷어냈다.
  #   없는 오토컨피그를 exclude 하거나 없는 기능을 enabled:false 로 두면 팬텀 참조가 된다.
  datasource:
    # E2E 대상 DB는 실행 환경이 명시적으로 주입한다. 저장소 기본값으로 외부 DB에 연결하지 않는다.
    url: ${DB_URL}
    jdbc-url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: warn
    nuri: info
    egovframework: info
    org.hibernate.SQL: warn
    org.springframework.security: warn

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}

management:
  health:
    mail:
      enabled: false

# [2026-10-18] E2E 는 모든 요청(브라우저·인증 setup·API 계약 시험·서버 렌더링)이 한 루프백 IP 에서 온다.
#   운영 기본 로그인 한도(application.yml, IP 당 분당 30)는 사용자별 IP 를 전제한 값이라 여기서는 전체 실행의 상한이 된다.
#   종전 기본값(전체 10,000 · 로그인 2,000)을 이 일회용 격리 실행에만 유지한다. 호스트가 값을 주면 그 값을 따른다.
nuri:
  security:
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:10000}
      login-requests-per-minute: ${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:2000}
