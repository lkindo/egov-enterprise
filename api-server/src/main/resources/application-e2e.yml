server:
  port: 8080
  error:
    include-stacktrace: never
    include-exception: false

spring:
  config:
    activate:
      on-profile: e2e

  flyway:
    # [W0-02] e2e 전용: auth.setup.ts 가 쓰는 webmaster/TEST1 의 알려진 비밀번호를 적재한다.
    #   이 시드가 없으면 신규 DB(CI 컨테이너)에서 로그인이 401 로 전멸한다.
    locations: classpath:db/migration,classpath:db/seed-dev


  # eGovFrame Property Service 지원을 위한 기본값 설정 (SystemLogApiController 등에서 사용)
  pageUnit: 10
  pageSize: 10

  # [2026-08-07] spring.ai 설정 제거 - spring-ai 의존성 자체를 걷어냈다.
  #   없는 오토컨피그를 exclude 하거나 없는 기능을 enabled:false 로 두면 팬텀 참조가 된다.
  datasource:
    # OCI (Oracle Cloud Infrastructure) Production-like DB — 접속 정보는 환경변수로 외부화(기본값은 로컬 e2e 편의용)
    url: ${DB_URL:jdbc:postgresql://129.154.54.178:5432/egovdb?currentSchema=public&prepareThreshold=0}
    jdbc-url: ${DB_URL:jdbc:postgresql://129.154.54.178:5432/egovdb?currentSchema=public&prepareThreshold=0}
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:egov123}
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://129.154.54.178:5432/egovdb?currentSchema=public&prepareThreshold=0}
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: warn
    nuri: info
    egovframework: info
    org.hibernate.SQL: warn
    org.springframework.security: warn

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}

management:
  health:
    mail:
      enabled: false
