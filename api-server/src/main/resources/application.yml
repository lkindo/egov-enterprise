spring:
  threads:
    virtual:
      enabled: true
  # profiles:
  #   active: dev
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000
  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never

  datasource:
    # Supabase connection (Commented)
    # url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?currentSchema=public&prepareThreshold=0
    # jdbc-url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?currentSchema=public&prepareThreshold=0
    # username: postgres.kmtcbkxvrbnfijvbdsrx
    # password: s5isI0KE48Bd9kD1
    
    # Oracle Cloud connection (Use environment variables, default to local localhost)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public&prepareThreshold=0}
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public&prepareThreshold=0}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public&prepareThreshold=0}
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 300000
      leak-detection-threshold: 60000
      pool-name: egov-hikaricp
      connection-init-sql: "SET search_path TO public"
      validation-timeout: 10000
      initialization-fail-timeout: -1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      order-inserts: true
      order-updates: true
      batch-size: 25
      jdbc:
        batch_size: 25
        fetch_size: 100
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_batch_fetch_size: 100
        jdbc:
          batch_versioned_data: true
          scrollable_result_set_enabled: false
          time_zone_in_legacy_mapping: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2.0
    locations: classpath:db/migration


jwt:
  secret: ${JWT_SECRET:}

logging:
  level:
    root: warn
    nuri: debug
    egovframework: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    org.hibernate.stat: info
    org.springframework.security: info
    org.springframework.web: info
    org.springframework.web.servlet.mvc.method.annotation: info
    org.springframework.orm.jpa: info
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

file:
  upload:
    path: ./storage/uploads

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,env,beans"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name:egov-enterprise}
    export:
      prometheus:
        enabled: true

Globals:
  File:
    # [보안 C1] 마스터 암호화 키(주민번호 등 PII 암복호화에 사용). 운영은 반드시 외부 시크릿(ALGORITHM_KEY 환경변수/Vault/KMS)으로
    # 고엔트로피 키를 주입한다. 아래 기본값 'egovframe'은 로컬/개발 편의용 약한 값이며 CryptoUtil이 사용 시 경고한다.
    # ⚠ 키를 실제로 로테이션하면 기존 암호문(RRN 등) 재암호화 마이그레이션이 반드시 선행되어야 한다.
    algorithmKey: ${ALGORITHM_KEY:egovframe}

# CORS 허용 오리진 (개발/기본 환경)
# 운영 환경은 application-prod.yml에서 재정의
cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"

security:
  # [Phase2 수정] @Value("${security.whitelist}") List<String> 는 YAML 시퀀스를 바인딩하지 못한다
  # (Spring 이 인덱스 프로퍼티 security.whitelist[0]... 로 저장 → 비인덱스 placeholder 미해결).
  # 정상 동작하는 cors.allowed-origins 와 동일하게 CSV 문자열로 정의한다.
  whitelist: "/api/v1/health,/api/v1/auth/**,/api/v1/public/**,/api/v1/menus/**,/api/v1/images/**,/api/v1/users/signup"
    - "/api/v1/users/check-id"
    - "/actuator/health"
