spring:
  profiles:
    active: dev
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  sql:
    init:
      mode: never

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public}
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public}
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      pool-name: egov-hikaricp
      connection-init-sql: SELECT 1
      validation-timeout: 5000
      initialization-fail-timeout: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      order-inserts: true
      order-updates: true
      batch-size: 25
      jdbc:
        batch_size: 25
        fetch_size: 100
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_batch_fetch_size: 100
        jdbc:
          batch_versioned_data: true
          scrollable_result_set_enabled: false
          time_zone_in_legacy_mapping: false

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: warn
    com.company.project: info
    egovframework: warn
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.springframework.security: info
    org.springframework.web: debug
    org.springframework.web.servlet.mvc.method.annotation: trace

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./storage/uploads}

server:
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: true
