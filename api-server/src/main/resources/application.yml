spring:
  threads:
    virtual:
      enabled: true
  # profiles:
  #   active: dev
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000
  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never

  datasource:
    # (legacy Supabase datasource removed — credentials externalized to env)

    # Oracle Cloud connection
    url: ${DB_URL:jdbc:postgresql://129.154.54.178:5432/egovdb?currentSchema=public&prepareThreshold=0}
    jdbc-url: ${DB_URL:jdbc:postgresql://129.154.54.178:5432/egovdb?currentSchema=public&prepareThreshold=0}
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:egov123}
    driver-class-name: org.postgresql.Driver
    # [pool] LegacyConfig 의 커스텀 @Primary DataSource 는 @ConfigurationProperties("spring.datasource")
    # 로 바인딩되어 아래 `hikari:` 중첩블록을 인식하지 못한다(그 블록은 Boot 자동설정 전용이며,
    # 커스텀 DataSource 가 존재하면 Boot 자동설정은 back-off 한다). 따라서 실제로 적용돼야 하는 풀
    # 튜닝은 여기 top-level flat 키로 둬야 HikariDataSource setter 에 직접 바인딩된다.
    # DB-07: connection-timeout 을 30s 로(기본 30s 와 동일하지만 명시), 풀 크기/누수감지도 실제 적용.
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 300000
    max-lifetime: 600000
    connection-timeout: 30000
    leak-detection-threshold: 60000
    pool-name: egov-hikaricp
    connection-init-sql: "SET search_path TO public"
    validation-timeout: 10000
    initialization-fail-timeout: -1
    # 아래 hikari.* 는 test 프로파일의 Boot 자동설정 경로에서만 사용된다(커스텀 DataSource 는 무시).
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://129.154.54.178:5432/egovdb?currentSchema=public&prepareThreshold=0}
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: egov-hikaricp

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      order-inserts: true
      order-updates: true
      batch-size: 25
      jdbc:
        batch_size: 25
        fetch_size: 100
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_batch_fetch_size: 100
        jdbc:
          batch_versioned_data: true
          scrollable_result_set_enabled: false
          time_zone_in_legacy_mapping: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration


jwt:
  secret: ${JWT_SECRET:4s3cr3tK3yF0rJWT51gn1ngMu5tB3L0ngEn0ughT0M33tTh3R3qu1r3m3nt5!}

logging:
  level:
    root: warn
    nuri: debug
    egovframework: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    org.hibernate.stat: info
    org.springframework.security: info
    org.springframework.web: info
    org.springframework.web.servlet.mvc.method.annotation: info
    org.springframework.orm.jpa: info
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

file:
  upload:
    path: ./storage/uploads

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,env,beans"
  endpoint:
    health:
      # 비인증 /actuator/health 가 컴포넌트 상세(DB 벤더/검증, 디스크 경로/여유바이트 등)를
      # 노출하지 않도록 인증 시에만 상세를 보인다(prod 와 동일). 기본/dev/e2e 도 이 값을 상속.
      show-details: when_authorized
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name:egov-enterprise}
    export:
      prometheus:
        enabled: true

Globals:
  File:
    algorithmKey: egovframe

# CORS 허용 오리진 (개발/기본 환경)
# 운영 환경은 application-prod.yml에서 재정의
cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
