spring:
  threads:
    virtual:
      enabled: true
  # profiles:
  #   active: dev
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000
  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never

  datasource:
    
    # Oracle Cloud connection (Use environment variables, default to local localhost)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public&prepareThreshold=0}
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public&prepareThreshold=0}
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:egov123}
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public&prepareThreshold=0}
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 300000
      leak-detection-threshold: 60000
      pool-name: egov-hikaricp
      connection-init-sql: "SET search_path TO public"
      validation-timeout: 10000
      initialization-fail-timeout: -1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      order-inserts: true
      order-updates: true
      batch-size: 25
      jdbc:
        batch_size: 25
        fetch_size: 100
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_batch_fetch_size: 100
        jdbc:
          batch_versioned_data: true
          scrollable_result_set_enabled: false
          time_zone_in_legacy_mapping: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    # 무이력 비어있지-않은 DB 는 2.1 로 baseline → V2_0/V2_1 스킵(중복 적재 방지). 빈 DB 는 무영향(전량 적용).
    baseline-version: 2.1
    locations: classpath:db/migration


jwt:
  # [보안 C1] JWT 서명 키 — algorithmKey와 동일 관례: base는 dev-safe 기본값(dev/local/e2e 프로파일과 동일 값),
  # 운영은 application-prod.yml에서 무기본값(${JWT_SECRET})으로 재선언해 미설정 시 기동 실패(fail-fast)시킨다.
  # (빈 기본값 ${JWT_SECRET:}는 base=default 프로파일 부팅[npm run dev]까지 JwtTokenProvider.init에서 죽이므로 지양)
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}

# 로그 보존정책 (LogRetentionScheduler) — 접속기록 보존기간 확정: 2년(24개월, 2026-07-17 제품 결정).
# 근거: 개인정보의 안전성 확보조치 기준 제8조. months < 12(법정 최저) 이면 스케줄러가 삭제를 건너뛰어(전량파기 방지)
#       오설정 사고를 코드로 막는다. 정책 상세: docs/04-operations/log-retention-policy.md.
nuri:
  log:
    retention:
      enabled: ${LOG_RETENTION_ENABLED:true}
      cron: "0 0 4 * * *"       # 매일 04:00 (Asia/Seoul)
      web-months: 24            # 접속기록 2년
      sys-months: 24            # 시스템 처리 로그 2년
      login-months: 24          # 로그인 이력 2년(기록경로 복원 시 유효)
      user-months: 24           # 개인 사용통계 백스톱 2년(주 정리는 사용자 삭제 시 즉시)

  # 로그인 무차별 대입(brute-force) 방어 — 연속 실패 N회 도달 시 계정 잠금, M분 경과 후 자동 해제.
  # 판정/해제 주체: EgovAuthenticationProvider. 잠금 시각은 tb_user_info.lck_last_pnttm 에 기록된다.
  # ⚠ max-failures 를 0 이하로 두면 잠금이 비활성화된다 — 오설정으로 정상 사용자가 대량 잠기는
  #   가용성 사고를 재배포 없이 즉시 회피하기 위한 운영 탈출구다(평시에는 반드시 1 이상 유지).
  security:
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}   # 연속 실패 5회째에 잠금
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}  # 잠금 지속 15분(경과 후 다음 시도에서 자동 해제)

logging:
  level:
    root: warn
    nuri: debug
    egovframework: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    org.hibernate.stat: info
    org.springframework.security: info
    org.springframework.web: info
    org.springframework.web.servlet.mvc.method.annotation: info
    org.springframework.orm.jpa: info
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

file:
  upload:
    path: ./storage/uploads

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,env,beans"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name:egov-enterprise}
    export:
      prometheus:
        enabled: true

Globals:
  File:
    # [보안 C1] 마스터 암호화 키(주민번호 등 PII 암복호화에 사용). 운영은 반드시 외부 시크릿(ALGORITHM_KEY 환경변수/Vault/KMS)으로
    # 고엔트로피 키를 주입한다. 아래 기본값 'egovframe'은 로컬/개발 편의용 약한 값이며 CryptoUtil이 사용 시 경고한다.
    # ⚠ 키를 실제로 로테이션하면 기존 암호문(RRN 등) 재암호화 마이그레이션이 반드시 선행되어야 한다.
    algorithmKey: ${ALGORITHM_KEY:egovframe}

# CORS 허용 오리진 (개발/기본 환경)
# 운영 환경은 application-prod.yml에서 재정의
cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"

security:
  # [Phase2 수정] @Value("${security.whitelist}") List<String> 는 YAML 시퀀스를 바인딩하지 못한다
  # (Spring 이 인덱스 프로퍼티 security.whitelist[0]... 로 저장 → 비인덱스 placeholder 미해결).
  # 정상 동작하는 cors.allowed-origins 와 동일하게 CSV 문자열로 정의한다.
  whitelist: "/api/v1/health,/api/v1/auth/**,/api/v1/public/**,/api/v1/menus/**,/api/v1/images/**,/api/v1/users/signup,/api/v1/users/check-id,/actuator/health"

# RBAC DB 인가 모드 (Phase 2: shadow → Phase 3: enforce)
rbac:
  shadow:
    enabled: false  # true: 섀도우 평가 활성(enforce는 하드코딩 유지), false: 비활성
  db-auth:
    enabled: true   # true: DB 인가로 enforce 전환 (Phase 3), false: 하드코딩 유지
    secure-paths: "/api/v1/admin/**,/actuator/**,/api/v1/surveys,/api/v1/surveys/**,/api/v1/main-images,/api/v1/main-images/**,/api/v1/help,/api/v1/help/**,/api/v1/faqs,/api/v1/faqs/**,/api/v1/calendar/holidays,/api/v1/calendar/holidays/**"

