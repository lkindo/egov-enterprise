spring:
  profiles:
    active: dev
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  sql:
    init:
      mode: never

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public}
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb?currentSchema=public}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: info
    com.company.project: debug
    egovframework: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: info
    org.springframework.web: debug
    org.springframework.web.servlet.mvc.method.annotation: trace

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./storage/uploads}

server:
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: true
