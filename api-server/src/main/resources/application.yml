spring:
  # profiles:
  #   active: dev
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never

  datasource:
    # Supabase connection (Commented)
    # url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?currentSchema=public&prepareThreshold=0
    # jdbc-url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?currentSchema=public&prepareThreshold=0
    # username: postgres.kmtcbkxvrbnfijvbdsrx
    # password: s5isI0KE48Bd9kD1
    
    # Oracle Cloud connection
    url: ${DB_URL}
    jdbc-url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # jdbc-url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?currentSchema=public&prepareThreshold=0
      jdbc-url: ${DB_URL}
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 300000
      leak-detection-threshold: 60000
      pool-name: egov-hikaricp
      connection-init-sql: "SET search_path TO public"
      validation-timeout: 10000
      initialization-fail-timeout: -1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      order-inserts: true
      order-updates: true
      batch-size: 25
      jdbc:
        batch_size: 25
        fetch_size: 100
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: true
        default_batch_fetch_size: 100
        jdbc:
          batch_versioned_data: true
          scrollable_result_set_enabled: false
          time_zone_in_legacy_mapping: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration


jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: warn
    nuri: debug
    egovframework: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.stat: debug
    org.springframework.security: info
    org.springframework.web: info
    org.springframework.web.servlet.mvc.method.annotation: info
    org.springframework.orm.jpa: debug
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

file:
  upload:
    path: ./storage/uploads

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,env,beans"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name:egov-enterprise}
    export:
      prometheus:
        enabled: true

Globals:
  File:
    algorithmKey: egovframe

# CORS 허용 오리진 (개발/기본 환경)
# 운영 환경은 application-prod.yml에서 재정의
cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
