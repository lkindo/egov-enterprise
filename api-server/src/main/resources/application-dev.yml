server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=ebt&client_encoding=UTF8
    jdbc-url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=ebt&client_encoding=UTF8
    driver-class-name: org.postgresql.Driver
    username: egov
    password: egov123
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    com.company.project: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
    egovframework: DEBUG
    org.apache.jasper: DEBUG
    org.springframework.web: TRACE
    org.springframework.web.servlet.view: DEBUG
