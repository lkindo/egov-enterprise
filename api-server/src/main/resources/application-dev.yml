spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=ebt
    jdbc-url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=ebt
    driver-class-name: org.postgresql.Driver
    username: egov
    password: egov123
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

mybatis:
  mapper-locations: classpath:/mapper/**/*_postgres.xml
  type-aliases-package: egovframework.let.**.service,egovframework.com.**.service,egovframework.com.cmm,egovframework.let.sts.com

logging:
  level:
    com.company.project: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
    egovframework: DEBUG
