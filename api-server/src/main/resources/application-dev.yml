spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=public
    jdbc-url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=public
    username: egov
    password: egov123
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: jdbc:postgresql://localhost:5433/egovdb?currentSchema=public

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  mybatis:
    mapper-locations: classpath:/mapper/com/**/*.xml
    configuration:
      map-underscore-to-camel-case: true

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: info
    com.company.project: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: info
