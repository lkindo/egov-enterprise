server:
  port: 8080
  error:
    include-stacktrace: always
    include-exception: true
spring:
  main:
    allow-circular-references: false
    lazy-initialization: false
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiConnectionDetailsAutoConfiguration

  flyway:
    # [W0-02] dev 전용: 알려진 개발 자격증명 시드를 추가 적재한다.
    #   운영(base application.yml)은 classpath:db/migration 단독이며 이 위치를 보지 않는다.
    locations: classpath:db/migration,classpath:db/seed-dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/egovdb}
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5433/egovdb}
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:egov123}
#    password: ${SUPABASE_DB_PASSWORD:}  # 유출됨 — 로테이션 필요 (실제 값 제거됨)
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5433/egovdb}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # [P5 후미] 부팅 시 엔티티↔스키마 드리프트 검출 복원 (Flyway 선행 + validate 조합은 무해)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: true

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: info
    nuri: debug
    egovframework: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.stat: debug
    org.springframework.orm.jpa: debug
    org.springframework.security: debug

jwt:
  # CRITICAL: JWT_SECRET environment variable MUST be set in production.
  # Using a default secure length string for local development to prevent startup failures.
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}
