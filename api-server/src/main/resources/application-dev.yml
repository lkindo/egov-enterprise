server:
  port: 8080
  error:
    include-stacktrace: always
    include-exception: true
spring:
  main:
    allow-circular-references: false
    lazy-initialization: false
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/egovdb?currentSchema=public}
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5433/egovdb?currentSchema=public}
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:egov123}
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5433/egovdb?currentSchema=public}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: info
    com.company.project: debug
    egovframework: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: debug

jwt:
  # CRITICAL: JWT_SECRET environment variable MUST be set in production.
  # Using a default secure length string for local development to prevent startup failures.
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}
