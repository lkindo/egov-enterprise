#-----------------------------------------------------------------------
#
#   globals.properties : 시스템
#
#-----------------------------------------------------------------------
#   1.  key = value 구조입니다.
#   2.  key값은 공백문자를 포함불가, value값은 공백문자를 가능
#   3.  key값으로 한글을 사용불가,   value값은 한글사용이 가능
#   4.  줄을 바꿀 필요가 있으면 '\'를 라인의 끝에 추가(만약  '\'문자를 사용해야 하는 경우는 '\\'를 사용)
#   5.  Windows에서의 디렉토리 표시 : '\\' or '/'  ('\' 사용하면 안됨)
#   6.  Unix에서의 디렉토리 표시 : '/'
#   7.  주석처리는  #사용
#   8.  value값 뒤에 스페이스가 존재하는 경우 서블릿에서 참조할때는 에러발생할 수 있으므로 trim()하거나 마지막 공백없이 properties 값을 설정할것
#-----------------------------------------------------------------------
#   [2026-10-07] 이 파일에서 읽히는 키는 아래 두 개뿐이다(ProjectCryptoConfig·CryptoUtil 의 @Value).
#   읽는 코드가 없던 eGov 레거시 키(OsType·DbType·fileUpload.* 등)는 실제 설정
#   (application.yml multipart 한도·FileService 허용 확장자)과 다른 값을 말하고 있어 걷었다.
#-----------------------------------------------------------------------

# File ID 암호화 키
# ⚠ 유출됨 — 로테이션 필요: 실제 암호화 키 제거, 환경변수로 외부화(기본값 egovframe)
Globals.File.algorithmKey = ${ALGORITHM_KEY:egovframe}
Globals.File.previousAlgorithmKey = ${OLD_ALGORITHM_KEY:}
