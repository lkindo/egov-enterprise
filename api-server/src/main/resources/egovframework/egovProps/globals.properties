#-----------------------------------------------------------------------
#
#   globals.properties : 시스템
#
#-----------------------------------------------------------------------
#   1.  key = value 구조입니다.
#   2.  key값은 공백문자를 포함불가, value값은 공백문자를 가능
#   3.  key값으로 한글을 사용불가,   value값은 한글사용이 가능
#   4.  줄을 바꿀 필요가 있으면 '\'를 라인의 끝에 추가(만약  '\'문자를 사용해야 하는 경우는 '\\'를 사용)
#   5.  Windows에서의 디렉토리 표시 : '\\' or '/'  ('\' 사용하면 안됨)
#   6.  Unix에서의 디렉토리 표시 : '/'
#   7.  주석처리는  #사용
#   8.  value값 뒤에 스페이스가 존재하는 경우 서블릿에서 참조할때는 에러발생할 수 있으므로 trim()하거나 마지막 공백없이 properties 값을 설정할것
#-----------------------------------------------------------------------

# 운영서버 타입(WINDOWS, UNIX)
Globals.OsType = WINDOWS

# G4C 연결용 IP (localhost)
Globals.LocalIp = 127.0.0.1

# DB서버 타입(mysql,oracle,altibase,tibero,cubrid,postgres) - datasource 및 sqlMap 파일 지정에 사용됨
Globals.DbType = postgres
# ⚠ 유출됨 — 로테이션 필요: 아래 DB 접속 정보의 실제 값(Supabase 계정/비밀번호)을 제거하고 환경변수로 외부화함.
Globals.UserName = ${SUPABASE_DB_USERNAME:postgres}
Globals.Password = ${SUPABASE_DB_PASSWORD:}

#postgres
Globals.DriverClassName=org.postgresql.Driver
# ⚠ 유출됨 — 로테이션 필요: 실제 Supabase 호스트 제거, 환경변수로 외부화(기본값 localhost)
Globals.Url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=public}

# 로그인 보안 설정 (session 또는 security)
Globals.Auth = security

# 비밀번호 유효기간 설정 (일)
Globals.ExpirePwdDay = 180

# MainPage Setting
Globals.MainPage = /cmm/main/mainPage.do

# File Upload Settings for Tomcat 11
Globals.fileUpload.Extensions = .gif,.jpg,.jpeg,.png,.xls,.xlsx
Globals.fileUpload.maxFileSize = 104857600
Globals.fileUpload.maxRequestSize = 104857600
Globals.fileUpload.maxFileCount = 1000
Globals.fileUpload.fileSizeThreshold = 1048576
Globals.posblAtchFileSize = 10485760
Globals.fileStorePath = /upload/ebt

# File ID 암호화 키
# ⚠ 유출됨 — 로테이션 필요: 실제 암호화 키 제거, 환경변수로 외부화(기본값 egovframe)
Globals.File.algorithmKey = ${ALGORITHM_KEY:egovframe}
