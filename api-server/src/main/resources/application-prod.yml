server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egovdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:egov}
    password: ${DB_PASSWORD:egov123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  level:
    root: WARN
    com.company.project: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: ${LOG_PATH:/var/log/egov}/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

jwt:
  secret: ${JWT_SECRET}
