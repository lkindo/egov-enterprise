server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL}
    jdbc-url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # [pool] flat 키로 둬야 커스텀 @Primary DataSource 에 실제 바인딩된다(base application.yml 주석 참조).
    # 중첩 hikari.* 로 두면 무시되어 prod 가 Hikari 기본값(pool 10)으로 동작한다.
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 300000
    connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  # prod: fail-fast — JWT_SECRET must be provided (no fallback default)
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  loki:
    url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
  level:
    root: info
    nuri: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: ${LOG_PATH:/var/log/egov}/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# CORS 허용 오리진 (운영 환경)
cors:
  allowed-origins: "${CORS_ORIGIN_1:https://egov.example.com},${CORS_ORIGIN_2:https://www.egov.example.com}"

# Swagger/OpenAPI 보안 설정 (운영 환경 비활성화)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
