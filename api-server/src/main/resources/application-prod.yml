server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  # [W1-05] 운영에서는 스키마 baseline 을 자동으로 잡지 않는다.
  #   base 는 baseline-on-migrate: true 라, **이력 테이블 없는 비어있지-않은 스키마**를 만나면
  #   V2_0(baseline)·V2_1(메타 시드)을 **조용히 건너뛰고** 그 이후만 적용한 뒤 정상 기동한다.
  #   결과는 "스키마가 맞다고 믿는 채로 뜬 서버" 이고, 불일치는 한참 뒤 런타임 오류로 드러난다.
  #   false 면 같은 상황에서 즉시 기동 실패한다 — 시끄러운 실패가 조용한 손상보다 낫다.
  #
  #   ⚠ 운영 절차상 'pg_dump 를 수동 복원한 뒤 앱을 붙이는' 경로가 있다면 그 경로가 정확히 여기에
  #     걸린다. 그 경우 복원 스크립트에 flyway baseline 수동 수행을 명문화해야 한다.
  #   ⚠ base(dev/local/e2e)는 true 를 유지한다 — 이력 없는 로컬 DB 를 가진 개발자가 즉시
  #     부팅 불가가 되는 것을 피하기 위해서다.
  flyway:
    baseline-on-migrate: false

  # [W1-13] SMTP 무기본값 강제 — 미설정 시 기동 실패.
  #   근거: spring.mail.host 가 없으면 LoggingEmailSender 가 활성화되는데, 그 구현은 이름 그대로
  #   **메일을 보내지 않고 로그만 남긴다**. 비밀번호 재발급·알림이 전부 나가지 않는 상태로 운영에
  #   올라갈 수 있었고, 그 사실은 아무 데도 드러나지 않았다(200 응답에 성공 토스트까지 떴다).
  #   무기본값은 그 배포 경로 자체를 차단한다 — JWT_SECRET·ALGORITHM_KEY 와 같은 패턴이다.
  #   ⚠ 여기에는 **운영이 반드시 덮어써야 하는 것만** 둔다. username/password 를 빈 기본값
  #     플레이스홀더로 선언했더니 SecretLiteralLinterTest 가 즉시 red 를 냈다 — 옳은 판정이다.
  #     `${MAIL_PASSWORD:}` 는 미설정을 빈 문자열로 흡수해 fail-fast 를 무력화한다.
  #     인증이 필요한 릴레이라면 SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD 환경변수로 주입하면
  #     Spring 완화 바인딩이 그대로 받는다. 선언하지 않는 것이 기본값을 두는 것보다 안전하다.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}

  datasource:
    url: ${DB_URL}
    # ⚠[W0-04 실측·기동 차단 수정] jdbc-url 이 없으면 prod 는 기동하지 못한다.
    #   LegacyConfig.dataSource() 가 @Primary + @ConfigurationProperties("spring.datasource") 로
    #   HikariDataSource 에 직접 바인딩하는데 HikariConfig 에는 setUrl() 이 없다 → `url` 은 바인딩되지 않고
    #   jdbcUrl 이 null 인 채 driverClassName 만 세팅되어 HikariConfig.validate() 가
    #   "jdbcUrl is required with driverClassName." 로 실패한다. base(application.yml)가 url·jdbc-url 을
    #   중복 선언하고 있는 것이 이 제약의 흔적이다.
    jdbc-url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # ⚠ 아래 nested `hikari:` 블록은 위와 같은 이유로 런타임에 적용되지 않는다(HikariConfig 에 setHikari 부재).
    #   실효를 가지려면 flat 키여야 한다. 값 재정합은 pool 크기 동시 변경을 수반하므로 별도 항목으로 분리했고,
    #   커넥션 획득 상한은 base 의 flat `spring.datasource.connection-timeout` 이 담당한다.
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  # [W1-12] 관리 엔드포인트를 애플리케이션 포트에서 분리한다.
  #   문제: /actuator/** 는 rbac secure-paths 에 포함돼 ROLE_ADMIN 을 요구하는데 스크레이퍼는 그 권한이 없다.
  #        게다가 prod 노출 목록에서 prometheus 가 빠져 있어 경로 자체가 없었다 — 이중으로 막혀 있었다.
  #   왜 인가가 아니라 네트워크로 푸는가: 화이트리스트로 열면 '그 경로가 외부에 노출되지 않는다'를
  #        계속 증명해야 한다. 메트릭은 엔드포인트 경로·에러율·JVM 내부를 드러내므로 미인증 공개는
  #        가드 완화에 해당한다. 별도 포트를 루프백/내부망에만 바인딩하면 그 증명이 구조로 대체된다.
  #   ⚠ compose 에서 이 포트를 호스트로 노출하지 말 것. 스크레이퍼는 같은 네트워크 안에서 접근한다.
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        # base(application.yml)와 토큰 집합을 맞춘다. prometheus 누락이 스크레이프 불가의 절반이었다.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  # [W1-11] 파일 로그 설정 제거 — 운영은 stdout 단독이다(logback-spring.xml 참조).
  #   종전 기본값 /var/log/egov 는 컨테이너의 비루트 사용자가 만들 수 없는 경로라
  #   운영 파일 로그가 **처음부터 0바이트**였다. 경로를 고치는 대신 컨테이너 표준(stdout)으로 옮겼다.
  #   logging.loki.url 도 함께 제거했다 — 수집 스택(loki 서비스)이 저장소에 존재하지 않아
  #   존재하지 않는 호스트로 매 이벤트를 밀며 내부 오류를 상시 발생시켰다.
  level:
    root: info
    nuri: INFO
    org.springframework: WARN
    org.hibernate: WARN

# CORS 허용 오리진 (운영 환경)
cors:
  allowed-origins: "${CORS_ORIGIN_1:https://egov.example.com},${CORS_ORIGIN_2:https://www.egov.example.com}"

# [보안 C1] PII 마스터 암호화 키 — 운영은 반드시 외부 시크릿(ALGORITHM_KEY/Vault/KMS)으로 주입.
# 무기본값(${ALGORITHM_KEY})이라 미설정 시 기동 실패(fail-fast) → 약한 기본값 'egovframe'을 운영에서 원천 차단.
# ⚠ 키 로테이션 시 기존 암호문(RRN 등) 재암호화 마이그레이션이 반드시 선행되어야 한다.
Globals:
  File:
    algorithmKey: ${ALGORITHM_KEY}

# [보안] JWT refresh 쿠키를 운영에서 Secure(HTTPS 전용)로 강제 (base 기본값 false 오버라이드)
jwt:
  # [보안 C1] 운영은 JWT_SECRET 무기본값 강제 → 미설정 시 기동 실패(fail-fast). base의 dev-safe 기본값을 운영에서 원천 차단(algorithmKey와 동일 패턴).
  secret: ${JWT_SECRET}
  cookie:
    secure: true

# Swagger/OpenAPI 보안 설정 (운영 환경 비활성화)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
