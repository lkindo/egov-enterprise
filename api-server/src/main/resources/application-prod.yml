server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.kmtcbkxvrbnfijvbdsrx}
    password: ${DB_PASSWORD:s5isI0KE48Bd9kD1}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  level:
    root: WARN
    nuri: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: ${LOG_PATH:/var/log/egov}/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
