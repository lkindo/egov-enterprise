server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

logging:
  loki:
    url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
  level:
    root: info
    nuri: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: ${LOG_PATH:/var/log/egov}/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# CORS 허용 오리진 (운영 환경)
cors:
  allowed-origins: "${CORS_ORIGIN_1:https://egov.example.com},${CORS_ORIGIN_2:https://www.egov.example.com}"

# [보안 C1] PII 마스터 암호화 키 — 운영은 반드시 외부 시크릿(ALGORITHM_KEY/Vault/KMS)으로 주입.
# 무기본값(${ALGORITHM_KEY})이라 미설정 시 기동 실패(fail-fast) → 약한 기본값 'egovframe'을 운영에서 원천 차단.
# ⚠ 키 로테이션 시 기존 암호문(RRN 등) 재암호화 마이그레이션이 반드시 선행되어야 한다.
Globals:
  File:
    algorithmKey: ${ALGORITHM_KEY}

# Swagger/OpenAPI 보안 설정 (운영 환경 비활성화)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
