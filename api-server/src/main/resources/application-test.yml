# 테스트 컨텍스트에선 로그 보존 스케줄러를 비활성화(H2 대상 스케줄 삭제 배제, 컨텍스트 단순 유지).
# 보존 로직 자체는 LogRetentionSchedulerTest(단위)가 검증한다.
nuri:
  log:
    retention:
      enabled: false

spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
      envers:
        enabled: false

  h2:
    console:
      enabled: true

  flyway:
    enabled: false

  liquibase:
    enabled: false

jwt:
