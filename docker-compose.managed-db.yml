# 외부 관리형 DB 오버레이 (운영 오버레이 위에 겹쳐 쓴다, Wave 4)
#
#   node scripts/managed-db-env-check.mjs   # 먼저 DB 접속 변수의 형식·SSL 을 검사한다(실패하면 올리지 않는다)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.managed-db.yml up -d
#
# [하는 일] 번들 PostgreSQL 컨테이너(db)를 기본 기동에서 뺀다(bundled-db 프로필에서만 뜬다). api 가 db 를 기다리지 않게 하고,
#   접속은 운영 오버레이의 DB_URL·DB_USERNAME·DB_PASSWORD 로만 들어간다(SPRING_APPLICATION_JSON 교체는 운영 오버레이가 한다).
#   관리형 DB 의 서버 인증서를 검증하도록 CA 인증서 디렉터리를 읽기 전용으로 붙인다 — DB_URL 은 sslmode=verify-full 과
#   sslrootcert=/app/certs/db/<파일> 을 담아야 한다(검사 스크립트가 본다).
#
# ⚠ 경계: scripts/deploy.sh 와 백업·복원 런북·복원 훈련은 번들 DB 전용이다 — 이 오버레이로 올린 배포의 백업·PITR·복원은 관리형 DB
#   공급자의 절차를 따른다(런북을 건너뛰지 말고 공급자 절차로 대체한다). 첨부 볼륨(attachment_storage)은 그대로다 — 노드가 여럿이면
#   첨부 저장소를 S3 호환 저장소(FILE_STORAGE_TYPE=s3)로 바꾼다.
services:
  db:
    profiles: ["bundled-db"]

  api:
    depends_on: !reset {}
    environment:
      # 운영 오버레이가 이미 필수로 요구한다. 여기서는 관리형 DB 전용 안내만 덧붙인다.
      DB_URL: ${DB_URL:?관리형 DB 의 DB_URL 이 필요합니다 (jdbc:postgresql://<host>:<port>/<db>?sslmode=verify-full&sslrootcert=/app/certs/db/<file>)}
    volumes:
      - ${DB_SSL_CA_DIR:?관리형 DB 의 CA 인증서 디렉터리(DB_SSL_CA_DIR)가 필요합니다}:/app/certs/db:ro
