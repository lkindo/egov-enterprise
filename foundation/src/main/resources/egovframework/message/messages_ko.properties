# Common Messages
common.success=정상적으로 처리되었습니다.
common.error.internal=서버 내부 오류가 발생했습니다.
common.error.bad_request=잘못된 요청입니다.
common.error.not_found=대상을 찾을 수 없습니다.
common.error.forbidden=접근 권한이 없습니다.

# =====================================================================
# Validation Messages
# Bean Validation 애노테이션의 message = "{키}" 보간에 그대로 쓰인다(EgovMessageConfig 의
# defaultValidator 가 이 번들을 validationMessageSource 로 연결한다).
# 자리표시자는 위치 인자({0})가 아니라 **제약 애노테이션의 속성명**({min}·{max})이어야 한다.
# Hibernate Validator 는 위치 인자를 해석하지 못해 화면에 리터럴 그대로 노출한다.
# 필드명은 메시지가 아니라 응답의 fieldErrors[].field 로 전달된다.
# =====================================================================
validation.required=필수 입력 항목입니다.
validation.size={min}자 이상 {max}자 이하로 입력해 주세요.
validation.size.max={max}자 이하로 입력해 주세요.
validation.pattern=형식이 올바르지 않습니다.
validation.email=올바른 이메일 형식을 입력해주세요.

# User Module
user.signup.success=회원가입이 완료되었습니다.
user.login.success=로그인에 성공했습니다.
user.error.not_found=사용자를 찾을 수 없습니다.
user.error.duplicate_id=이미 사용중인 아이디입니다.

# Board Module
board.post.success=게시글이 등록되었습니다.
board.delete.success=게시글이 삭제되었습니다.

# =====================================================================
# ErrorCode 키 매핑 (ErrorCode.getCode() -> 로케일 메시지)
# GlobalExceptionHandler 가 MessageSource 로 해석. 미등록 시 ErrorCode.getMessage()(영문) 폴백.
# =====================================================================

# CommonErrorCode (C0xx)
C001=입력값이 올바르지 않습니다.
C002=허용되지 않은 메서드입니다.
C003=대상 엔티티를 찾을 수 없습니다.
C004=서버 오류가 발생했습니다.
C005=잘못된 타입의 값입니다.
C006=접근이 거부되었습니다.
C007=리소스를 찾을 수 없습니다.
C008=이미 존재하는 리소스입니다.
C009=잘못된 입력입니다.
C010=접근 권한이 없습니다.
C011=지원하지 않는 미디어 타입입니다.
C012=잘못된 상태 전이입니다.
C013=동시 수정 충돌이 발생했습니다.
C014=다른 곳에서 사용 중이어서 삭제하거나 변경할 수 없습니다.

# CommonErrorCode (A0xx - 인증/인가)
A001=인증이 필요합니다.
A002=유효하지 않은 토큰입니다.
A003=만료된 토큰입니다.
A004=인증에 실패했습니다.
A005=로그인에 실패했습니다.
A006=로그인 정책 제한 (계정 잠금)
A007=로그인 정책 제한 (IP 불일치)
A008=로그인 정책 제한 (허용 시간 초과)

# CommonErrorCode (S0xx - 서버)
S001=서버 내부 오류가 발생했습니다.
S002=서버가 과부하 상태입니다.
S003=아직 제공되지 않는 기능입니다.

# UserErrorCode (U0xx)
U001=사용자를 찾을 수 없습니다.
U002=이미 사용 중인 아이디입니다.
U003=비밀번호가 올바르지 않습니다.
U004=인증 오류가 발생했습니다.
U005=리소스를 찾을 수 없습니다.
U006=입력값이 올바르지 않습니다.

# CodeErrorCode (CD0x)
CD01=이미 존재하는 코드입니다.
CD02=코드를 찾을 수 없습니다.

# BoardErrorCode (B0xx)
B001=게시판을 찾을 수 없습니다.
B002=게시글을 찾을 수 없습니다.
B003=댓글을 찾을 수 없습니다.
B004=게시글의 작성자가 아닙니다.
B005=게시글이 존재하여 게시판을 물리 삭제할 수 없습니다.
B006=먼저 논리 삭제를 수행해야 게시판을 물리 삭제할 수 있습니다.

# GlobalExceptionHandler 인라인 메시지 키
handler.optimistic_lock=데이터가 이미 수정되었습니다. 다시 시도해주세요.
handler.message_not_readable=잘못된 데이터 형식이거나 정의되지 않은 필드가 포함되어 있습니다.
handler.unrecognized_field=정의되지 않은 필드 ''{0}''가 포함되어 있습니다.
handler.constraint_invalid_value=허용되지 않는 값이 포함되어 있습니다. 입력값을 확인해 주십시오.
handler.data_integrity=요청이 기존 데이터 제약과 충돌합니다. 이미 존재하거나 사용 중인 값일 수 있습니다.
handler.service_unavailable=일시적으로 요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.
handler.internal_error=서버 내부 오류가 발생했습니다. 지속될 경우 관리자에게 문의해 주세요.
