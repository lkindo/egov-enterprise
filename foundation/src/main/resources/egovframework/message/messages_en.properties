# =====================================================================
# ErrorCode key mapping (ErrorCode.getCode() -> localized message)
# Resolved by GlobalExceptionHandler via MessageSource. Falls back to
# ErrorCode.getMessage() (English) when a key is missing.
# =====================================================================

# CommonErrorCode (C0xx)
C001=Invalid Input Value
C002=Method Not Allowed
C003=Entity Not Found
C004=Server Error
C005=Invalid Type Value
C006=Access is Denied
C007=Resource Not Found
C008=Duplicate Resource
C009=Invalid Input
C010=Access Denied
C011=Unsupported Media Type
C012=Invalid State Transition
C013=Concurrent Modification Conflict

# CommonErrorCode (A0xx - authentication/authorization)
A001=Unauthorized Access
A002=Invalid JWT Token
A003=Expired JWT Token
A004=Authentication Failed
A005=Login Failed
A006=Login Policy Restricted (Account Blocked)
A007=Login Policy Restricted (IP Mismatch)
A008=Login Policy Restricted (Time Out of Range)

# CommonErrorCode (S0xx - server)
S001=Internal Server Error
S002=Server Overload

# UserErrorCode (U0xx)
U001=User Not Found
U002=Duplicate User ID
U003=Invalid Password
U004=Authentication Error
U005=Resource Not Found
U006=Invalid Input Value

# CodeErrorCode (CD0x)
CD01=Duplicate Code
CD02=Code Not Found

# BoardErrorCode (B0xx)
B001=Board Not Found
B002=Article Not Found
B003=Comment Not Found
B004=Not the Owner of the Article
B005=Cannot delete board physically. It contains articles.
B006=Cannot delete board physically. It must be soft-deleted first.

# GlobalExceptionHandler inline message keys
handler.optimistic_lock=The data has already been modified. Please try again.
handler.message_not_readable=The request format is invalid or contains undefined fields.
handler.unrecognized_field=Contains an undefined field ''{0}''.
handler.internal_error=An internal server error occurred. If it persists, please contact the administrator.
