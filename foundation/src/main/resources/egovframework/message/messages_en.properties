# Common Messages
common.success=Request processed successfully.
common.error.internal=Internal server error occurred.
common.error.bad_request=Bad request.
common.error.not_found=Resource not found.
common.error.forbidden=Access denied.

# =====================================================================
# Validation Messages
# Consumed directly by Bean Validation message = "{key}" interpolation
# (EgovMessageConfig#defaultValidator wires this bundle as the
# validationMessageSource). Placeholders must be constraint attribute
# names ({min}/{max}), not positional arguments ({0}) - Hibernate
# Validator cannot resolve positional arguments and leaks them verbatim.
# The field name is carried by fieldErrors[].field, not by the message.
# =====================================================================
validation.required=This field is required.
validation.size=Must be between {min} and {max} characters.
validation.size.max=Must be at most {max} characters.
validation.pattern=The format is invalid.
validation.email=Please enter a valid email address.

# User Module
user.signup.success=Signup completed.
user.login.success=Login successful.
user.error.not_found=User not found.
user.error.duplicate_id=ID is already in use.

# Board Module
board.post.success=Post registered.
board.delete.success=Post deleted.

# =====================================================================
# ErrorCode key mapping (ErrorCode.getCode() -> localized message)
# Resolved by GlobalExceptionHandler via MessageSource. Falls back to
# ErrorCode.getMessage() (English) when a key is missing.
# =====================================================================

# CommonErrorCode (C0xx)
C001=Invalid Input Value
C002=Method Not Allowed
C003=Entity Not Found
C004=Server Error
C005=Invalid Type Value
C006=Access is Denied
C007=Resource Not Found
C008=Duplicate Resource
C009=Invalid Input
C010=Access Denied
C011=Unsupported Media Type
C012=Invalid State Transition
C013=Concurrent Modification Conflict
C014=Resource In Use

# CommonErrorCode (A0xx - authentication/authorization)
A001=Unauthorized Access
A002=Invalid JWT Token
A003=Expired JWT Token
A004=Authentication Failed
A005=Login Failed
A006=Login Policy Restricted (Account Blocked)
A007=Login Policy Restricted (IP Mismatch)
A008=Login Policy Restricted (Time Out of Range)

# CommonErrorCode (S0xx - server)
S001=Internal Server Error
S002=Server Overload
S003=Not Implemented

# UserErrorCode (U0xx)
U001=User Not Found
U002=Duplicate User ID
U003=Invalid Password
U004=Authentication Error
U005=Resource Not Found
U006=Invalid Input Value

# CodeErrorCode (CD0x)
CD01=Duplicate Code
CD02=Code Not Found

# BoardErrorCode (B0xx)
B001=Board Not Found
B002=Article Not Found
B003=Comment Not Found
B004=Not the Owner of the Article
B005=Cannot delete board physically. It contains articles.
B006=Cannot delete board physically. It must be soft-deleted first.

# GlobalExceptionHandler inline message keys
handler.optimistic_lock=The data has already been modified. Please try again.
handler.message_not_readable=The request format is invalid or contains undefined fields.
handler.unrecognized_field=Contains an undefined field ''{0}''.
handler.constraint_invalid_value=The request contains a value that is not allowed. Please check your input.
handler.data_integrity=The request conflicts with an existing data constraint. The value may already exist or be in use.
handler.service_unavailable=The request cannot be processed right now. Please try again shortly.
handler.internal_error=An internal server error occurred. If it persists, please contact the administrator.
