plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

// Gradle 5+부터는 annotationProcessor가 생성하는 소스는 기본적으로 build/generated/sources/annotationProcessor/java/main에 생성됩니다.
// IDE가 이 경로를 자동으로 인식하도록 맡기는 것이 클래스 중복 오류를 방지하는 가장 좋은 방법입니다.

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api libs.caffeine
    api 'com.bucket4j:bucket4j_jdk17-core:8.19.0'
    api 'com.warrenstrange:googleauth:1.5.0'

    // JWT
    api libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // API Docs / Validation
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.27'

    // QueryDSL
    api 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // Egovframe
    api (libs.egovframe.rte.fdl.cmmn) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    }
    api (libs.egovframe.rte.fdl.crypto) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    }
    api (libs.egovframe.rte.fdl.access) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    }
    api (libs.egovframe.rte.fdl.idgnr) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    }

    // Spring AI platform (v5.0 정식 가이드)
    api platform(libs.spring.ai.bom)
    api libs.spring.ai.openai
    api libs.spring.ai.ollama

    // Observability (OTEL)
    api libs.micrometer.tracing.bridge.otel
    api libs.opentelemetry.exporter.otlp
    api libs.micrometer.registry.prometheus
    api libs.spring.boot.admin.client
    // [2026-08-04 제거] loki-logback-appender
    //   W1-D2 에서 LOKI appender 를 logback-spring.xml 에서 뺐다 — 수집 스택(loki 서비스)이
    //   저장소에 존재하지 않아 매 로그 이벤트를 없는 호스트로 밀며 내부 오류를 상시 발생시켰다.
    //   그 뒤 이 의존성은 **참조 0건**이 됐다(전수 grep: 주석 4곳 외 appender·Java 사용처 없음).
    //   그럼에도 api 스코프라 전 모듈과 배포 아티팩트에 실려 있었다 —
    //   쓰지 않는 코드가 배포물에 남으면 공급망 표면만 넓힌다(Dependabot 알림 2건도 이것이었다).
    //   ⚠ 수집 스택을 세우기로 결정하면 이 의존성과 appender 를 **함께** 되살릴 것.
    //     (그 결정은 docs/04-operations/wave2-carryover.md §4 D-2 에 미결로 남아 있다.)

    // Utils
    api libs.icu4j
    api 'jakarta.servlet:jakarta.servlet-api'
    api libs.commons.lang3
    api libs.commons.io
    api libs.guava
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.github.ben-manes.caffeine:caffeine'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.flywaydb:flyway-core'
    
    // Testcontainers for integration testing with real PostgreSQL
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.jdbc
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly libs.postgresql
    
    // ArchUnit
    testImplementation libs.archunit.junit5
    testImplementation libs.archunit

    // Logging bridge for Egovframe (Commons Logging -> SLF4J)
    testRuntimeOnly 'org.slf4j:jcl-over-slf4j:2.0.18'

}

test {
    useJUnitPlatform()
    // ArchUnit 테스트 활성화
    // exclude '**/ArchunitTest.class'
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    // 커버리지 측정에서 제외할 클래스
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/Q*.class',
                '**/*Dto.class',
                '**/*Request.class',
                '**/*Response.class',
                '**/dto/**',
                '**/*Config*.class',
                '**/*Application.class',
                '**/*VO.class'
            ])
        }))
    }
}

// JaCoCo 커버리지 임계값 설정
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.60 // 최소 60% 커버리지 목표
            }
        }
        rule {
            enabled = true
            element = 'CLASS'
            
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50 // 클래스별 최소 50% 라인 커버리지
            }
            
            // 제외할 클래스 패턴
            excludes = [
                '*.Q*',
                '*.dto.*',
                '*Config*',
                '*Application*',
                '*VO'
            ]
        }
    }
}

// check 태스크에 커버리지 검증 포함
check.dependsOn jacocoTestCoverageVerification

bootJar { enabled = false }
jar { enabled = true }

// Querydsl generated source directory configuration for better IDE support
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
    delete querydslDir
}
