plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-websocket'
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api libs.caffeine


    // JWT
    api libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // Domain & JPA & QueryDSL
    api 'org.springframework.data:spring-data-envers'
    api 'org.hibernate.orm:hibernate-envers'
    api 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // API Docs / Validation / MapStruct
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.27'
    api 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Egovframe
    api libs.egovframe.rte.fdl.cmmn
    api libs.egovframe.rte.fdl.crypto
    api libs.egovframe.rte.fdl.access
    api libs.egovframe.rte.fdl.idgnr

    // Utils
    api libs.icu4j
    api 'jakarta.servlet:jakarta.servlet-api'
    api libs.commons.lang3
    api libs.commons.io
    api libs.guava
    api 'com.fasterxml.jackson.core:jackson-databind'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'com.tngtech.archunit:archunit:1.3.0'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.security:spring-security-test'
}

bootJar { enabled = false }
jar { enabled = true }

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
