spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    # 테스트 시 지연 로딩 문제 방지
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 파일 업로드 경로 (테스트용)
file:
  upload-dir: ./test-uploads

# 로깅 설정
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.company.project: DEBUG

# JWT 테스트 설정
jwt:
  secret: test-secret-key-for-unit-testing-purposes-only-12345678901234567890
  expiration: 3600000
