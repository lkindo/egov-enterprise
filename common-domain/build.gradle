dependencies {
    api project(':common-core')
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.data:spring-data-envers'
    api 'org.hibernate.orm:hibernate-envers:6.5.3.Final'
    
    // QueryDSL 5.1.0 (최신 안정 버전)
    api 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // DB Drivers
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.cubrid:cubrid-jdbc:11.3.2.0053'
    
    // Hibernate Community Dialects (CUBRID 지원)
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.0.Final'

    // Lombok - io.freefair.lombok 8.10 플러그인이 자동으로 처리함
}



bootJar { enabled = false }
jar { enabled = true }
