# 운영 배포 오버레이 (docker-compose.yml 위에 겹쳐 쓴다)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# [존재 이유 — W0-04] docker-compose.yml 은 CI E2E·ZAP 스캔·로컬 개발이 공유하는 개발 스택이다.
#   그 파일의 기본값을 prod 로 바꾸면 개발·CI 경로가 전부 깨지므로, 운영 형상은 오버레이로 분리한다.
#   이 오버레이 없이 배포하면 application-prod.yml(무기본값 fail-fast, actuator 축소, graceful shutdown,
#   쿠키 secure, swagger off)이 **한 번도 적용되지 않는다** — 잘 작성된 prod 설정을 배포 경로가 쓰지
#   않는 것이 이 저장소에서 가장 위험한 단일 지점이었다.
#
# ⚠ 필수: SPRING_APPLICATION_JSON 을 통째로 교체한다.
#   Spring 의 외부화 설정 우선순위상 SPRING_APPLICATION_JSON 은 OS 환경변수와 application-prod.yml 보다
#   **상위**다. base compose 의 JSON 이 datasource 를 db:5432/egov/egov123 으로 못 박고 있어,
#   이 키를 교체하지 않으면 DB_URL 을 주입해도 조용히 무시된 채 개발 DB 로 붙는다.

services:
  # [2026-09-02] 번들 DB 가 저장소에 커밋된 개발 자격으로 운영에서 뜨던 경로를 끊는다.
  #
  #   scripts/deploy.sh 는 `-f docker-compose.yml -f docker-compose.prod.yml` 로 올린다. 종전
  #   오버레이에는 db 블록이 아예 없어서, base 의 `POSTGRES_PASSWORD: egov123`(저장소에 커밋된
  #   값)이 그대로 운영 DB 의 비밀번호가 됐다. api 쪽만 DB_PASSWORD 를 fail-fast 로 요구하고
  #   있었으므로 "비밀번호를 주입했다"는 착각이 들기 쉬운 형태였다.
  #
  #   deploy.sh 가 이미 필수로 검증하는 같은 변수를 쓴다 — 새 변수를 만들지 않는다.
  #
  #   ⚠ POSTGRES_PASSWORD 는 **데이터 디렉터리 최초 초기화 때만** 반영된다. 이미 존재하는
  #     postgres_data 볼륨의 비밀번호는 이 값으로 바뀌지 않는다. 기존 배포의 자격을 바꾸려면
  #     DB 안에서 ALTER ROLE 을 수행해야 한다(백업·복원 런북 참조).
  #
  #   ⚠ 현재 공식 deploy.sh와 백업·복원 런북은 이 번들 DB 전용이다. base의 api.depends_on.db도
  #     이 서비스를 요구하므로 외부 관리형 DB에서 db만 제외하는 형상은 지원되지 않는다.
  #     관리형 DB는 별도 compose profile과 공급자별 백업·복원 절차가 마련된 뒤 사용한다.
  db:
    environment:
      POSTGRES_USER: ${DB_USERNAME:?번들 DB의 DB_USERNAME 이 필요합니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?번들 DB의 DB_PASSWORD 가 필요합니다}

  api:
    environment:
      # 로그 수집기를 붙일 때는 `prod,json-logs` 로 바꿔 ECS JSON 콘솔 로그를 켠다
      #   (docs/04-operations/observability-baseline.md). prod 는 빼지 않는다.
      SPRING_PROFILES_ACTIVE: prod
      # base 의 datasource 고정 JSON 을 무력화한다. 운영 접속 정보는 아래 개별 변수로만 들어온다.
      SPRING_APPLICATION_JSON: '{"management":{"health":{"mail":{"enabled":false}}}}'
      # 운영에는 dev 시드(알려진 비밀번호)를 적재하지 않는다.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      # 미설정 시 기동 중단 — 저장소에 커밋된 dev 기본값으로 조용히 대체되는 경로를 원천 차단한다.
      DB_URL: ${DB_URL:?DB_URL 이 필요합니다}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME 이 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다}
      ALGORITHM_KEY: ${ALGORITHM_KEY:?ALGORITHM_KEY 가 필요합니다 (PII 암호화 마스터 키)}
      # 키 회전 창에서만 구키를 함께 주입한다. 재암호화·검증 후 반드시 제거한다.
      OLD_ALGORITHM_KEY: ${OLD_ALGORITHM_KEY}
      # 최초 기동 시 관리자 비밀번호 프로비저닝. 미설정이면 webmaster 계정은 로그인 불가 상태로 남는다.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD 가 필요합니다 (최초 관리자 비밀번호)}
      # [W1-13] SMTP 미설정이면 메일이 로그로만 나간다(LoggingEmailSender). 운영에서는 그 상태를 금지한다.
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST 가 필요합니다 (미설정 시 메일이 발송되지 않고 로그로만 남습니다)}
      # [W1-12] 관리(actuator) 포트. 컨테이너 네트워크 안에서만 접근한다 — ports 로 호스트에 노출하지 않는다.
      #   스크레이퍼는 egov-net 안에서 api:9090 으로 접근한다.
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-9090}
      MANAGEMENT_ADDRESS: ${MANAGEMENT_ADDRESS:-0.0.0.0}
      # [W1-J1] 신뢰 프록시 대역. 이 한 줄이 레이트리밋 키·로그인 잠금 IP 판정·감사 IP 를 함께 정한다.
      #   base 기본값(application.yml)은 개발 프록시를 위해 사설 대역을 포함하지만, 운영은 아래
      #   Next(frontend) 고정 주소 하나만 신뢰해 '홉이 전부 신뢰 대역' 분기를 실제 프록시 요청에 한정한다.
      #   ⚠ [2026-09-14 GAP-SEC-004] 종전 기본값은 egov-net 서브넷 전체(172.28.0.0/24)였다. 그러면 도커 게이트웨이도
      #     신뢰되어, 공개 포트로 직접 온 요청이 게이트웨이 주소로 들어오는 환경에서 X-Forwarded-For 위조로
      #     로그인 기록 IP 와 로그인 IP 제한이 우회됐다(격리 리허설 실측). 서브넷으로 되돌리지 말 것.
      #   ⚠ 비우면(XFF 전면 불신) 백엔드가 보는 IP 가 Next 서버 1개로 수렴해 레이트리밋이 전역 단일
      #     버킷이 된다. **용량 조정을 같은 배포에 넣지 말 것**(순서 지뢰 1).
      #   ⚠ 값은 docker-compose.yml 의 frontend `ipv4_address` 와 **함께** 바뀌어야 한다(둘이 갈라지면
      #     프록시가 신뢰 목록에서 빠져 모든 클라이언트 IP 가 Next 컨테이너 하나로 수렴한다).
      #     ConfigSafetyLinterTest 가 그 정합을 기계로 고정한다.
      #   ⚠ 앞단에 LB·nginx·CDN 을 추가하면 홉이 늘어난다 — 그때 이 값을 다시 판정할 것.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.10/32}
      # [2026-09-06 DEC-OPS-045] 읽은 알림 보존·정리(PD-NOTE-003). 스케줄러·삭제 술어·하한 가드는 이미
      #   있는데 이 두 줄이 없어 **호스트 환경에 값을 넣어도 컨테이너에 닿지 않았다** — compose 는 여기
      #   나열된 변수만 전달한다. 즉 인수처가 보존 개월을 정해도 이미지를 고치지 않고는 켤 수 없었다.
      #   기본은 그대로 꺼짐이다. [2026-09-24 DEC-OPS-128] 보존 기간은 앱 기본값 6개월이라 켤 때는
      #   ENABLED 하나면 된다 — 개월 수는 값 없이 전달해 호스트에 없으면 앱 기본값을 쓴다(종전 `:-0` 은
      #   기본값을 0 으로 덮어 켜도 하한 가드에 걸렸다). 읽지 않은 알림은 대상이 아니다.
      NOTIFICATION_RETENTION_ENABLED: ${NOTIFICATION_RETENTION_ENABLED:-false}
      NOTIFICATION_RETENTION_READ_MONTHS:
      # 로그 파기는 base 기본값이 켜짐(true)이라 전달이 없어도 동작한다. 인수처가 개월 수를 바꾸려면
      #   application-prod.yml 또는 SPRING_APPLICATION_JSON 으로 nuri.log.retention.* 을 준다.
      LOG_RETENTION_ENABLED: ${LOG_RETENTION_ENABLED:-true}
      # [2026-09-13] 운영 조정 변수 전달. 아래는 앱이 `${VAR:기본값}` 등으로 읽는데 이 오버레이에 줄이 없어
      #   **호스트에 값을 넣어도 컨테이너에 닿지 않던** 변수들이다(DEC-OPS-045 가 보존 변수 3개를 고친 뒤의 재발).
      #   예: 첨부 점검은 문서가 "ATTACHMENT_INTEGRITY_ENABLED 로 끈다" 고 안내했지만 끌 수 없었고,
      #   결재 결과 문자는 NOTIFICATION_SENDER_TEL 을 줄 방법이 없어 운영에서 늘 건너뛰었다.
      #
      #   ⚠ 형태는 **값 없는 `VAR:`** 로 둔다(docker compose v2.40 실측). 호스트/.env 에 변수가 없으면 컨테이너에도
      #     없어 앱 기본값이 그대로 산다. `VAR: ${VAR}` 로 쓰면 미설정 시 **빈 문자열이 설정돼** 앱 기본값이 사라진다.
      #     기본값을 여기에 복제하지 않는 이유도 같다 — 두 곳이 갈라지면 어느 쪽이 사실인지 알 수 없다.
      #   ⚠ 단, 호스트/.env 에 **빈 값으로 설정**하면(`VAR=`) 이 형태도 "" 를 전달해 앱 기본값을 덮는다
      #     (예: `ATTACHMENT_INTEGRITY_ENABLED=` 는 점검을 끄고, `LOGIN_MAX_FAILURES=` 는 기동 실패). 기본값을
      #     쓰려면 .env 에서 줄 자체를 두지 않는다.
      #   ⚠ 이 목록과 앱이 읽는 변수(application*.yml·globals.properties·@Value·완화 바인딩 선언)의 양방향 정합은
      #     scripts/deploy-env-forwarding-contract.test.mjs 가 고정한다. 새 변수를 읽게 하면 여기에도 추가하거나,
      #     전달하지 않는 사유를 그 계약에 남겨야 한다. 앱이 더 이상 읽지 않는 전달도 red 다.
      MAIL_FROM:
      MAIL_PORT:
      # application-prod.yml 이 인증 릴레이 자격을 Spring 완화 바인딩으로 받으라고 안내하는 두 변수
      #   (placeholder 가 없어 계약의 API_FORWARDED_WITHOUT_PLACEHOLDER 선언이 존재를 강제한다).
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      NOTIFICATION_SENDER_TEL:
      CORS_ORIGIN_1:
      CORS_ORIGIN_2:
      LOGIN_MAX_FAILURES:
      LOGIN_LOCK_MINUTES:
      # [2026-09-14 ADR-0019] 요청 제한 한도. 낮추는 순서는 application.yml 의 rate-limit 주석을 따른다.
      RATE_LIMIT_REQUESTS_PER_MINUTE:
      RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:
      JWT_REFRESH_TOKEN_VALIDITY_MS:
      DB_POOL_CONNECTION_TIMEOUT_MS:
      DB_POOL_MAX_SIZE:
      DB_POOL_MIN_IDLE:
      FILE_UPLOAD_MAX_SIZE:
      FILE_UPLOAD_MAX_REQUEST_SIZE:
      # 첨부 정기 점검(readiness-followups.md). 보고서 경로를 바꿀 때는 영속 볼륨(/app/storage) 안이어야
      #   컨테이너 재생성 후에도 결과가 남는다(기본값 storage/diagnostics/... 는 WORKDIR /app 기준).
      ATTACHMENT_INTEGRITY_ENABLED:
      ATTACHMENT_INTEGRITY_CRON:
      ATTACHMENT_INTEGRITY_MAX_ITEMS:
      ATTACHMENT_INTEGRITY_REPORT_DIRECTORY:
    # [W1-12 보완] 관리 포트를 분리하면 /actuator/** 는 **8080 에서 사라진다**(Spring Boot 가
    #   management 를 별도 웹서버 컨텍스트로 띄운다). base compose 의 헬스체크는
    #   `http://localhost:8080/actuator/health` 를 찌르므로, 오버레이를 얹은 운영 배포에서만
    #   조용히 404 를 받아 **retries 10회를 소진한 뒤 컨테이너가 영구 unhealthy** 가 된다.
    #   그러면 `depends_on: api: condition: service_healthy` 인 frontend 가 **아예 기동하지 않는다** —
    #   즉 포트 분리 자체가 운영 배포를 세우는 결함이 된다(개발 스택은 포트를 안 나누므로 무증상이라
    #   로컬에서는 절대 재현되지 않는다). 헬스체크 대상을 관리 포트로 함께 옮긴다.
    #   `${MANAGEMENT_PORT:-9090}` 은 위 environment 항목과 **같은 호스트 환경/.env 값**으로 compose 가
    #   파싱 시점에 치환하므로 둘이 어긋나지 않는다(컨테이너 안 셸 변수를 쓰려면 `$$` 가 필요한데,
    #   그렇게 하면 오히려 두 값이 갈릴 수 있어 일부러 쓰지 않는다).
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${MANAGEMENT_PORT:-9090}/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
    # [W1-13 보완] 운영 로그는 파일 appender 폐기 후 **stdout 단독**이다(logback-spring.xml).
    #   수집 스택이 없으면 컨테이너 재생성 시 로그가 소실될 수 있다. 외부 보존 스택 선택은
    #   docs/04-operations/pending-decisions.md 의 PD-OPS-001 이 관리한다. 그 결정 전에도
    #   **무제한 증가**만은 막는다 —
    #   json-file 드라이버는 기본이 무제한이라 장수명 컨테이너가 디스크를 채운다.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # [2026-09-13] 프런트 서버 런타임 변수 전달. `NEXT_PUBLIC_*` 는 빌드 시점에 번들에 인라인되므로 여기서
  #   바꿀 수 없고, 아래는 서버가 요청 시점에 읽는 변수다. 형태가 값 없는 `VAR:` 인 이유는 api 블록 주석과 같다.
  #   ⚠ ALLOW_INSECURE_LOOPBACK_AUTH_COOKIE 는 넣지 않는다(ADR-0010 — loopback 개발 전용).
  #     scripts/deploy-env-forwarding-contract.test.mjs 가 이 오버레이에 나타나면 red 로 막는다.
  frontend:
    # [2026-09-14 ADR-0019] 브라우저 진입점은 아래 edge 하나다. base 가 공개하는 3000 을 비운다 —
    #   compose 는 ports 를 이어 붙이므로 오버레이에서 목록을 덮어쓰려면 `!reset` 이 필요하다.
    #   Next 가 직접 공개되면 클라이언트가 보낸 X-Forwarded-For 가 그대로 남아(Next 는 없을 때만 채운다)
    #   아래 TRUSTED_EDGE_PROXY 로 켠 IP 전달이 위조 경로가 된다.
    ports: !reset []
    environment:
      # [2026-09-14 ADR-0019] edge 가 X-Forwarded-For 를 접속 주소로 덮어쓰는 형상에서만 켠다. 켜면 로그인·재발급·
      #   로그아웃 BFF 와 서버 측 API 호출이 그 값을 백엔드로 넘긴다. base compose(개발·E2E)에서는 켜지 않는다.
      TRUSTED_EDGE_PROXY: "true"
      # 브랜드 프로필·밀도 축(DEC-OPS-015, docs/03-guides/design-tokens.md). 미설정이면 기본 프로필·comfortable.
      BRAND_THEME:
      UI_DENSITY:
      LOG_LEVEL:
      # BACKEND_ACTUATOR_URL 은 전달하지 않는다 — 현재 호출 경로(클라이언트 조회 → /actuator rewrite)에서 읽히지 않고,
      #   운영의 actuator 404 는 관리 포트 분리(W1-12)의 의도된 형상이다. 9090 연결은 next.config 가 금지한 권한 완화다.

  # [2026-09-14 ADR-0019 · GAP-SEC-004] 클라이언트 IP 신뢰 경계. 설정과 이유는 config/edge/default.conf.template 머리주석.
  #   api 8080 은 그대로 공개한다(브라우저 직접 도달 형상 — docker-compose.yml egov-net 주석). 직접 온 요청은
  #   백엔드가 신뢰하는 Next 고정 주소(TRUSTED_PROXIES)가 아니므로 X-Forwarded-For 를 무시하고 접속 주소를 쓴다.
  #   ⚠ 이 성질은 신뢰 목록이 /32 일 때만 성립한다 — 서브넷을 신뢰하던 종전 형상은 게이트웨이 경유 직접 요청에서
  #     위조가 통했다(2026-09-14 리허설 실측, GAP-SEC-004).
  edge:
    # nginx 1.30.4 stable-alpine, 비루트(uid 101), 컨테이너 포트 8080.
    image: nginxinc/nginx-unprivileged@sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
    container_name: egov-edge
    restart: always
    ports:
      - "${EDGE_HTTP_PORT:-80}:8080"
    environment:
      # 앞단 LB·TLS 종단 대역. 없으면 루프백(= 아무 상위도 신뢰하지 않음).
      EDGE_TRUSTED_UPSTREAM: ${EDGE_TRUSTED_UPSTREAM:-127.0.0.1/32}
      EDGE_CLIENT_MAX_BODY_SIZE: ${EDGE_CLIENT_MAX_BODY_SIZE:-50m}
      # 템플릿 치환을 EDGE_* 로 한정한다 — nginx 변수($remote_addr 등)를 환경변수로 오인해 지우지 않게 한다.
      NGINX_ENVSUBST_FILTER: "^EDGE_"
    volumes:
      - ./config/edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/__edge/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - egov-net
