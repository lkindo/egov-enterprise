plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.13' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.12.2' apply false
    id 'jacoco'
    id 'org.owasp.dependencycheck' version '12.1.0'
    id 'info.solidsoft.pitest' version '1.19.0' apply false
}

allprojects {
    group = 'nuri'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        google()
        maven { url 'https://maven.egovframe.go.kr/maven/' }
    }

    apply plugin: 'jacoco'
    apply plugin: 'org.owasp.dependencycheck'
    
    jacoco {
        toolVersion = "0.8.14"
    }
    
    // OWASP Dependency-Check 설정
    dependencyCheck {
        // 분석 실패 기준 CVE 스코어 (0-10, 7 이상은 High)
        failBuildOnCVSS = 7
        
        // 분석 제외 의존성
        skipConfigurations = [
            'compileOnly',
            'testCompileOnly',
            'annotationProcessor',
            'testAnnotationProcessor'
        ]
        
        // [W0-09] NVD API 키 — 종전에는 주석 처리돼 있었다.
        //   플러그인은 환경변수를 스스로 읽지 않으므로, **시크릿만 등록하는 조치는 무효**였다.
        //   키가 없으면 익명 레이트리밋(50req/30s)에 걸려 NVD 동기화가 수십 분으로 늘어나고,
        //   그 결과 스캔이 사실상 완주하지 못해 리포트 0건 상태가 지속됐다.
        //   빈 문자열 주입 시 401 이 되므로 값이 있을 때만 설정한다(로컬/오프라인 보호).
        nvd {
            def key = System.getenv('NVD_API_KEY')
            if (key) {
                apiKey = key
            }
        }

        // 리포트 설정
        //   XML 추가 근거: dependency-check.yml 의 업로드 스텝이 dependency-check-report.xml 을 참조하는데
        //   HTML/JUNIT 만으로는 그 파일이 생성되지 않아 XML 아티팩트가 항상 비어 있었다.
        formats = ['HTML', 'JUNIT', 'XML']
        
        // 스캔 제외 파일 패턴
        suppressionFile = file('config/dependency-check/suppressions.xml').absolutePath
        
        // 데이터베이스 디렉토리 설정
        data.directory = file("${rootProject.buildDir}/dependency-check-cache")
        
        
        /* 
        // 스캔 대상 아키텍처
        analyzers {
            // Jar 파일 분석
            jarEnabled = true
            // Maven Central 검색 사용
            centralEnabled = true
            // NVD 데이터베이스 사용
            nvdEnabled = true
        }
        */
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperty "spring.main.allow-bean-definition-overriding", "true"
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'info.solidsoft.pitest'
    apply plugin: 'maven-publish'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
        repositories {
            mavenLocal()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-parameters" << "-Werror" << "-Xlint:unchecked" << "-Xlint:deprecation"
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        useJUnitPlatform()
        systemProperties System.properties
        // [CI 패리티] CI 러너는 UTC 다. `systemProperties System.properties` 가 데몬의 user.timezone(KST)을
        // 그대로 넘기기 때문에, 로컬에서는 KST 로 통과하고 CI(UTC)에서만 깨지는 시간대 의존 테스트가
        // 로컬에서 드러나지 않는다 — 2026-07-26 LoginPolicyManageServiceTest 가 정확히 그 형태였다.
        // 테스트 JVM 시간대를 UTC 로 고정해 로컬 실행을 CI 와 동일 조건으로 만든다.
        // (KST 가 의미상 필요한 테스트는 코드에서 ZoneId 를 명시할 것. 임시 변경: -Dtest.timezone=Asia/Seoul)
        // 근거: 전 모듈 299클래스/1591테스트를 UTC 로 실행해 실패 0 확인 후 도입.
        systemProperty 'user.timezone', System.getProperty('test.timezone') ?: 'UTC'
        maxHeapSize = "6144m"
        ignoreFailures = false
        
        // Jacoco 명시적 설정: 하위 프로젝트별 물리적 build 폴더 하위에 격리하여 생성 강제
        jacoco {
            enabled = true
            destinationFile = layout.buildDirectory.file("jacoco/test.exec").map { it.asFile }.get()
        }
        
        finalizedBy 'jacocoTestReport'
    }

    // 실행 시(bootRun 포함) UTF-8 인코딩 강제 설정
    def tracePinned = project.findProperty('trace-pinned') ?: System.getenv('TRACE_PINNED')
    tasks.withType(JavaExec).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty 'sun.jnu.encoding', 'UTF-8'
        // 가상 스레드 pinning 관측(기본 off): -Ptrace-pinned=full 또는 TRACE_PINNED=full 로 활성화.
        // JDK 21 진단 플래그로, 가상 스레드가 캐리어에 고정될 때 스택트레이스를 stdout 에 출력한다.
        if (tracePinned) {
            systemProperty 'jdk.tracePinnedThreads', (tracePinned == 'true' ? 'full' : tracePinned)
        }
    }

    // [2026-08-04 CVE 상환] BOM 이 주는 것보다 더 최신이 필요한 항목만 개별 상향한다.
    //   ⚠ 이 오버라이드는 "BOM 을 더 올리면 지워야 하는" 부채다. Boot 3.4.x 라인이
    //   해당 버전을 따라잡으면 아래 두 줄을 제거하고 BOM 판정에 되돌린다.
    //
    //   실측 근거(2026-08-04, `dependencyInsight` + Dependabot 알림의 first_patched_version 대조):
    //     · tomcat-embed-core — Boot 3.4.13 은 10.1.50 을 준다. 그런데 열린 알림 중
    //       critical 1건이 >=10.1.55, high 3건이 >=10.1.52/54/55 를 요구한다.
    //       즉 **BOM 을 최신 패치로 올려도 최상위 심각도가 남는다.** 10.1.57 로 상향.
    //     · jackson — BOM 은 2.18.5, 열린 high 2건(jackson-core/databind)이 >=2.18.8 요구. 2.18.9 로 상향.
    //   (반대로 spring-security 는 BOM 이 6.4.13 을 주므로 critical >=6.4.6 이 BOM 만으로 해소된다 —
    //    필요 없는 오버라이드를 늘리지 않기 위해 확인 후 제외했다.)
    ext['tomcat.version'] = '10.1.57'
    ext['jackson-bom.version'] = '2.18.9'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.13"
            mavenBom "org.junit:junit-bom:5.12.2"
        }
    }

    configurations.all {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
        
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.junit.platform') {
                details.useVersion '1.11.4'
            }
            if (details.requested.group.startsWith('org.junit.jupiter')) {
                details.useVersion '5.11.4'
            }
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation libs.springdoc.openapi
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        implementation 'com.google.code.findbugs:jsr305:3.0.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // PITest (점진적 Mutation Testing) 설정
    pitest {
        junit5PluginVersion = '1.2.1'
        // 증분식(Incremental) 뮤테이션 분석: PIT_TARGET_CLASSES / PIT_TARGET_TESTS 환경변수로
        // 리팩토링 대상 클래스에 한정할 수 있다 (기본값 'nuri.*' = 전체). 백엔드 헌법 제16조 '--targetClasses 한정' 이행.
        targetClasses = (System.getenv('PIT_TARGET_CLASSES') ?: 'nuri.*').split(',').collect { it.trim() }
        targetTests = (System.getenv('PIT_TARGET_TESTS') ?: 'nuri.*').split(',').collect { it.trim() }
        outputFormats = ['HTML', 'XML']
        threads = 4

        // 도메인 분석과 무관한 설정/예외/DTO 보일러플레이트 제외
        excludedClasses = [
            "nuri.foundation.core.config.*",
            "nuri.foundation.core.exception.*",
            "nuri.api.config.*",
            "nuri.business.support.*",
            "nuri.foundation.support.*",
            "**.*Dto",
            "**.*VO",
            "**.*DAO",
            "**.*Mapper",
            "**.*Request",
            "**.*Response",
            "**.*Entity",
            "**.*Q*.class",
            "**.*Q*Entity.class"
        ]

        // Incremental Mutation Analysis 활성화 (분석 속도 10배 향상)
        historyInputLocation = file("${project.buildDir}/pitest/pitHistory.txt")
        historyOutputLocation = file("${project.buildDir}/pitest/pitHistory.txt")

        // 백엔드 헌법 제16조 (핵심 서비스 Mutation Score 75% 이상) — 임계값을 헌법 기준과 75% 로 통일
        // 현행은 리포트 전용(STRICT_MUTATION 미설정 → threshold 0, 미달이 빌드 파손 안 함).
        // 실측 스코어 ≥75% 확인 후 STRICT_MUTATION=true 로 전환하면 75% 하드 게이트가 강제된다.
        mutationThreshold = System.getenv('STRICT_MUTATION') == 'true' ? 75 : 0
    }
}

// 통합 리포트 태스크 (현대적인 Gradle 9 멀티프로젝트 집계 설정)
tasks.register('jacocoRootReport', JacocoReport) {
    description = 'Generates an aggregate report from all subprojects using explicit paths'
    group = 'Verification'

    // 모든 하위 프로젝트 및 루트 프로젝트의 테스트 태스크에 의존.
    // 단 schemaValidationTest 는 **Docker 필수**라 제외한다 — 포함하면 커버리지 집계(`make coverage`)가
    // Docker 없는 환경에서 실패하고, 커버리지에 기여하지도 않는다(컨텍스트 부팅 검증 성격).
    // 2026-07-26: 커스텀 Test 태스크를 추가하자 이 collect 가 자동으로 끌어가 발생한 회귀를 교정.
    def coverageTests = { p -> p.tasks.withType(Test).matching { it.name != 'schemaValidationTest' } }
    dependsOn subprojects.collect(coverageTests) + tasks.named('test')
    mustRunAfter subprojects.collect(coverageTests) + tasks.named('test')
 
    // 소스 디렉토리 통합 (물리적 경로로 명시)
    sourceDirectories.setFrom(subprojects.collect { 
        file("${it.projectDir}/src/main/java") 
    })
 
    // 클래스 디렉토리 통합 및 필터링
    classDirectories.setFrom(subprojects.collect { 
        fileTree(dir: "${it.projectDir}/build/classes/java/main", exclude: [
            "**/Q*.class",
            "**/Q*Entity.class",
            "**/*Request.class",
            "**/*Response.class",
            "**/*Dto.class",
            "**/dto/**",
            "**/*Config.class",
            "**/*Application.class",
            "**/*VO.class",
            "**/*DAO.class",
            "**/*Mapper.class",
            "**/*MapperImpl.class",
            "**/*Initializer.class",
            "**/*Advice.class"
        ])
    })
 
    // 실행 데이터(.exec) 통합: 모든 하위 프로젝트가 루트의 단일 파일로 모이는 현상 활용
    executionData.setFrom(file("${rootProject.buildDir}/jacoco/test.exec"))

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/aggregated")
    }
}

// 루트 프로젝트 JaCoCo 커버리지 검증
tasks.register('jacocoRootCoverageVerification', JacocoCoverageVerification) {
    description = 'Verifies code coverage for all subprojects'
    group = 'Verification'
    
    dependsOn jacocoRootReport
    
    violationRules {
        rule {
            // 전체 프로젝트 최소 커버리지 목표
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50 // 50% 이상 목표
            }
        }
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// 게이트 실행 경로 (GEMINI.md §0.7-H5 — "게이트는 실행 경로가 있어야 게이트다")
// ─────────────────────────────────────────────────────────────────────────────

/**
 * 공유 git 훅 자동 설치. 훅은 `core.hooksPath` 로 활성화되는데 이 설정은 **클론별 로컬 값이라
 * 커밋되지 않는다** — 즉 새 클론·새 operator 환경에서는 모든 게이트가 조용히 꺼진 상태로 시작한다.
 * 빌드 시 미설정일 때만 설정하며, 이미 다른 값이면 존중한다.
 * 비활성화: NO_HOOK_INSTALL=1 (또는 `git config core.hooksPath ''` 로 빈 값 지정)
 */
tasks.register('installGitHooks') {
    description = '공유 git 훅(.githooks)을 core.hooksPath 에 연결 — 미설정 클론에서 게이트가 꺼지는 것을 방지'
    group = 'Verification'
    onlyIf { System.getenv('NO_HOOK_INSTALL') == null && file("${rootDir}/.git").exists() }
    doLast {
        // Gradle 9 에서 Project.exec 가 제거돼 ProcessBuilder 를 직접 쓴다.
        def git = { List<String> args ->
            def p = new ProcessBuilder(['git'] + args).directory(rootDir).redirectErrorStream(true).start()
            def out = p.inputStream.text.trim()
            [code: p.waitFor(), out: out]
        }
        def current = git(['config', '--get', 'core.hooksPath'])
        if (current.code != 0 || current.out.isEmpty()) {
            def set = git(['config', 'core.hooksPath', '.githooks'])
            if (set.code == 0) {
                logger.lifecycle('[installGitHooks] core.hooksPath=.githooks 설정 — pre-commit/pre-push 게이트 활성화')
            } else {
                logger.warn("[installGitHooks] 설정 실패: ${set.out}")
            }
        } else {
            logger.info("[installGitHooks] core.hooksPath 가 이미 '${current.out}' 로 설정돼 있어 변경하지 않음")
        }
    }
}

/**
 * 로컬 전체 게이트. CI 과금차단 상태에서 pre-push 는 컴파일·계약·하네스까지만 본다
 * (business 모듈 테스트는 약 8분이라 push 마다 돌릴 수 없다 — 2026-07-26 실측).
 * 병합·릴리스 전에 이 태스크로 한 번 전수 확인한다.
 */
tasks.register('localGate') {
    description = '로컬 전체 게이트: 하네스 린터 + 실PG 스키마 검증(Docker) + 전 모듈 테스트 (약 10분)'
    group = 'Verification'
    dependsOn ':api-server:harnessTest', ':api-server:schemaValidationTest',
            ':business-core:test', ':business-app:test', ':foundation:test'
}

// 모든 빌드에서 훅 설치 상태를 보정한다 — "새 클론에서 게이트가 조용히 꺼져 있는" 상태를 없앤다.
subprojects {
    tasks.matching { it.name == 'compileJava' }.configureEach { dependsOn ':installGitHooks' }
}
