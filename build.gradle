plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.12.2' apply false
    id 'jacoco'
}

allprojects {
    group = 'com.company'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        google()
        maven { url 'https://maven.egovframe.go.kr/maven/' }
    }

    apply plugin: 'jacoco'
    jacoco {
        toolVersion = "0.8.14"
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.14"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-parameters"
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        useJUnitPlatform()
        systemProperties System.properties
        maxHeapSize = "6144m"
        ignoreFailures = true
        
        finalizedBy 'jacocoTestReport'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.1"
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation libs.springdoc.openapi
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        implementation 'com.google.code.findbugs:jsr305:3.0.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }
}

// 통합 리포트 태스크 (Gradle 9 지향 현대화 버전)
tasks.register('jacocoRootReport', JacocoReport) {
    description = 'Generates an aggregate report from all subprojects using Lazy Configuration API'
    group = 'Verification'

    // 모든 서브프로젝트의 테스트 태스크에 의존
    def subprojectTests = subprojects.collect { it.tasks.withType(Test) }.flatten()
    dependsOn subprojectTests

    // 소스 디렉토리 통합 (Lazy API 사용)
    sourceDirectories.from = objects.fileCollection().from(subprojects.sourceSets.main.allSource.srcDirs)

    // 클래스 디렉토리 통합 및 필터링
    classDirectories.from = objects.fileCollection().from(subprojects.sourceSets.main.output.classesDirs).collect {
        fileTree(dir: it, exclude: [
            "**/Q*.class",
            "**/Q*Entity.class",
            "**/*Request.class",
            "**/*Response.class",
            "**/*Dto.class",
            "**/dto/**",
            "**/*Config.class",
            "**/*Application.class",
            "**/*VO.class",
            "**/*DAO.class",
            "**/*Mapper.class",
            "**/*Initializer.class",
            "**/*Advice.class",
            "**/*RepositoryImpl.class"
        ])
    }

    // 실행 데이터(`.exec`) 통합
    executionData.from = objects.fileCollection().from(subprojects.jacocoTestReport.executionData).filter { it.exists() }

    reports {
        html.required = true
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/aggregated")
    }
}
