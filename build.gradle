plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.12.2' apply false
    id 'jacoco'
    id 'org.owasp.dependencycheck' version '12.2.2'
    id 'info.solidsoft.pitest' version '1.19.0' apply false
}

allprojects {
    group = 'nuri'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        google()
        maven { url = uri('https://maven.egovframe.go.kr/maven/') }
    }

    apply plugin: 'jacoco'
    apply plugin: 'org.owasp.dependencycheck'
    
    jacoco {
        toolVersion = "0.8.14"
    }
    
    // OWASP Dependency-Check 설정
    dependencyCheck {
        // 분석 실패 기준 CVE 스코어 (0-10, 7 이상은 High)
        failBuildOnCVSS = 7
        
        // 분석 제외 의존성
        skipConfigurations = [
            'compileOnly',
            'testCompileOnly',
            'annotationProcessor',
            'testAnnotationProcessor'
        ]
        
        // [W0-09] NVD API 키 — 종전에는 주석 처리돼 있었다.
        //   플러그인은 환경변수를 스스로 읽지 않으므로, **시크릿만 등록하는 조치는 무효**였다.
        //   키가 없으면 익명 레이트리밋(50req/30s)에 걸려 NVD 동기화가 수십 분으로 늘어나고,
        //   그 결과 스캔이 사실상 완주하지 못해 리포트 0건 상태가 지속됐다.
        //   빈 문자열 주입 시 401 이 되므로 값이 있을 때만 설정한다(로컬/오프라인 보호).
        nvd {
            def key = System.getenv('NVD_API_KEY')
            if (key) {
                apiKey = key
            }
        }

        // 리포트 설정
        //   XML 추가 근거: dependency-check.yml 의 업로드 스텝이 dependency-check-report.xml 을 참조하는데
        //   HTML/JUNIT 만으로는 그 파일이 생성되지 않아 XML 아티팩트가 항상 비어 있었다.
        formats = ['HTML', 'JUNIT', 'XML']
        
        // 스캔 제외 파일 패턴
        // [2026-08-09 경로 정정] 종전 `file(...)` 은 **각 서브프로젝트 디렉터리 기준**으로 해석된다.
        //   이 블록은 allprojects 안에 있으므로 모듈마다
        //     <module>/config/dependency-check/suppressions.xml
        //   을 찾았고, 그 파일은 **루트에만 존재**한다. 결과:
        //     Unable to read suppression file '.../migration-tool/config/dependency-check/suppressions.xml'
        //     -> InitializationException -> Analysis failed -> 모듈 4개 전부 FAILED
        //   그런데 워크플로 잡에 continue-on-error 가 붙어 있어 **실행은 초록으로 끝났다.**
        //   즉 "CVE 스캔이 돌고 있다" 고 믿는 동안 애플리케이션 의존성은 한 번도 검사되지 않았다
        //   (실측: 모듈 리포트 0 / 기대 4 — 루트 리포트만 생성).
        suppressionFile = rootProject.file('config/dependency-check/suppressions.xml').absolutePath
        
        // 데이터베이스 디렉토리 설정
        // [2026-08-04] 플러그인 12.2.x 부터 `data.directory` 가 File → String 프로퍼티로 바뀌었다.
        //   File 을 그대로 넣으면 루트 프로젝트 평가 단계에서
        //   "Cannot set the value of property 'directory' of type java.lang.String using an instance of
        //    type java.io.File" 로 **빌드 전체가 죽는다**. 경로 의미(절대경로)는 그대로 두고 타입만 맞춘다.
        data.directory = file("${rootProject.buildDir}/dependency-check-cache").absolutePath
        
        
        /* 
        // 스캔 대상 아키텍처
        analyzers {
            // Jar 파일 분석
            jarEnabled = true
            // Maven Central 검색 사용
            centralEnabled = true
            // NVD 데이터베이스 사용
            nvdEnabled = true
        }
        */
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperty "spring.main.allow-bean-definition-overriding", "true"
}

subprojects { subproject ->
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'info.solidsoft.pitest'
    apply plugin: 'maven-publish'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
        repositories {
            mavenLocal()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-parameters" << "-Werror" << "-Xlint:unchecked" << "-Xlint:deprecation"
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        useJUnitPlatform()
        // 데몬의 user.dir(항상 저장소 루트)를 Test JVM에 복사하면 JaCoCo의 상대 destfile이 모든
        // 모듈에서 root/build/jacoco/test.exec로 수렴한다. 나머지 -D 속성은 전달하되 작업 디렉터리는
        // Gradle Test 태스크의 프로젝트별 기본값을 유지한다.
        systemProperties System.properties.findAll { key, ignored -> key != 'user.dir' }
        // [CI 패리티] CI 러너는 UTC 다. `systemProperties System.properties` 가 데몬의 user.timezone(KST)을
        // 그대로 넘기기 때문에, 로컬에서는 KST 로 통과하고 CI(UTC)에서만 깨지는 시간대 의존 테스트가
        // 로컬에서 드러나지 않는다 — 2026-07-26 LoginPolicyManageServiceTest 가 정확히 그 형태였다.
        // 테스트 JVM 시간대를 UTC 로 고정해 로컬 실행을 CI 와 동일 조건으로 만든다.
        // (KST 가 의미상 필요한 테스트는 코드에서 ZoneId 를 명시할 것. 임시 변경: -Dtest.timezone=Asia/Seoul)
        // 근거: 전 모듈 299클래스/1591테스트를 UTC 로 실행해 실패 0 확인 후 도입.
        systemProperty 'user.timezone', System.getProperty('test.timezone') ?: 'UTC'
        maxHeapSize = "6144m"
        ignoreFailures = false
        
        // JaCoCo 플러그인의 기본 목적지(build/jacoco/<task>.exec)를 그대로 쓴다. 루트 스크립트에서
        // destinationFile을 강제하면 Groovy 클로저 위임 때문에 모든 하위 프로젝트가 루트 파일을
        // 공유할 수 있고, harnessTest가 전 모듈 결과를 덮어써 커버리지가 실행 순서에 따라 흔들린다.
        jacoco {
            enabled = true
        }
        
        finalizedBy 'jacocoTestReport'
    }

    // 실행 시(bootRun 포함) UTF-8 인코딩 강제 설정
    def tracePinned = project.findProperty('trace-pinned') ?: System.getenv('TRACE_PINNED')
    tasks.withType(JavaExec).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty 'sun.jnu.encoding', 'UTF-8'
        // 가상 스레드 pinning 관측(기본 off): -Ptrace-pinned=full 또는 TRACE_PINNED=full 로 활성화.
        // JDK 21 진단 플래그로, 가상 스레드가 캐리어에 고정될 때 스택트레이스를 stdout 에 출력한다.
        if (tracePinned) {
            systemProperty 'jdk.tracePinnedThreads', (tracePinned == 'true' ? 'full' : tracePinned)
        }
    }

    // [2026-08-04 CVE 상환] BOM 이 주는 것보다 더 최신이 필요한 항목만 개별 상향한다.
    //   ⚠ 이 오버라이드는 "BOM 을 더 올리면 지워야 하는" 부채다.
    //   해당 버전을 BOM 이 따라잡으면 그 줄을 제거하고 BOM 판정에 되돌린다.
    //
    //   실측 근거(2026-08-04, `dependencyInsight` + Dependabot 알림의 first_patched_version 대조):
    //     · tomcat-embed-core — Boot 3.4.13 은 10.1.50 을 준다. 그런데 열린 알림 중
    //       critical 1건이 >=10.1.55, high 3건이 >=10.1.52/54/55 를 요구한다.
    //       즉 **BOM 을 최신 패치로 올려도 최상위 심각도가 남는다.** 10.1.57 로 상향.
    //     · ~~jackson — BOM 은 2.18.5 … 2.18.9 로 상향.~~ → **상환 완료(2026-08-05)**, 아래 참조.
    //
    //   [2026-08-05 Boot 3.5.16 전환 시 재판정] 두 줄을 각각 실측해 갈랐다.
    //     · jackson-bom 오버라이드 **제거**. 3.5.16 BOM 이 이미 더 높은 버전을 주므로
    //       `2.18.9` 는 해석 결과를 바꾸지 못하는 무의미한 선언이었다(제거 전후 모두 2.21.4 로 해석).
    //       남겨두면 "BOM 보다 높이 고정한다" 는 원래 의도와 반대로, 다음에 BOM 이 더 오를 때
    //       **끌어내리는 하한**으로 작동할 위험만 남는다.
    //     · tomcat 오버라이드 **유지**. 3.5.16 BOM 은 10.1.55 를 준다 — 알려진 CVE 요구선(>=10.1.55)은
    //       충족하지만 현행 10.1.57 보다 낮다. 제거하면 2패치 하락이므로 아직 "따라잡았다" 고 볼 수 없다.
    ext['tomcat.version'] = '10.1.57'

    //   [2026-08-07 CVE 상환 2차] 열린 Dependabot 알림 84건을 **실제 해석 버전**으로 재판정한 결과
    //   조치가 필요한 maven 항목은 12건이었다(나머지는 §아래 census 참조). BOM 이 관리하는 3종을
    //   BOM 속성으로 상향한다. 근거는 알림의 first_patched_version 과 로컬 해석값의 대조이며,
    //   대상 버전이 Maven Central 에 실재함까지 확인했다(HTTP 200).
    //     · jackson  — BOM 2.21.4. `@JsonView`/대소문자 무시 역직렬화 우회 3건이 >=2.21.5 를 요구한다.
    //                  요청 본문 역직렬화 경로가 직격이라 도달 가능성이 높다.
    //     · log4j2   — BOM 2.24.3. 알림 4건이 >=2.25.3/2.25.4 를 요구한다.
    //                  ⚠ 우리는 logback 을 쓰고 log4j-slf4j2-impl 을 전역 exclude 하므로 도달성은 낮다.
    //                  그럼에도 log4j-core 자체는 egovframe-rte-fdl-logging 경유로 런타임에 실재한다
    //                  (실측: `log4j-core:2.25.3 -> 2.24.3` — BOM 이 오히려 끌어내리고 있었다).
    //     · opentelemetry — BOM 1.49.0. Unbounded Memory Allocation 2건이 >=1.62.0 을 요구한다.
    //                  1.49→1.62 는 minor 도약이라 micrometer-tracing-bridge-otel 과의 호환을
    //                  컴파일·테스트로 검증한 뒤에만 유지한다.
    ext['jackson-bom.version'] = '2.21.5'
    ext['log4j2.version'] = '2.25.4'
    ext['opentelemetry.version'] = '1.62.0'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.16"
            mavenBom "org.junit:junit-bom:5.12.2"
        }
    }

    // BOM 이 **관리하지 않는** 전이 의존성의 CVE 상환.
    // `force`/`useVersion` 이 아니라 constraint 의 `require` 를 쓴다 — require 는 하한(lower bound)
    // 이라 상위 라이브러리가 더 높은 버전을 요구하면 그쪽이 이긴다. force 로 박으면 다음에 상위가
    // 올라갈 때 우리가 **끌어내리는 상한**이 되는데, 그 함정은 이미 jackson 오버라이드에서 겪었다
    // (위 2026-08-05 주석 참조).
    dependencies {
        constraints {
            // egovframe-rte-fdl-property:5.0.0 경유. YAML/JSON 파싱 시 StackOverflowError.
            implementation('org.apache.commons:commons-configuration2') { version { require '2.15.0' } }
            // commons-email:1.6.0 경유의 레거시 javax 계열. SMTP 인젝션.
            // (Boot mail starter 가 쓰는 org.eclipse.angus:jakarta.mail 2.0.5 와는 별개 아티팩트다.)
            implementation('com.sun.mail:jakarta.mail') { version { require '1.6.8' } }
            // googleauth:1.5.0(TOTP 2FA) 경유. httpclient 4.x 는 Boot 3.x BOM 관리 대상이 아니다.
            implementation('org.apache.httpcomponents:httpclient') { version { require '4.5.13' } }
        }
    }

    configurations.all {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'

        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.junit.platform') {
                details.useVersion '1.11.4'
            }
            if (details.requested.group.startsWith('org.junit.jupiter')) {
                details.useVersion '5.11.4'
            }
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation rootProject.libs.springdoc.openapi
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        implementation 'com.google.code.findbugs:jsr305:3.0.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // PITest (점진적 Mutation Testing) 설정
    pitest {
        junit5PluginVersion = '1.2.1'
        // 증분식(Incremental) 뮤테이션 분석: PIT_TARGET_CLASSES / PIT_TARGET_TESTS 환경변수로
        // 리팩토링 대상 클래스에 한정할 수 있다 (기본값 'nuri.*' = 전체). 백엔드 헌법 제16조 '--targetClasses 한정' 이행.
        targetClasses = (System.getenv('PIT_TARGET_CLASSES') ?: 'nuri.*').split(',').collect { it.trim() }
        targetTests = (System.getenv('PIT_TARGET_TESTS') ?: 'nuri.*').split(',').collect { it.trim() }
        outputFormats = ['HTML', 'XML']
        threads = 4

        // 도메인 분석과 무관한 설정/예외/DTO 보일러플레이트 제외
        excludedClasses = [
            "nuri.foundation.core.config.*",
            "nuri.foundation.core.exception.*",
            "nuri.api.config.*",
            "nuri.business.support.*",
            "nuri.foundation.support.*",
            "**.*Dto",
            "**.*VO",
            "**.*DAO",
            "**.*Mapper",
            "**.*Request",
            "**.*Response",
            "**.*Entity"
            //
            // [2026-08-09 삭제] 종전 여기에 "**.*Q*.class" / "**.*Q*Entity.class" 두 항이 있었다.
            //   **두 항 모두 아무것도 제외하지 않았다.** PIT 는 파일 경로가 아니라 **클래스명**에
            //   글롭을 적용하는데, 클래스명에 ".class" 접미사가 붙는 일은 없기 때문이다.
            //   실증: 이 설정이 있는 상태로 돌린 PIT 리포트에 QCommonCode·QInstitutionCodeRecptnLog 가
            //   그대로 뮤테이션 대상으로 잡혀 있었다.
            //
            //   선언만 있고 집행되지 않는 통제는 **없는 것보다 나쁘다** — "생성 클래스는 제외된다" 는
            //   잘못된 믿음을 만든다(GEMINI.md §0.7-H5 의 정신). 그래서 지운다.
            //
            // ── 왜 "제대로 고치지" 않고 지우기만 하는가 ──────────────────────────────
            //   QueryDSL 생성 클래스(QCommonCode)와 **수기 작성 클래스**(QuerydslConfig,
            //   QueryCountGuard, QueryCountInspector, QueryCountGuardExtension,
            //   QuerydslDynamicPathLinterTest, QueryCountGuardrailIntegrationTest — 실측 6종)를
            //   가르려면 "Q + 대문자" 라는 조건이 필요한데, **PIT 글롭은 문자 클래스([A-Z])를
            //   지원하지 않아 표현할 수 없다.** "*.Q*" 로 뭉뚱그리면 위 수기 클래스들이
            //   조용히 뮤테이션에서 빠진다 — 그것이야말로 §0.7-H2 가 금지하는 신호 은폐다.
            //   (애노테이션 기반 필터도 불가: QueryDSL 이 붙이는 @Generated 는
            //    javax.annotation.processing 계열이라 **SOURCE 리텐션** 이고 바이트코드에 없다.)
            //
            //   남는 비용: 생성 Q클래스가 분모에 포함된다(실측 — code/user 저장소 스코프 62개 중 2개, 약 3%).
            //   이 노이즈는 **점수를 낮추는 쪽으로만** 작동한다. 비관적인 게이트는 안전하고
            //   낙관적인 게이트는 위험하므로, 정확도 3% 를 위해 오제외 위험을 지지 않는다.
            //
            //   굳이 제외하려면 조건이 있다: nuri.* 전량 PIT 1회 → ^Q[A-Z] 매칭 클래스 전수 census →
            //   전부 build/generated 소속임을 확인 → 패턴 확정 → **수기 클래스가 매칭되면 실패하는
            //   린터를 함께 신설.** 그 린터 없이는 하지 말 것.
        ]

        // Incremental Mutation Analysis 활성화 (분석 속도 10배 향상)
        historyInputLocation = file("${project.buildDir}/pitest/pitHistory.txt")
        historyOutputLocation = file("${project.buildDir}/pitest/pitHistory.txt")

        // 백엔드 헌법 제16조 (핵심 서비스 Mutation Score 75% 이상) — 임계값을 헌법 기준과 75% 로 통일
        //
        // [2026-08-08 정정] 종전 주석은 "현행은 리포트 전용" 이라고 적혀 있었다. **사실이 아니었다.**
        //   ci.yml 의 mutation-test 잡은 2026-07-26(커밋 2c756ca84)부터 두 스코프 모두
        //   STRICT_MUTATION: "true" 를 설정한다 — 즉 CI 에서는 75% 하드게이트가 강제돼 왔다.
        //   그 상태로 2026-08-08 에 mutation-test 가 required status check 로 등재됐으므로,
        //   이제 스코어가 75% 아래로 떨어지면 **병합이 막힌다.**
        //
        // 정리하면:
        //   · 로컬(`./gradlew :module:pitest`) — 환경변수 미설정 → threshold 0, 리포트 전용
        //   · CI(mutation-test 잡)        — STRICT_MUTATION=true → threshold 75, 미달 시 빌드 파손
        mutationThreshold = System.getenv('STRICT_MUTATION') == 'true' ? 75 : 0
    }
}

// 통합 리포트와 검증 태스크가 반드시 같은 분모·실행 데이터를 쓰도록 한 곳에 고정한다.
// 둘을 각자 선언하면 리포트는 수치를 내는데 verification은 입력 0건으로 SKIPPED 되는 false-green이 난다.
def jacocoAggregateExcludes = [
    "**/Q*.class",
    "**/Q*Entity.class",
    "**/*Request.class",
    "**/*Response.class",
    "**/*Dto.class",
    "**/dto/**",
    "**/*Config.class",
    "**/*Application.class",
    "**/*VO.class",
    "**/*DAO.class",
    "**/*Mapper.class",
    "**/*MapperImpl.class",
    "**/*Initializer.class",
    "**/*Advice.class"
]
def jacocoAggregateClassDirectories = subprojects.collect {
    fileTree(dir: "${it.projectDir}/build/classes/java/main", exclude: jacocoAggregateExcludes)
}
def jacocoAggregateExecutionData = files(subprojects.collect { subproject ->
    // FileTree는 실행 시 평가되어 api-server/build.gradle에서 뒤늦게 등록되는 harnessTest도 포함한다.
    // schemaValidationTest는 Docker 부팅 검증이고 위 coverageTests에서도 제외하므로 오래된 exec도 배제한다.
    subproject.fileTree(dir: "${subproject.projectDir}/build/jacoco",
            include: "*.exec", exclude: "schemaValidationTest.exec")
})

// 통합 리포트 태스크 (현대적인 Gradle 9 멀티프로젝트 집계 설정)
tasks.register('jacocoRootReport', JacocoReport) {
    description = 'Generates an aggregate report from all subprojects using explicit paths'
    group = 'Verification'

    // 모든 하위 프로젝트 및 루트 프로젝트의 테스트 태스크에 의존.
    // 단 schemaValidationTest 는 **Docker 필수**라 제외한다 — 포함하면 커버리지 집계(`make coverage`)가
    // Docker 없는 환경에서 실패하고, 커버리지에 기여하지도 않는다(컨텍스트 부팅 검증 성격).
    // 2026-07-26: 커스텀 Test 태스크를 추가하자 이 collect 가 자동으로 끌어가 발생한 회귀를 교정.
    def coverageTests = { p -> p.tasks.withType(Test).matching { it.name != 'schemaValidationTest' } }
    dependsOn subprojects.collect(coverageTests) + tasks.named('test')
    mustRunAfter subprojects.collect(coverageTests) + tasks.named('test')
 
    // 소스 디렉토리 통합 (물리적 경로로 명시)
    sourceDirectories.setFrom(subprojects.collect { 
        file("${it.projectDir}/src/main/java") 
    })
 
    // 클래스 디렉토리 통합 및 필터링
    classDirectories.setFrom(jacocoAggregateClassDirectories)
 
    // 실행 데이터(.exec) 통합: 프로젝트·Test 태스크별 격리 파일을 전부 합산한다.
    executionData.setFrom(jacocoAggregateExecutionData)

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/aggregated")
    }
}

// 루트 프로젝트 JaCoCo 커버리지 검증
tasks.register('jacocoRootCoverageVerification', JacocoCoverageVerification) {
    description = 'Verifies code coverage for all subprojects'
    group = 'Verification'
    
    dependsOn jacocoRootReport

    // JacocoCoverageVerification은 report의 입력을 자동 상속하지 않는다. 이 두 줄이 없으면
    // 태스크 이름은 CI/localGate에 있어도 실제 판정은 SKIPPED 된다(2026-08-12 실측).
    classDirectories.setFrom(jacocoAggregateClassDirectories)
    executionData.setFrom(jacocoAggregateExecutionData)
    
    violationRules {
        rule {
            // 전체 프로젝트 최소 커버리지 목표
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50 // 50% 이상 목표
            }
        }
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// 게이트 실행 경로 (GEMINI.md §0.7-H5 — "게이트는 실행 경로가 있어야 게이트다")
// ─────────────────────────────────────────────────────────────────────────────

/**
 * 공유 git 훅 자동 설치. 훅은 `core.hooksPath` 로 활성화되는데 이 설정은 **클론별 로컬 값이라
 * 커밋되지 않는다** — 즉 새 클론·새 operator 환경에서는 모든 게이트가 조용히 꺼진 상태로 시작한다.
 * 빌드 시 미설정일 때만 설정하며, 이미 다른 값이면 존중한다.
 * 비활성화: NO_HOOK_INSTALL=1 (또는 `git config core.hooksPath ''` 로 빈 값 지정)
 */
File gitRepositoryRoot = rootProject.layout.projectDirectory.asFile
Provider<String> hookInstallDisabled = providers.environmentVariable('NO_HOOK_INSTALL')
tasks.register('installGitHooks') {
    description = '공유 git 훅(.githooks)을 core.hooksPath 에 연결 — 미설정 클론에서 게이트가 꺼지는 것을 방지'
    group = 'Verification'
    onlyIf { !hookInstallDisabled.isPresent() && new File(gitRepositoryRoot, '.git').exists() }
    doLast {
        // Gradle 9 에서 Project.exec 가 제거돼 ProcessBuilder 를 직접 쓴다.
        def git = { List<String> args ->
            def p = new ProcessBuilder(['git'] + args).directory(gitRepositoryRoot).redirectErrorStream(true).start()
            def out = p.inputStream.text.trim()
            [code: p.waitFor(), out: out]
        }
        def current = git(['config', '--get', 'core.hooksPath'])
        if (current.code != 0 || current.out.isEmpty()) {
            def set = git(['config', 'core.hooksPath', '.githooks'])
            if (set.code == 0) {
                logger.lifecycle('[installGitHooks] core.hooksPath=.githooks 설정 — pre-commit/pre-push 게이트 활성화')
            } else {
                logger.warn("[installGitHooks] 설정 실패: ${set.out}")
            }
        } else {
            logger.info("[installGitHooks] core.hooksPath 가 이미 '${current.out}' 로 설정돼 있어 변경하지 않음")
        }
    }
}

/**
 * 프런트엔드 단위 테스트(vitest) 전수 실행.
 *
 * [2026-08-11 신설] 이 계층이 비어 있었다. pre-push 는 컴파일·tsc·lint·codegen·하네스만 돌고
 * vitest 는 **CI 에서만** 실행됐는데, CI 의 `e2e-tests` 잡은 `needs: [backend-build, frontend-build]`
 * 라 프런트 단위 테스트 1건이 깨지면 **E2E 3샤드가 통째로 skip** 된다.
 * 2026-08-10 에 실제로 그렇게 됐다(run 31369018355): blind-wait 래칫 1건 때문에 E2E 가
 * 한 번도 실행되지 않은 채 회차가 끝났다. 로컬에서 그것을 미리 볼 수단이 없었던 것이 문제다.
 *
 * 배치 근거(계층 모델): 전수 실행은 로컬 실측 약 147초로 pre-push(~2분) 예산에 넣기엔 크다.
 *   · pre-push  → `frontend/src/__tests__` 의 **저장소 불변식 게이트만**(실측 10초, .githooks/pre-push)
 *   · localGate → 여기, **전수**(147초)
 * 이 분리는 "빠른 관문은 규약 위반을, 느린 관문은 회귀를 잡는다" 는 기존 계층 원칙과 같다.
 */
File frontendProjectDir = rootProject.layout.projectDirectory.dir('frontend').asFile
tasks.register('frontendUnitTest') {
    description = '프런트엔드 vitest 전수 실행 (약 150초)'
    group = 'Verification'
    onlyIf { new File(frontendProjectDir, 'package.json').exists() }
    doLast {
        // Gradle 9 에서 Project.exec 가 제거돼 ProcessBuilder 를 직접 쓴다(installGitHooks 와 동일 방식).
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def cmd = isWindows ? ['cmd', '/c', 'pnpm', 'test'] : ['pnpm', 'test']
        logger.lifecycle('[frontendUnitTest] pnpm test (frontend)')
        def proc = new ProcessBuilder(cmd)
                .directory(frontendProjectDir)
                .redirectErrorStream(true)
                .start()
        proc.inputStream.eachLine { logger.lifecycle(it) }
        def code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("프런트엔드 단위 테스트 실패 (exit ${code}) — " +
                    'CI 의 frontend-build 가 죽고 e2e-tests 3샤드가 통째로 skip 됩니다.')
        }
    }
}

/**
 * 로컬 전체 게이트. pre-push 는 컴파일·계약·하네스와 프런트 불변식 게이트까지만 본다
 * (business 모듈 테스트는 약 8분, 프런트 vitest 전수는 약 150초라 push 마다 돌릴 수 없다).
 * 병합·릴리스 전에 이 태스크로 한 번 전수 확인한다.
 */
tasks.register('localGate') {
    description = '로컬 전체 게이트: 하네스 + 실PG + 전 모듈 테스트 + JaCoCo 50% + 프런트 vitest/coverage 래칫 (약 12분)'
    group = 'Verification'
    dependsOn ':api-server:harnessTest', ':api-server:schemaValidationTest',
            ':business-core:test', ':business-app:test', ':foundation:test',
            'jacocoRootCoverageVerification', 'frontendUnitTest'
}

// 모든 빌드에서 훅 설치 상태를 보정한다 — "새 클론에서 게이트가 조용히 꺼져 있는" 상태를 없앤다.
subprojects {
    tasks.matching { it.name == 'compileJava' }.configureEach { dependsOn ':installGitHooks' }
}
