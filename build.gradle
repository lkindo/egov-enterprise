plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.12.2' apply false
    id 'jacoco'
}

allprojects {
    group = 'com.company'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        google()
        maven { url 'https://maven.egovframe.go.kr/maven/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.12"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-parameters"
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.1"
        }
    }

    dependencies {
        implementation 'com.google.code.findbugs:jsr305:3.0.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        maxHeapSize = "6144m"
        maxParallelForks = 1
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty 'stdout.encoding', 'UTF-8'
        // Forward all system properties to the test JVM
        systemProperties System.getProperties()

        // Continue even if tests fail to generate coverage report
        ignoreFailures = true

        finalizedBy 'jacocoTestReport'
    }

    jacocoTestReport {
        dependsOn test
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: ['**/*Exception*', '**/dto/**'])
            }))
        }
        reports {
            xml.required = true
            csv.required = true
            html.required = true
            xml.outputLocation = file("${project.buildDir}/reports/jacoco/jacocoRootReport.xml")
            csv.outputLocation = file("${project.buildDir}/reports/jacoco/jacocoRootReport.csv")
            html.outputLocation = file("${project.buildDir}/reports/jacoco/html")
        }
    }
}

tasks.register("jacocoRootReport", JacocoReport) {
    group = "Verification"
    description = "Generates an aggregate JaCoCo report from all subprojects"

    dependsOn subprojects.test
    dependsOn subprojects.jacocoTestReport

    def classFiles = files()
    def sourceFiles = files()
    subprojects.each { subproject ->
        classFiles = classFiles.plus(subproject.sourceSets.main.output)
        sourceFiles = sourceFiles.plus(subproject.sourceSets.main.allSource.srcDirs)
    }

    classDirectories.setFrom(classFiles)
    sourceDirectories.setFrom(sourceFiles)

    // Aggregating execution data files (*.exec) from all subprojects
    executionData.setFrom(fileTree(dir: rootDir, include: "**/build/jacoco/*.exec"))

    doFirst {
        println "JACOCO_ROOT: ExecutionData: ${executionData.files}"
        println "JACOCO_ROOT: ClassDirs counts: ${classDirectories.files.size()}"
    }

    reports {
        xml.required = true
        xml.outputLocation = file("${rootDir}/coverage-report/jacocoRootReport.xml")
        csv.required = true
        csv.outputLocation = file("${rootDir}/coverage-report/jacocoRootReport.csv")
        html.required = true
        html.outputLocation = file("${rootDir}/coverage-report")
    }
}
