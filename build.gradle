plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.10.2' apply false
}

allprojects {
    group = 'com.company'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        google()
        maven { url 'https://maven.egovframe.go.kr/maven/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.12"
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-parameters"
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.1"
        }
    }

    dependencies {
        implementation 'com.google.code.findbugs:jsr305:3.0.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        maxHeapSize = "4096m"
        maxParallelForks = 1
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty 'stdout.encoding', 'UTF-8'
        // Forward all system properties to the test JVM
        systemProperties System.getProperties()
        
        jacoco {
            destinationFile = layout.buildDirectory.file("jacoco/${project.name}.exec").get().asFile
        }
        
        finalizedBy jacocoTestReport
        
    }

    jacocoTestReport {
        reports {
            xml.required = true
            csv.required = true
            html.required = true
        }
    }
}

tasks.register("jacocoRootReport", JacocoReport) {
    group = "Verification"
    description = "Generates an aggregate JaCoCo report from all subprojects"
    
    dependsOn subprojects.test
    
    additionalSourceDirs.from = files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.from = files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.from = files(subprojects.sourceSets.main.output)
    executionData.from = files(subprojects.tasks.jacocoTestReport.executionData)


    reports {
        xml.required = true
        csv.required = true
        html.required = true
        html.outputLocation = file("${rootDir}/coverage-report")
    }
}
