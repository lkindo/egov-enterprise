# QueryDSL — 유지보수 포크(io.github.openfeign.querydsl). 사유는 [versions].querydsl 주석 참조.
#   `jakarta` classifier 는 Jakarta EE 변형이다(실측: 5.6.1-jakarta.jar 의 jakarta/persistence 참조 382회).
querydsl-jpa = { group = "io.github.openfeign.querydsl", name = "querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { group = "io.github.openfeign.querydsl", name = "querydsl-apt", version.ref = "querydsl" }
# [2026-08-07 신설] spring-messaging — SimpMessagingTemplate(STOMP 알림 발행).
#   종전에는 선언이 없었고 spring-ai 가 전이로 공급하고 있었다. api-server 에는
#   spring-boot-starter-websocket 이 있지만 `implementation` 이라 하위 모듈로 전파되지 않는다.
#   실사용처는 business-app 의 NotificationService 와 business-core testFixtures 의 TestMessagingConfig 다.
#   버전은 Spring Boot BOM 관리(spring-framework 계열과 동일 라인).
spring-messaging = { group = "org.springframework", name = "spring-messaging" }
spring-boot-starter-aop = { group = "org.springframework.boot", name = "spring-boot-starter-aop" }

