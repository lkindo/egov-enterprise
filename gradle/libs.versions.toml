[versions]
egovframe = "5.0.0"
# [2026-08-04 제거] spring-boot = "3.4.1"
#   이 항목은 `version.ref = "spring-boot"` 참조가 **0건**인 死선언이었다(전수 grep 확인).
#   Boot 버전의 실제 출처는 build.gradle 두 곳뿐이다 —
#     · build.gradle:3   plugins { id 'org.springframework.boot' version ... }
#     · build.gradle:150 mavenBom "org.springframework.boot:spring-boot-dependencies:..."
#   여기 남겨 두면 "카탈로그가 Boot 버전의 SSOT" 로 읽혀, 이 값만 고치고 실제로는 아무것도
#   바뀌지 않는 상황이 생긴다(선언 범위 ≠ 실제 범위). 실제 출처가 아닌 선언은 지운다.
#   ⚠ 위 두 곳은 반드시 함께 바꿔야 한다.
spring-doc = "2.8.5"
# [2026-08-07 제거] spring-ai = "1.0.0-M5"
#   정식 이전 마일스톤(M5)이 foundation 의 `api` 스코프로 전 모듈·배포 아티팩트에 실려 있었으나
#   **프로덕션 사용처가 0건**이었다. 존재 이유가 전부 "억제"였다 —
#     · ApiServerApplication 이 OpenAiAutoConfiguration 을 명시적으로 exclude
#     · application-test.yml / application-e2e.yml 이 오토컨피그 3종을 각각 exclude
#     · 유일한 코드 참조인 TestAiConfig 는 ChatModel/EmbeddingModel 을 목(mock)으로 채우는
#       테스트 픽스처였고, 그마저 **참조처가 자기 선언뿐인 死코드**였다(전수 grep 1건).
#   전이로 spring-webflux 를 끌어와 Dependabot 알림 12건의 유입원이기도 했다(WebFlux 는
#   이 저장소가 쓰지 않는다 — Mono/Flux/WebClient 전수 grep 0건).
#   ⚠ AI 기능을 도입하기로 하면 정식 릴리스(1.0.0 GA 이상)로 되살릴 것. M5 를 그대로 되돌리지 말 것.
spring-boot-admin = "3.4.1"
postgresql = "42.7.13"
commons-io = "2.22.0"
commons-lang3 = "3.20.0"
commons-net = "3.13.0"
commons-email = "1.6.0"
guava = "33.6.0-jre"
icu4j = "75.1"
parsson = "1.1.9"
archunit = "1.4.2"
scribejava = "8.3.3"
xmlbeans = "5.3.0"
jdom2 = "2.0.6.1"
dbcp2 = "2.14.0"
jjwt = "0.13.0"
h2 = "2.4.240"
caffeine = "3.2.4"
testcontainers = "1.21.4"
mapstruct = "1.6.3"
# [2026-08-07 신설] querydsl — 원본 `com.querydsl` 에서 유지보수 포크로 이관한다.
#   원본은 5.1.0 이 마지막 릴리스이고 CVE-2024-49203(HQL injection via orderBy, CVSS 8.2)의
#   패치가 **영원히 나오지 않는다**(GHSA-6q3q-6v5j-h6vg, 취약 범위 `<= 5.1.0`, first_patched=null).
#   같은 advisory 가 포크에서는 5.6.1 / 6.10.1 로 패치돼 있다.
#   5.x 라인을 고른 이유: 자바 패키지가 `com.querydsl.*` 로 동일하고 `jakarta` classifier 가
#   존재해 **소스 94개 파일을 건드리지 않고 groupId 만 교체**된다(6.x/7.x 는 API 변경 동반).
querydsl = "5.6.1"
lombok-mapstruct-binding = "0.2.0"


[libraries]
