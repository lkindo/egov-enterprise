# Observability
# [2026-08-06] 명시 버전 제거 — Spring Boot BOM 이 관리한다(실측: 1.5.12 로 해석).
#   종전 카탈로그 값 1.4.3 은 BOM(1.5.12)에 밀려 이미 무효였고, Dependabot 이 제안한 1.7.0 은
#   반대로 BOM 을 이겨(Gradle 최고버전 해석) Boot 3.5 관리 범위를 벗어난다.
micrometer-tracing-bridge-otel = { group = "io.micrometer", name = "micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { group = "io.opentelemetry", name = "opentelemetry-exporter-otlp" }

