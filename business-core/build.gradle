plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':foundation')

    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api libs.spring.retry
    api libs.spring.boot.starter.aop
    
    // Domain & JPA & QueryDSL & Envers & Security
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.data:spring-data-envers'
    api 'org.hibernate.orm:hibernate-envers'
    // [2026-08-07 이관] com.querydsl -> io.github.openfeign.querydsl (CVE-2024-49203).
    //   원본은 5.1.0 이 마지막이라 패치가 나오지 않는다. 자바 패키지는 `com.querydsl.*` 로
    //   동일하므로 import 를 쓰는 소스 94개 파일은 그대로다.
    api variantOf(libs.querydsl.jpa) { classifier('jakarta') }
    annotationProcessor variantOf(libs.querydsl.apt) { classifier('jakarta') }
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // MapStruct (엔티티↔DTO 컴파일타임 매핑) + Lombok 연동 바인딩
    api libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok.mapstruct.binding

    // API Docs
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.27'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation libs.archunit.junit5
    testImplementation libs.archunit

    // testFixtures dependencies
    testFixturesApi project(':foundation')
    // ArchUnit — 아키텍처 규칙 본문(nuri.business.architecture.*Rules)이 testFixtures 에 산다.
    // 규칙은 여기 한 벌만 두고, 각 모듈의 test 가 @AnalyzeClasses + ArchTests.in(...) 으로 실행한다.
    testFixturesApi libs.archunit.junit5
    testFixturesApi libs.archunit
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.security:spring-security-test'
    testFixturesApi 'com.h2database:h2'
    testFixturesApi 'org.flywaydb:flyway-core'
    testFixturesApi libs.testcontainers.postgresql
    testFixturesApi libs.testcontainers.jdbc
    // [2026-08-07 명시화] spring-messaging — TestMessagingConfig 가 SimpMessagingTemplate 을
    //   목(mock)으로 채운다. 이것도 spring-ai 전이에 얹혀 있었다.
    testFixturesApi libs.spring.messaging
    // [2026-08-07 제거] Spring AI — 이 세 줄이 존재한 유일한 이유는 TestAiConfig 가 참조하는
    //   ChatModel/EmbeddingModel 타입을 제공하기 위해서였는데, 그 TestAiConfig 자체가
    //   참조처 0건인 死코드여서 함께 제거했다.
}

bootJar { enabled = false }
jar { enabled = true }

test {
    useJUnitPlatform()
}

// Querydsl generated source directory configuration
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
    delete querydslDir
}
