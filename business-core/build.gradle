plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':foundation')

    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api libs.spring.retry
    api libs.spring.boot.starter.aop
    
    // Domain & JPA & QueryDSL & Envers & Security
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.data:spring-data-envers'
    api 'org.hibernate.orm:hibernate-envers'
    api 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // MapStruct (엔티티↔DTO 컴파일타임 매핑) + Lombok 연동 바인딩
    api libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok.mapstruct.binding

    // API Docs
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.27'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation libs.archunit.junit5
    testImplementation libs.archunit

    // testFixtures dependencies
    testFixturesApi project(':foundation')
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.security:spring-security-test'
    testFixturesApi 'com.h2database:h2'
    testFixturesApi 'org.flywaydb:flyway-core'
    testFixturesApi 'org.testcontainers:postgresql:1.20.4'
    testFixturesApi 'org.testcontainers:jdbc:1.20.4'
    testFixturesApi platform(libs.spring.ai.bom)
    testFixturesApi libs.spring.ai.openai
    testFixturesApi libs.spring.ai.ollama
}

bootJar { enabled = false }
jar { enabled = true }

test {
    useJUnitPlatform()
}

// Querydsl generated source directory configuration
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
    delete querydslDir
}
