version: '3.8'

services:
  cubrid:
    image: cubrid/cubrid:11.3
    container_name: egov-cubrid
    hostname: cubrid-server
    ports:
      - "33000:33000"   # CUBRID Broker 포트
      - "8001:8001"     # CUBRID Manager 포트 (선택)
      - "8002:8002"     # CUBRID Manager 포트 (선택)
    environment:
      - CUBRID_DB=demodb
      - CUBRID_USER=dba
      - CUBRID_PASSWORD=
      - CUBRID_CHARSET=utf-8
      - CUBRID_LOCALE=ko_KR.utf8
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
    volumes:
      - cubrid-data:/var/lib/cubrid
      - ./DATABASE/cubrid:/docker-entrypoint-initdb.d:ro
      - ./docker/cubrid/init-db.sh:/init-db.sh:ro
    healthcheck:
      test: ["CMD", "csql", "-u", "dba", "demodb", "-c", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  cubrid-data:
    driver: local
