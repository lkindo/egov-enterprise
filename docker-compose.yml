version: "3.8"

services:
  egov-api:
    build: .
    image: egov-enterprise:latest
    container_name: egov-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/egovdb
    networks:
      - egov-net
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: egov-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: egovdb
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: egov123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - egov-net

volumes:
  postgres_data:

networks:
  egov-net:
    driver: bridge
