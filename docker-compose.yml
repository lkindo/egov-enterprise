services:
  db:
    image: postgres:17
    container_name: egov-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: egovdb
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: egov123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egov -d egovdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - egov-net

  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: egov-api
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_JSON: >
        {
          "spring": {
            "datasource": {
              "url": "jdbc:postgresql://db:5432/egovdb",
              "jdbc-url": "jdbc:postgresql://db:5432/egovdb",
              "username": "egov",
              "password": "egov123",
              "hikari": {
                "jdbc-url": "jdbc:postgresql://db:5432/egovdb"
              }
            },
            "jpa": {
              "hibernate": {
                "ddl-auto": "none"
              }
            }
          },
          "management": {
            "health": {
              "mail": {
                "enabled": false
              }
            }
          }
        }
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}
      # [2026-07-28 신설] 액세스 토큰 수명(ms). 기본값은 종전과 동일한 1시간이며, E2E 처럼 실행이
      #   1시간을 넘길 수 있는 환경에서만 바깥에서 늘린다(CI 의 e2e 잡이 주입). 늘리지 않으면
      #   토큰이 중간에 만료돼 이후 테스트가 전부 /login 리다이렉트로 죽는다(실측: CI shard 2, 66분).
      JWT_ACCESS_TOKEN_VALIDITY_MS: ${JWT_ACCESS_TOKEN_VALIDITY_MS:-3600000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
    networks:
      - egov-net

  frontend:
    build:
      context: ./frontend
    container_name: egov-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - egov-net

volumes:
  postgres_data:

networks:
  egov-net:
    driver: bridge
