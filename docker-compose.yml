version: "3.8"

services:


  db:
    image: postgres:16
    container_name: egov-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: egovdb
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: egov123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - egov-net

volumes:
  postgres_data:

networks:
  egov-net:
    driver: bridge
