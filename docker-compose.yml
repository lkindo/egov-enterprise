services:
  db:
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    container_name: egov-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: egovdb
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: egov123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egov -d egovdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - egov-net

  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: egov-api
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_JSON: >
        {
          "spring": {
            "datasource": {
              "url": "jdbc:postgresql://db:5432/egovdb",
              "jdbc-url": "jdbc:postgresql://db:5432/egovdb",
              "username": "egov",
              "password": "egov123",
              "hikari": {
                "jdbc-url": "jdbc:postgresql://db:5432/egovdb"
              }
            },
            "jpa": {
              "hibernate": {
                "ddl-auto": "none"
              }
            }
          },
          "management": {
            "health": {
              "mail": {
                "enabled": false
              }
            }
          }
        }
      # [W0-04] 활성 프로파일 주입 지점.
      #   이 compose 는 운영 배포 전용이 아니다 — CI e2e(.github/workflows/ci.yml), 주간 ZAP 스캔,
      #   로컬 개발이 모두 이 스택을 쓴다. 따라서 기본값을 prod 로 바꾸면 ALGORITHM_KEY 무기본값
      #   fail-fast 로 컨테이너가 기동조차 못 하고, jwt.cookie.secure=true 라 http://localhost E2E 의
      #   로그인 플로우가 전멸한다. 기본값은 빈 문자열(= 종전과 동일한 base 단독 구동)로 두고,
      #   운영 배포는 docker-compose.prod.yml 오버레이로 prod 를 주입한다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # [W0-02] 알려진 개발 자격증명(webmaster/TEST1 비밀번호)은 운영 마이그레이션 경로에서 분리되어
      #   classpath:db/seed-dev 로 이설됐다. 이 스택은 개발·E2E 용이므로 그 시드를 적재한다.
      #   운영 오버레이(docker-compose.prod.yml)는 이 값을 db/migration 단독으로 되돌린다.
      SPRING_FLYWAY_LOCATIONS: ${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed-dev}
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}
      # [2026-07-28 신설] 액세스 토큰 수명(ms). 기본값은 종전과 동일한 1시간이며, E2E 처럼 실행이
      #   1시간을 넘길 수 있는 환경에서만 바깥에서 늘린다(CI 의 e2e 잡이 주입). 늘리지 않으면
      #   토큰이 중간에 만료돼 이후 테스트가 전부 /login 리다이렉트로 죽는다(실측: CI shard 2, 66분).
      JWT_ACCESS_TOKEN_VALIDITY_MS: ${JWT_ACCESS_TOKEN_VALIDITY_MS:-3600000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
    networks:
      - egov-net

  frontend:
    build:
      context: ./frontend
    container_name: egov-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080/api/v1
      # [2026-08-08 신설] frontend 미들웨어는 JWT 를 **자기가 검증**하므로 서명 키가 필요하다.
      #   없으면 prod 환경에서 fail-fast 로 죽고 **모든 요청이 500** 이 된다:
      #     Error: [Middleware] prod 환경에 JWT_SECRET 이 설정되지 않았습니다
      #   종전에는 api 에만 주고 frontend 에는 주지 않았다. 이미지를 띄우는 경로가
      #   zap-scan 하나뿐이었고 그것이 고장나 있어 드러나지 않았다.
      #   ⚠ api 와 **반드시 같은 값**이어야 한다 — 다르면 발급한 토큰을 프론트가 거부한다.
      #   기본값은 api 쪽(위 JWT_SECRET)과 동일한 dev 편의용이며 운영은 바깥에서 주입한다.
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==}
    depends_on:
      api:
        condition: service_healthy
    # [2026-08-08 신설] frontend 에는 healthcheck 가 없었다.
    #   그래서 `depends_on` 으로 이 서비스를 기다릴 방법도, `docker compose up --wait` 로
    #   준비 완료를 판정할 방법도 없었다. 실제로 zap-scan 이 그 때문에 깨졌다 —
    #   컨테이너가 Started 된 30초 뒤 스캔이 시작됐는데 Next 서버는 아직 리스닝 전이었다
    #   (2026-08-02 로그: `Job spider failed to access URL http://localhost:3000`).
    #   `Started` 는 "프로세스가 떴다" 이지 "요청을 받을 준비가 됐다" 가 아니다.
    #   node:22-alpine 의 busybox wget 을 쓴다(curl 미포함).
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - egov-net

volumes:
  postgres_data:

networks:
  egov-net:
    driver: bridge
    # [J-1 · 2026-08-04] 서브넷을 **명시**한다. 이 값이 곧 신뢰 프록시 경계다.
    #
    #   운영 토폴로지가 확정됐다(사용자 답변): ① 브라우저 → Next(3001) → 백엔드(8080) 단일 홉이고,
    #   ② 백엔드 8080 이 브라우저에서 **직접 도달 가능**하다(위 api 서비스가 8080 을 호스트에 노출한다).
    #
    #   ② 때문에 remoteAddr 이 두 종류가 된다 — 프록시를 거친 요청은 이 네트워크의 주소가 찍히고,
    #   직접 온 요청은 **실제 클라이언트 주소**가 찍힌다. 종전 신뢰 목록은 사설 대역 전체
    #   (10/8·172.16/12·192.168/16)였으므로, 사내망 클라이언트가 8080 을 직접 치면 그 자신이
    #   '신뢰 프록시' 로 판정돼 **자기가 만든 X-Forwarded-For 가 채택**됐다 —
    #   레이트리밋 키·로그인 IP 제한·감사 IP 를 요청자가 임의로 바꿀 수 있었다.
    #
    #   서브넷을 고정하면 신뢰 대상을 '우리 컨테이너 네트워크' 로 정확히 좁힐 수 있고,
    #   그러면 직접 접근한 클라이언트는 신뢰되지 않아 XFF 가 무시되고 remoteAddr 이 쓰인다(정답).
    #   Docker 기본 주소 풀(172.17~172.31)과 겹치지 않도록 /24 로 좁게 잡는다.
    ipam:
      config:
        - subnet: 172.28.0.0/24
