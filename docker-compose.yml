version: "3.8"

services:
  egov-api:
    build: .
    image: egov-enterprise:latest
    container_name: egov-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/egovdb
    networks:
      - egov-net
    depends_on:
      - db

  db:
    image: cubrid/cubrid:11.3
    container_name: egov-cubrid
    shm_size: "1gb"
    privileged: true
    ports:
      - "33000:33000"
      - "30000:30000"
      - "1523:1523"
    environment:
      - CUBRID_DB_NAME=cubdb
      - CUBRID_PASSWORD=
    volumes:
      - cubrid_data:/var/lib/cubrid
    networks:
      - egov-net

volumes:
  cubrid_data:

networks:
  egov-net:
    driver: bridge
