version: "3.8"

# ====================================================
# EGOV E2E Test DB Only
# Supabase 스냅샷을 복원한 로컬 PostgreSQL만 실행
# API + Frontend는 로컬에서 직접 실행
# ====================================================

services:
  db-e2e:
    image: postgres:17
    container_name: egov-e2e-postgres
    restart: "no"
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: egovdb
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: egov123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - ./dump/e2e_full_dump.sql:/docker-entrypoint-initdb.d/01_full_dump.sql:ro
      - ./dump/init_users.sql:/docker-entrypoint-initdb.d/02_init_users.sql:ro
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egov -d egovdb"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  e2e_postgres_data:
    driver: local
