dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-web' // For LocaleResolver
    api 'org.egovframe.rte:egovframe-rte-fdl-cmmn:5.0.0' // eGovFrame Core 5.0
    api 'org.egovframe.rte:egovframe-rte-psl-dataaccess:5.0.0' // Data Access
    api 'org.egovframe.rte:egovframe-rte-fdl-idgnr:5.0.0' // ID Generation
    api 'org.egovframe.rte:egovframe-rte-fdl-property:5.0.0' // Property Service
    api 'org.egovframe.rte:egovframe-rte-fdl-logging:5.0.0' // Logging
    api 'org.egovframe.rte:egovframe-rte-fdl-crypto:5.0.0' // ARIA/SEED Crypto
    api 'org.egovframe.rte:egovframe-rte-fdl-security:5.0.0' // Security
    api 'org.egovframe.rte:egovframe-rte-ptl-mvc:5.0.0' // MVC (Pagination, etc.)
    api 'org.egovframe.rte:egovframe-rte-fdl-excel:5.0.0' // Excel
    
    api 'org.apache.commons:commons-lang3:3.17.0'
    api 'com.ibm.icu:icu4j:75.1' // For EgovDateUtil (ChineseCalendar)
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'jakarta.validation:jakarta.validation-api' // Validation
}
