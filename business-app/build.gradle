plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':business-core')

    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api libs.spring.retry
    api libs.spring.boot.starter.aop
    // [2026-08-07 명시화] spring-messaging — NotificationService 가 SimpMessagingTemplate 로
    //   STOMP 알림을 발행한다. 종전에는 선언 없이 spring-ai 전이에 얹혀 있었다.
    api libs.spring.messaging
    
    // Domain & JPA & QueryDSL & Envers & Security
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.data:spring-data-envers'
    api 'org.hibernate.orm:hibernate-envers'
    // [2026-08-07 이관] com.querydsl -> io.github.openfeign.querydsl (CVE-2024-49203).
    //   원본은 5.1.0 이 마지막이라 패치가 나오지 않는다. 자바 패키지는 `com.querydsl.*` 로
    //   동일하므로 import 를 쓰는 소스 94개 파일은 그대로다.
    api variantOf(libs.querydsl.jpa) { classifier('jakarta') }
    annotationProcessor variantOf(libs.querydsl.apt) { classifier('jakarta') }
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // MapStruct (엔티티↔DTO 컴파일타임 매핑) + Lombok 연동 바인딩
    api libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok.mapstruct.binding

    // API Docs
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.27'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation libs.archunit.junit5
    testImplementation libs.archunit

    // testFixtures — business-core 의 것을 그대로 재노출한다.
    // 종전에는 18개 클래스(604 LOC)를 FQN 까지 동일하게 복제해 두고 있었고, api-server 가 양쪽
    // testFixtures 를 동시에 의존해 같은 이름의 클래스가 클래스패스 순서로 서로를 가리는 상태였다.
    // 여기서 재노출하면 business-app 자신의 test 와 api-server 양쪽이 단일 사본을 본다.
    testFixturesApi testFixtures(project(':business-core'))
}

bootJar { enabled = false }
jar { enabled = true }

test {
    useJUnitPlatform()
}

// Querydsl generated source directory configuration
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
    delete querydslDir
}
