# gitleaks 설정 — 시크릿 스캔 게이트(.github/workflows/ci.yml 의 secret-scan 잡)
#
# [이 파일의 성격 — 먼저 읽을 것]
# 이것은 **예외 목록**이다. §0.7-H2 가 경계하는 바로 그 종류의 파일이므로 규율을 명시한다.
#
#   1. 항목은 **값 단위**로 적는다. 경로 단위 면제는 그 파일에 훗날 진짜 시크릿이 들어와도
#      조용히 통과시키므로, 불가피한 경우(아래 §3)에만 쓰고 사유를 붙인다.
#   2. 항목마다 **왜 시크릿이 아닌지**를 적는다. 사유 없는 줄은 리뷰에서 거부한다.
#   3. 추가하기 전에 자문한다 — **"이건 시크릿이 아닌가, 아니면 내가 red 를 없애고 싶은가?"**
#   4. 이 파일이 길어지면 그 자체가 신호다. 2026-08-03 기준 항목 4개 / 워킹트리 findings 12건.
#
# [게이트 범위 — 왜 히스토리 전량이 아닌가]
# 종전 CI 는 `gitleaks detect --source .` 로 히스토리 전량을 스캔했고, 신설된 날부터 계속 red 였다.
# 실측(2026-08-03): leak 1351건이 전부 **이미 공개된 과거**에서 나온다 —
#   playwright 인증상태 json 2092 · api-server/LOG_FILE_IS_UNDEFINED 로그 366 ·
#   테스트 출력 txt · dump/supabase_full.sql 등. 전부 현재 HEAD 에는 없는 파일이다.
# 되돌릴 수 없는 과거 때문에 게이트가 원리적으로 초록이 될 수 없으면, 아무도 보지 않게 되어
# 신설 목적(신규 유입 차단)이 사라진다. 그래서 CI 게이트는 **워킹트리 + 증분**만 본다.
# 히스토리 전량 스캔은 `secret-scan-history.yml`(수동 실행)로 분리했다 — 감사에는 쓰되 머지 게이트로는 안 쓴다.
# 이미 공개된 유출의 해법은 목록화가 아니라 **로테이션**이며, 그 추적은
# docs/04-operations/crypto-key-rotation.md · docs/04-operations/pending-decisions.md 가 담당한다.

title = "eGov Enterprise gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "값 단위 예외 — 각 항목의 사유는 아래 주석 참조"

regexes = [
  # ── §1 공개 dev JWT 시크릿 (10개 파일에서 동일 값) ─────────────────────────────────
  #   이 값은 **의도적으로 공개**된 개발 기본값이다. 백엔드(JwtTokenProvider)와 프론트
  #   미들웨어가 같은 raw bytes 로 HMAC 해야 로그인이 성립하므로 dev/e2e 양쪽에 같은 값을 둔다.
  #   운영에서 이 값이 쓰이는 경로는 차단돼 있다:
  #     · frontend/src/middleware.ts — NODE_ENV=production 이고 JWT_SECRET 미설정이면 모듈 로드 시 throw
  #     · docker-compose.prod.yml — `${JWT_SECRET:?...}` 로 미설정 시 기동 거부
  #     · SecretLiteralLinterTest — 운영 설정 파일에 시크릿 리터럴이 들어오면 별도로 red
  #   즉 "노출된 값" 이 아니라 "노출을 전제로 설계된 값" 이다.
  '''dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1lZ292LWVudGVycHJpc2UtbW9kZXJuaXphdGlvbg==''',

  # ── §2 명시적 더미 값 ────────────────────────────────────────────────────────────
  #   application-e2e.yml 의 OpenAI 키. 값 자체가 'dummy...' 이고 해당 기능은 enabled: false 다.
  '''dummy-api-key-for-e2e''',

  # ── §3 위조 토큰 (거부되는 것을 증명하는 테스트 자산) ──────────────────────────────
  #   frontend/e2e/23-security-auth-supplement.spec.ts 가 미들웨어의 서명 검증·alg 화이트리스트를
  #   증명하려고 **일부러 만든 잘못된 토큰**이다. 서명이 'invalidsig' 이거나 alg=none 이라
  #   어떤 시스템에서도 유효하지 않다. 이 토큰이 통과하면 그게 결함이고, 그것을 잡는 것이 이 테스트다.
  '''eyJhbGciOiJIUzUxMiJ9\.eyJzdWIiOiJVU1JDTkZSTV8wMDAwMDAwMDAwMSIsInJvbGUiOiJST0xFX0FETUlOIiwiZXhwIjo5OTk5OTk5OTk5fQ\.invalidsig''',
  '''eyJhbGciOiJub25lIn0\.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJST0xFX0FETUlOIiwiZXhwIjo5OTk5OTk5OTk5fQ\.''',

  # ── §4 테스트 전용 리터럴 (이름 자체가 용도를 밝힌다) ────────────────────────────────
  #   frontend/src/__tests__/middleware.test.ts — 서명 검증이 **다른 키를 거부하는지** 증명하려면
  #   서로 다른 두 시크릿이 소스에 있어야 한다. 값 이름이 곧 용도다.
  '''middleware-test-secret-0123456789-abcdefghijklmnop''',
  '''a-different-secret-that-must-not-verify-0987654321''',
  #   api-server/src/test/resources/application.yml — 테스트 컨텍스트 전용 jwt.secret.
  #   이 파일은 test 소스셋에만 있어 배포 아티팩트에 포함되지 않는다.
  '''9dd453ca8e726ed8e34d809cd15ce34477f5c2cd136cf9ce0c035513d8d4b492''',
]

# ── §4 경로 단위 예외 (불가피한 경우만) ────────────────────────────────────────────
#   SecretLiteralLinterTest 는 "운영 설정에 시크릿 리터럴이 있는가" 를 검사하는 **탐지기 자신**이다.
#   그 판정 패턴(JWT_SECRET="..." 형태의 예시 문자열)이 gitleaks 에 시크릿으로 잡히는
#   메타 오탐이라, 값 단위로 적으면 린터의 패턴을 여기 복제해 두 파일이 함께 드리프트한다.
#   이 파일은 상수 선언만 있고 실제 자격증명을 담을 이유가 없으므로 경로로 면제한다.
#   (하네스 매니페스트가 이 클래스의 상수 집합을 sha256 으로 동결하므로, 내용이 바뀌면 그쪽이 red 다.)
paths = [
  '''api-server/src/test/java/nuri/api/harness/SecretLiteralLinterTest\.java''',

  # ── §6 빌드 산출물·의존성 저장소 (git 추적 대상이 아니다) ──────────────────────────
  #   CI 는 신선 체크아웃이라 이 경로들이 존재하지 않으므로 CI 결과에는 영향이 없다.
  #   로컬에서 `--no-git` 스캔을 돌리면 .gitignore 된 산출물까지 훑어 실측 87건이 나오는데,
  #   그중 75건이 pnpm store 안의 **서드파티 패키지 테스트 픽스처**다(우리 시크릿이 아니다).
  #   로컬과 CI 의 판정이 갈리면 개발자가 게이트를 신뢰하지 않게 되므로 여기서 맞춘다.
  '''frontend/\.pnpm-store/''',
  '''frontend/\.next/''',
  '''frontend/playwright/\.auth/''',
  '''(^|/)build/''',
  '''(^|/)logs/''',
  '''(^|/)node_modules/''',
  '''database/dumps/''',
  #   ⚠ `.env` 와 `ssh-key-*.key` 는 **면제하지 않는다.** 둘 다 gitignore 되어 있지만,
  #     로컬 스캔에서 걸리는 것이 정상이고 그 신호는 유지되어야 한다
  #     (디스크의 ssh-key-2026-01-18.key 는 아직 삭제되지 않았다 — pending-decisions.md 참조).
]
