plugins {
    id 'org.springframework.boot'
}

// 레거시 → 표준 스키마 데이터 이관 CLI 도구 (독립 실행, foundation 미의존 = lean).
// 파생 프로젝트가 이관 시에만 선택 포함한다. 설계: docs/02-architecture/legacy-migration-tool-design.md
dependencies {
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly libs.postgresql

    testImplementation 'com.h2database:h2'
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit.jupiter
    // Testcontainers 2 는 모듈 좌표에 testcontainers- 접두를 붙였다(버전은 Boot 4 BOM 관리).
    testImplementation 'org.testcontainers:testcontainers-oracle-free'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    testImplementation 'org.testcontainers:testcontainers-mssqlserver'
    testRuntimeOnly 'com.oracle.database.jdbc:ojdbc11:23.26.3.0.0'
    testRuntimeOnly 'com.mysql:mysql-connector-j:26.10.0'
    testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
    // SQL Server 는 실측한 드라이버 조합(13.6.0.0)만 허용한다(SqlServerSourceAdapter·SqlServerDiscoveryVisibilityProof).
    // 이 판은 그 조합을 시험하는 드라이버라 따로 올리지 않는다 — 올리려면 새 드라이버로 다시 실측하고 허용 판·시험을 함께 바꾼다.
    testRuntimeOnly 'com.microsoft.sqlserver:mssql-jdbc:13.6.0.jre11'
    testRuntimeOnly libs.postgresql
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 온라인 주민번호 변환기 호환 계약 시험 전용(DEC-OPS-308). 시험이 온라인 원본(변환기·CryptoUtil·암호 설정)을
    // 직접 컴파일해 돌리는 데 필요한 외부 라이브러리다. 실행 classpath 에는 들어가지 않고, Gradle 프로젝트 의존도 아니다
    // (이관 모듈은 온라인 프로젝트에 의존하지 않는다 — 생성 제품 검사·이관 단독 제품의 시험 컴파일).
    // eGov 암호가 끌어오는 log4j-slf4j2-impl 은 루트 build.gradle 의 configurations.all 이 모든 모듈에서 뺀다.
    testImplementation libs.egovframe.rte.fdl.crypto
    testImplementation 'jakarta.persistence:jakarta.persistence-api'
    testRuntimeOnly 'org.projectlombok:lombok'
}

bootJar {
    enabled = true
    mainClass = 'nuri.migration.MigrationToolApplication'
}
jar { enabled = false }

// The crash drill starts a fresh JVM; Gradle's worker java.class.path is not the test runtime classpath.
tasks.named('test', Test) {
    dependsOn tasks.named('bootJar')
    inputs.files(rootProject.files(
            'tools/migration-workspace/engine.mjs',
            'tools/migration-workspace/store.mjs',
            'tools/migration-workspace/inputs.mjs'))
            .withPropertyName('migrationWorkspaceEngine')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(tasks.named('bootJar').flatMap { it.archiveFile })
            .withPropertyName('migrationDrillJar')
            .withPathSensitivity(PathSensitivity.NONE)
    doFirst {
        systemProperty 'migration.drill.classpath', classpath.asPath
        systemProperty 'migration.drill.jar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    }
}

// PIT runs the same crash drill in its own minion JVM, outside Gradle's Test task.
tasks.named('pitest') { dependsOn tasks.named('bootJar') }
pitest {
    // These new subprocess probes execute the ordinary classpath/JAR, so they cannot kill
    // transform/validate/verify mutants in the four required CI scopes. Keep them in the
    // full local nuri.* analysis, where their parent artifact/adapter checks can matter.
    if (targetClasses.get().toSet() == ['nuri.migration.transform.TransformerRegistry'].toSet()
            || targetClasses.get().toSet() == ['nuri.migration.transform.TypeConverter',
                    'nuri.migration.transform.CodeTranslator'].toSet()
            || targetClasses.get().toSet() == ['nuri.migration.validate.*'].toSet()
            || targetClasses.get().toSet() == ['nuri.migration.verify.*'].toSet()) {
        excludedTestClasses = [
                'nuri.migration.EtlMySqlCrashRecoveryIntegrationTest',
                'nuri.migration.MySqlPackagedCliIntegrationTest',
                'nuri.migration.EtlMariaDbCrashRecoveryIntegrationTest',
                'nuri.migration.MariaDbPackagedCliIntegrationTest',
                'nuri.migration.EtlSqlServerCrashRecoveryIntegrationTest',
                'nuri.migration.SqlServerPackagedCliIntegrationTest',
                'nuri.migration.EtlOracleCrashRecoveryIntegrationTest',
                'nuri.migration.OraclePackagedCliIntegrationTest'
        ]
    }
    jvmArgs.add(providers.provider {
        "-Dmigration.drill.classpath=${sourceSets.test.runtimeClasspath.asPath}".toString()
    })
    jvmArgs.add(providers.provider {
        "-Dmigration.drill.jar=${tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath}".toString()
    })
}
